<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar – Prova X</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F8FAFC;color:#111827;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .box{width:100%;max-width:400px;background:#fff;border:1px solid #E5E7EB;border-radius:18px;padding:28px 26px;box-shadow:0 20px 50px rgba(15,23,42,.07);}
  .logo{display:flex;align-items:center;gap:8px;justify-content:center;text-decoration:none;margin-bottom:18px;}
  .logo span{font-weight:800;font-size:1.35rem;letter-spacing:-0.03em;background:linear-gradient(to right,#FF8040,#FF4D00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
  h1{font-size:1.25rem;font-weight:700;letter-spacing:-0.02em;text-align:center;}
  p.sub{font-size:0.85rem;color:#6B7280;text-align:center;margin-top:6px;}
  .ctx{margin:18px 0 4px;border:1px solid #E5E7EB;border-radius:12px;padding:11px 13px;background:#FFF7ED;font-size:0.82rem;color:#9A3412;}
  label{display:block;font-size:0.8rem;font-weight:500;color:#374151;margin:14px 0 6px;}
  input{width:100%;border:1px solid #E5E7EB;border-radius:10px;padding:11px 12px;font-size:0.9rem;font-family:inherit;background:#FBFBFC;}
  input:focus{outline:none;border-color:#FF8040;}
  button{width:100%;margin-top:18px;border:none;border-radius:12px;padding:12px;font-size:0.92rem;font-weight:700;color:#fff;background:linear-gradient(to right,#FF8040,#FF4D00);cursor:pointer;font-family:inherit;}
  .alt{margin-top:14px;text-align:center;font-size:0.8rem;color:#6B7280;}
  .alt a{color:#FF4D00;text-decoration:none;font-weight:600;}
</style>
</head>
<body>
  <form class="box" id="f">
    <a class="logo" href="index.html">
      <svg width="26" height="26" viewBox="0 0 28 28" fill="none"><rect width="28" height="28" rx="8" fill="#FF4D00"/><path d="M8 10h12M8 14h8M8 18h10" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
      <span>Prova X</span>
    </a>
    <h1>Entre para acessar o curso</h1>
    <p class="sub">Use seu e-mail para continuar de onde parou.</p>
    <div class="ctx" id="ctx" style="display:none;"></div>
    <label for="email">E-mail</label>
    <input id="email" type="email" placeholder="voce@email.com" required>
    <label for="senha">Senha</label>
    <input id="senha" type="password" placeholder="••••••••" required>
    <button type="submit">Entrar e acessar →</button>
    <div class="alt">Ainda não tem conta? <a href="pricing.html">Criar conta</a></div>
  </form>
<script>
  const params = new URLSearchParams(location.search);
  const next = params.get('next') || 'home.html';
  const curso = params.get('curso');
  if (curso) {
    const c = document.getElementById('ctx');
    c.textContent = 'Você está acessando: ' + decodeURIComponent(curso);
    c.style.display = '';
  }
  document.getElementById('f').addEventListener('submit', e => {
    e.preventDefault();
    location.href = decodeURIComponent(next);
  });
</script>
</body>
</html>
