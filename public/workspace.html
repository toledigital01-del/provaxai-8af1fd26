<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspace – Prova X</title>
<link rel="stylesheet" href="shell.css">
<style>
  .ws { display:grid; grid-template-columns: minmax(0,1fr) var(--ws-right-w,360px); height:100%; position:relative; }
  .ws-resize { position:absolute; top:0; bottom:0; left:calc(100% - var(--ws-right-w,360px) - 4px); width:8px; cursor:col-resize; z-index:6; touch-action:none; }
  .ws-resize:hover, .ws-resize.dragging { background:rgba(37,99,235,.18); }
  @media (max-width: 1200px) { .ws { grid-template-columns: minmax(0,1fr); height:auto; } .ws-right { border-left:none; border-top:1px solid var(--line); } .ws-resize { display:none; } }
  .fixa { margin-top:26px; padding-top:18px; border-top:1px solid var(--line); }
  .fixa .lbl { font-size:0.95rem; font-weight:600; }
  .fixa .btns { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .fixa .btns button { flex:1 1 220px; border-radius:10px; padding:11px 14px; font-size:0.86rem; font-weight:600; cursor:pointer; font-family:inherit; }
  .btn-primary { background:#0B2A5B; color:#fff; border:1px solid #0B2A5B; }
  .btn-secondary { background:#fff; color:var(--text); border:1px solid var(--line-strong); }
  .scope-pick { display:flex; align-items:center; gap:8px; margin-top:16px; flex-wrap:wrap; }
  .scope-pick select { border:1px solid var(--line-strong); border-radius:9px; padding:8px 10px; font-family:inherit; font-size:0.85rem; background:#fff; }

  /* Revisão Inteligente */
  .rz-bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .rz-bar button, .rz-bar select { border:1px solid var(--line-strong); background:#fff; border-radius:9px; padding:8px 12px; font-size:0.82rem; font-family:inherit; cursor:pointer; color:#4A5162; }
  .rz-bar button.on { background:#0B2A5B; border-color:#0B2A5B; color:#fff; }
  .rz-bar .icobtn { display:inline-flex; align-items:center; gap:7px; font-weight:600; }
  .rz-bar .icobtn svg { width:15px; height:15px; }
  mark.hl { background:#FEF3C7; border-bottom:1.5px solid #F59E0B; padding:1px 2px; border-radius:3px; color:inherit; }
  .gap { display:inline-flex; align-items:center; gap:6px; vertical-align:baseline; background:#F8FAFC; border:1px dashed var(--line-strong); border-radius:8px; padding:2px 8px; margin:2px 0; }
  .gap select { border:1px solid var(--line-strong); border-radius:7px; padding:3px 6px; font-family:inherit; font-size:0.82rem; }
  .gap .cand { font-weight:600; }
  .gap .gbtn { border:1px solid var(--line-strong); background:#fff; border-radius:6px; padding:2px 8px; font-size:0.72rem; font-weight:700; cursor:pointer; font-family:inherit; }
  .gap.ok { background:#F2FDF5; border-color:#22C55E; border-style:solid; }
  .gap.no { background:#FEF3F2; border-color:#EF4444; border-style:solid; }




  .ws-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; font-size:0.86rem; color:#4A5162; cursor:pointer; transition:background .14s, color .14s; }
  .ws-item:hover { background:#F2F2F3; color:var(--text); }
  .ws-item.active { background:#EDEDEE; color:var(--text); font-weight:600; }
  .ws-item .ic { width:18px; text-align:center; font-size:0.9rem; }

  .ws-center { overflow-y:auto; padding:26px 34px 80px; }
  .ws-center h1 { font-size:1.5rem; font-weight:700; letter-spacing:-0.025em; }
  .pane { animation: fade .18s ease; }
  @keyframes fade { from { opacity:0; transform:translateY(4px);} to { opacity:1; transform:none;} }
  .prose { font-size:0.92rem; line-height:1.75; color:#31363F; margin-top:18px; }
  .prose h3 { font-size:1rem; font-weight:600; color:var(--text); margin:22px 0 8px; }
  .prose ul { margin:8px 0 8px 18px; }
  .prose li { margin:4px 0; }

  .fc { border:1px solid var(--line); border-radius:14px; padding:36px 24px; text-align:center; margin-top:20px; cursor:pointer; min-height:190px; display:grid; place-items:center; transition:border-color .16s; background:#fff; }
  .fc:hover { border-color:var(--line-strong); }
  .fc .q { font-size:1.05rem; font-weight:600; }
  .fc .a { font-size:0.9rem; color:var(--muted); margin-top:12px; }
  .mini { display:flex; gap:8px; margin-top:14px; }
  .mini button { border:1px solid var(--line-strong); background:#fff; border-radius:8px; padding:7px 14px; font-size:0.82rem; cursor:pointer; font-family:inherit; color:#4A5162; }
  .mini button:hover { background:#F6F6F7; }

  .qbox { border:1px solid var(--line); border-radius:12px; padding:18px; margin-top:16px; }
  .opt { display:flex; gap:10px; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:9px; margin-top:8px; font-size:0.88rem; cursor:pointer; transition:all .14s; }
  .opt:hover { background:#FAFAFA; border-color:var(--line-strong); }
  .opt.ok { border-color:#22C55E; background:#F2FDF5; }
  .opt.no { border-color:#EF4444; background:#FEF3F2; }

  .cesp-head { margin-top:18px; display:flex; flex-direction:column; gap:4px; }
  .cesp-head b { font-size:0.95rem; }
  .cesp-head span { font-size:0.8rem; color:var(--muted); }
  .qtxt { font-size:0.9rem; line-height:1.6; }
  .ce { display:flex; align-items:center; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .ce-btn { border:1px solid var(--line-strong); background:#fff; border-radius:8px; padding:7px 16px; font-size:0.8rem; font-weight:700; letter-spacing:.03em; cursor:pointer; font-family:inherit; color:#4A5162; }
  .ce-btn:hover { background:#F6F6F7; }
  .ce-btn.sel { background:#0B2A5B; border-color:#0B2A5B; color:#fff; }
  .ce-fb { font-size:0.8rem; color:var(--muted); }
  .qbox.ok { border-color:#22C55E; background:#F6FDF8; }
  .qbox.no { border-color:#EF4444; background:#FEF6F5; }
  .rev-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); font-size:0.88rem; }
  .rev-row:last-child { border-bottom:none; }
  .rev-when { font-size:0.8rem; color:var(--muted); }

  .ws-chat { margin-top:20px; border-top:1px solid var(--line); padding-top:16px; }
  .ws-chat .rlbl { font-size:0.68rem; text-transform:uppercase; letter-spacing:.08em; color:#A6ACBB; font-weight:600; margin-bottom:10px; }
  .ws-chat .log { display:flex; flex-direction:column; gap:8px; max-height:46vh; overflow-y:auto; }
  .ctxchip { font-size:0.72rem; color:#154C9B; background:#EEF2FF; border:1px solid #E8EEF9; border-radius:999px; padding:4px 9px; display:inline-block; margin-bottom:10px; }
  .ctxsep { font-size:0.66rem; text-transform:uppercase; letter-spacing:.06em; color:#A6ACBB; text-align:center; margin:4px 0; }

  .ws-chat .b { font-size:0.82rem; line-height:1.55; padding:8px 10px; border-radius:10px; background:#fff; border:1px solid var(--line); }
  .ws-chat .b.me { background:var(--text); color:#fff; border-color:var(--text); align-self:flex-end; max-width:90%; }
  .ws-chat form { display:flex; gap:6px; margin-top:10px; }
  .ws-chat input { flex:1; min-width:0; border:1px solid var(--line-strong); border-radius:9px; padding:8px 10px; font-size:0.82rem; font-family:inherit; outline:none; }
  .ws-chat button { border:none; background:#0B2A5B; color:#fff; border-radius:9px; padding:0 12px; font-size:0.8rem; font-weight:600; cursor:pointer; }

  .chatlog { margin-top:18px; display:flex; flex-direction:column; gap:12px; }
  .bub { max-width:80%; padding:11px 14px; border-radius:12px; font-size:0.88rem; line-height:1.6; }
  .bub.ai { background:#F5F5F6; }
  .bub.me { background:var(--text); color:#fff; align-self:flex-end; }
  .composer { display:flex; gap:8px; margin-top:16px; }
  .composer input { flex:1; border:1px solid var(--line-strong); border-radius:9px; padding:10px 12px; font-size:0.88rem; font-family:inherit; outline:none; }
  .composer button { border:none; background:#0B2A5B; color:#fff; border-radius:9px; padding:0 16px; font-size:0.85rem; font-weight:600; cursor:pointer; }

  textarea.notes { width:100%; min-height:280px; border:1px solid var(--line); border-radius:12px; padding:16px; font-size:0.9rem; line-height:1.7; font-family:inherit; resize:vertical; outline:none; margin-top:18px; }
  textarea.notes:focus { border-color:var(--line-strong); }

  .ws-right { border-left:1px solid var(--line); padding:22px 18px; overflow-y:auto; background:var(--bg-soft); }
  .ws-right h2 { font-size:0.95rem; font-weight:600; letter-spacing:-0.01em; }
  .stat-row { display:flex; align-items:baseline; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line); font-size:0.82rem; color:var(--muted); }
  .stat-row b { font-size:0.92rem; color:var(--text); font-weight:600; font-variant-numeric:tabular-nums; }
  .rtabs { display:flex; gap:4px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:3px; }
  .rtab { flex:1; border:none; background:transparent; border-radius:8px; padding:7px 8px; font-size:0.8rem; font-weight:600; color:var(--muted); cursor:pointer; font-family:inherit; }
  .rtab.active { background:#EEF2FF; color:#0B2A5B; }
  .reco { margin-top:18px; }
  .reco .rlbl { font-size:0.68rem; text-transform:uppercase; letter-spacing:.08em; color:#A6ACBB; font-weight:600; margin-bottom:10px; }
  .reco a { display:block; padding:8px 10px; background:rgba(255,251,235,.6); border:1px solid rgba(253,230,138,.6); border-radius:8px; font-size:0.84rem; text-decoration:none; color:var(--text); margin-bottom:7px; }
  .reco a:hover { border-color:#F59E0B; }

  /* ---------- Podcast ---------- */
  .pod { margin-top:20px; border:1px solid #E2E8F0; border-radius:16px; padding:18px 20px 16px; background:linear-gradient(120deg,#E8EEF9 0%,#F1F5F9 45%,#EEF2FF 100%); }
  .pod-top { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .pod-hosts { display:flex; }
  .pod-av { width:34px; height:34px; border-radius:50%; display:grid; place-items:center; font-size:0.8rem; font-weight:700; color:#fff; border:2px solid #fff; flex-shrink:0; }
  .pod-av.a { background:#4F46E5; }
  .pod-av.s { background:#0B2A5B; }
  .pod-hosts .pod-av + .pod-av { margin-left:-10px; }
  .pod-id { flex:1; min-width:150px; }
  .pod-id b { display:block; font-size:1rem; font-weight:700; letter-spacing:-0.01em; }
  .pod-id span { display:flex; align-items:center; gap:5px; font-size:0.78rem; color:var(--muted); margin-top:3px; }
  .pod-id svg { width:13px; height:13px; }
  .pod-hand { display:inline-flex; align-items:center; gap:7px; border:1px solid #C7D2FE; background:#fff; color:#154C9B; border-radius:999px; padding:8px 16px; font-size:0.83rem; font-weight:600; cursor:pointer; font-family:inherit; }
  .pod-hand:hover { background:#EEF2FF; }
  .pod-range { -webkit-appearance:none; appearance:none; width:100%; height:5px; border-radius:999px; margin-top:18px; outline:none;
    background:linear-gradient(90deg,#0B2A5B var(--p,0%), #D7DEE9 var(--p,0%)); cursor:pointer; }
  .pod-range::-webkit-slider-thumb { -webkit-appearance:none; width:13px; height:13px; border-radius:50%; background:#154C9B; border:2px solid #fff; box-shadow:0 1px 4px rgba(15,23,42,.25); }
  .pod-range.sm { width:100px; margin-top:0; --p:70%; }
  .pod-times { display:flex; justify-content:space-between; font-size:0.72rem; color:var(--muted); margin-top:6px; font-variant-numeric:tabular-nums; }
  .pod-ctrl { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:8px; }
  .pod-vol { display:flex; align-items:center; gap:8px; color:#64748B; }
  .pod-vol svg { width:17px; height:17px; }
  .pod-mid { display:flex; align-items:center; gap:14px; }
  .pod-skip { border:none; background:transparent; color:#334155; cursor:pointer; padding:4px; }
  .pod-skip svg { width:19px; height:19px; }
  .pod-play { width:46px; height:46px; border-radius:50%; border:none; background:#1E293B; color:#fff; font-size:0.95rem; cursor:pointer; display:grid; place-items:center; box-shadow:0 6px 16px rgba(30,41,59,.28); }
  .pod-play:hover { background:#0F172A; }
  .pod-rate { border:none; background:transparent; color:#64748B; font-size:0.8rem; font-weight:600; cursor:pointer; font-family:inherit; }
  .pod-script { margin-top:18px; border:1px solid var(--line); border-radius:16px; background:#fff; padding:18px; display:flex; flex-direction:column; gap:16px; }
  .pod-line { display:flex; gap:10px; align-items:flex-start; }
  .pod-line.me { flex-direction:row-reverse; }
  .pod-b { max-width:82%; }
  .pod-who { font-size:0.74rem; color:var(--muted); display:block; margin-bottom:4px; }
  .pod-line.me .pod-who { text-align:right; }
  .pod-msg { font-size:0.88rem; line-height:1.65; padding:11px 14px; border-radius:12px; background:#F1F5F9; color:#31363F; }
  .pod-line.me .pod-msg { background:#E8EEF9; }
  .pod-foot { display:flex; gap:8px; margin-top:14px; }
  .pod-foot button { width:38px; height:38px; border-radius:999px; border:1px solid var(--line-strong); background:#fff; color:#475569; cursor:pointer; display:grid; place-items:center; }
  .pod-foot button:hover { border-color:#0B2A5B; color:#154C9B; }
  .pod-foot svg { width:17px; height:17px; }

</style>
  <script src="px-guard.js"></script>
  <script src="px-kb.js"></script>
</head>
<body>
<aside id="shell-sidebar"></aside>
<div class="shell-main">
  <header id="shell-topbar"></header>
  <div class="shell-body" style="overflow:hidden;">
    <div class="ws">
      

      <section class="ws-center">
        <a class="page-back" id="page-back" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          <span id="page-back-label"></span>
        </a>
        <div class="crumb" id="crumb"></div>
        <h1 id="t-title"></h1>
        <p class="subtitle" id="t-sub"></p>
        <div id="pane"></div>
      </section>

      <div class="ws-resize" id="ws-resize" title="Arraste para redimensionar"></div>
      <aside class="ws-right" id="ws-right"></aside>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="shell.js"></script>
<script>


const params = new URLSearchParams(location.search);
const id = params.get('id') || 'prf-2021';
const mat = materialById(id);
const title = params.get('title') || (mat ? mat.title : 'Material');
const type = params.get('type') || (mat ? mat.type : 'Material');
const allDiscs = disciplinasDe(id);
const scope = params.get('scope') === 'geral' ? 'geral' : (params.get('scope') === 'disc' ? 'disc' : 'topico');
const disc = params.get('disc') || allDiscs[0];
const topic = params.get('topic') || (TOPICS[disc] || ['Tópico'])[0];
const base = `id=${encodeURIComponent(id)}&type=${encodeURIComponent(type)}&title=${encodeURIComponent(title)}`;
const discHref = `disciplina.html?${base}&disc=${encodeURIComponent(disc)}`;
if (scope === 'topico') {
  try { pxLastSet({ id, type, title, disc, topic }); } catch (e) {}
  try {
    if (window.PX && PX.ready) PX.ready.then(() => {
      if (!PX.user) return;
      PX.saveProgress({ course: id, disc, topic, status: statusOf(topic), dominio: progressOf(topic) });
      PX.logSession(disc, topic, 'workspace', 0);
    });
  } catch (e) {}
}



/* escopo geral: o aluno escolhe a disciplina dentro da própria ferramenta */
let selDisc = scope === 'geral' ? (params.get('disc') || 'all') : disc;
function poolTopics() {
  if (scope === 'topico') return [topic];
  const ds = scope === 'disc' ? [disc] : (selDisc === 'all' ? allDiscs : [selDisc]);
  return ds.flatMap(d => (TOPICS[d] || []).map(t => ({ t, d })));
}
function ctxLabel() {
  if (scope === 'topico') return `${topic} · ${disc}`;
  if (scope === 'disc') return `${disc} · todos os tópicos`;
  return selDisc === 'all' ? `${title} · todo o edital` : `${title} · ${selDisc}`;
}
function scopePickerHTML() {
  if (scope !== 'geral') return '';
  return `<div class="scope-pick"><span style="font-size:0.82rem;color:var(--muted);">Disciplina:</span>
    <select id="scope-sel"><option value="all"${selDisc==='all'?' selected':''}>Todas as disciplinas</option>
    ${allDiscs.map(d => `<option value="${d}"${selDisc===d?' selected':''}>${d}</option>`).join('')}</select></div>`;
}
function mountScopePicker() {
  const s = document.getElementById('scope-sel');
  if (s) s.onchange = () => { selDisc = s.value; fcIdx = 0; fcOpen = false; renderPane(); };
}

document.getElementById('page-back').href = scope === 'geral' ? `disciplinas.html?${base}` : discHref;
document.getElementById('page-back-label').textContent = scope === 'geral' ? title : disc;

document.getElementById('crumb').innerHTML =
  `<a href="study-sets.html">Meus Concursos</a><span class="sep">/</span>` +
  (allDiscs.length > 1 ? `<a href="disciplinas.html?${base}">${title}</a>` : `<span>${title}</span>`) +
  (scope === 'geral' ? '' :
    `<span class="sep">/</span><a href="${discHref}">${disc}</a>` +
    (scope === 'topico' ? `<span class="sep">/</span><span>${topic}</span>` : ''));

const stats = topicStats(scope === 'topico' ? topic : disc);
const sm = STATUS_META[stats.status];
document.getElementById('t-title').textContent = scope === 'topico' ? topic : (scope === 'disc' ? disc : title);
document.getElementById('t-sub').innerHTML = scope === 'topico'
  ? `${dotHTML(stats.status)} ${sm.label} · ${disc}`
  : ctxLabel();

/* ---------- Coluna esquerda ---------- */
const TABS = WS_TABS;
let tab = params.get('tab') || 'tutor';


renderShell({
  active: 'materiais',
  topicNav: {
    items: wsMenuHTML(t => `<div class="ws-item${t.id === tab ? ' active' : ''}" data-t="${t.id}"><span class="ic">${t.ic}</span><span>${t.label}</span></div>`),
  },
});

document.getElementById('shell-sidebar').addEventListener('click', e => {
  const el = e.target.closest('.ws-item');
  if (!el) return;
  goTab(el.dataset.t);
});


/* ---------- Coluna central ---------- */
let fcIdx = 0, fcOpen = false;

/* ---------- Revisão Inteligente (resumo + lacunas) ---------- */
let rzOn = false, rzGap = false, rzMode = 'ce';
function rzSubject() { return scope === 'topico' ? topic : (scope === 'disc' ? disc : (selDisc === 'all' ? title : selDisc)); }
function rzBlocks() {
  const s = rzSubject(), l = s.toLowerCase();
  return [
    { t: `Conceito central`, p: [
      ['Em ', null], ['regra geral', 'chave'], [`, ${l} é definido pela norma como o núcleo do tema — é daqui que a banca extrai a maior parte dos itens.`, null],
    ]},
    { t: `Requisitos`, p: [
      ['A aplicação depende de ', null], ['requisitos formais e prazos', 'chave'], [' previstos em lei; a ausência de qualquer um deles ', null], ['invalida o ato', 'chave'], ['.', null],
    ]},
    { t: `Exceções`, p: [
      ['A regra não se aplica quando houver ', null], ['previsão legal expressa em sentido contrário', 'chave'], [`, hipótese em que prevalece a norma especial sobre a geral.`, null],
    ]},
    { t: `Pegadinha clássica`, p: [
      ['A banca costuma trocar ', null], ['competência por atribuição', 'chave'], [' e inverter ', null], ['o prazo aplicável', 'chave'], [`, mudando totalmente o gabarito de ${l}.`, null],
    ]},
  ];
}
function rzDistractor(txt) {
  const alt = ['ausência de previsão legal', 'mera liberalidade do agente', 'decisão discricionária sem motivação'];
  return alt[txt.length % alt.length];
}
function renderResumo(p) {
  if (!rzOn) {
    p.innerHTML = `<div class="pane">
      <div class="cesp-head"><b>Revisão Inteligente</b><span>${ctxLabel()} — a Athena lê o material aberto (aula, PDF, link ou vídeo) e gera um resumo com os trechos essenciais grifados.</span></div>
      ${scopePickerHTML()}
      <div class="rz-bar"><button class="on icobtn" id="rz-go">Gerar Resumo Inteligente</button></div>
      <p class="prose" style="color:var(--muted);">Depois de gerar, clique no ícone de lacuna para transformar os trechos grifados em espaços em branco e testar sua memória em Certo/Errado ou Múltipla escolha.</p>
    </div>`;
    mountScopePicker();
    document.getElementById('rz-go').onclick = () => { rzOn = true; renderPane(); };
    return;
  }
  const blocks = rzBlocks();
  let gi = 0;
  const body = blocks.map(b => {
    const html = b.p.map(([txt, kind]) => {
      if (kind !== 'chave') return txt;
      if (!rzGap) return `<mark class="hl">${txt}</mark>`;
      const i = gi++;
      const wrong = rzDistractor(txt);
      if (rzMode === 'ce') {
        const shown = i % 2 === 0 ? txt : wrong;
        return `<span class="gap" data-i="${i}" data-gab="${i % 2 === 0 ? 'C' : 'E'}" data-ans="${txt}"><span class="cand">${shown}</span><button class="gbtn" data-v="C">C</button><button class="gbtn" data-v="E">E</button></span>`;
      }
      const opts = [txt, wrong, 'nenhuma das anteriores'].sort((a, x) => (a.length % 3) - (x.length % 3));
      return `<span class="gap" data-i="${i}" data-ans="${txt}"><select><option value="">selecione...</option>${opts.map(o => `<option value="${o}">${o}</option>`).join('')}</select></span>`;
    }).join('');
    return `<h3>${b.t}</h3><p>${html}</p>`;
  }).join('');

function buildCards() {
  const pool = poolTopics();
  return Array.from({ length: Math.min(8, pool.length * 2) || 4 }).map((_, i) => {
    const item = pool[i % pool.length];
    const name = typeof item === 'string' ? item : item.t;
    return { q: `${name} — conceito-chave ${Math.floor(i / pool.length) + 1}`, a: `Resposta objetiva sobre ${name.toLowerCase()}.` };
  });
}

function goTab(t) {
  tab = t;
  document.querySelectorAll('.ws-item').forEach(x => x.classList.toggle('active', x.dataset.t === t));
  const u = new URL(location.href); u.searchParams.set('tab', t);
  history.replaceState(null, '', u);
  fcIdx = 0; fcOpen = false;
  renderPane();
  document.querySelector('.ws-center').scrollTop = 0;

async function carregarConteudoKB() {
  const box = document.getElementById('kb-conteudo');
  if (!box) return;
  let res = { status: 0, doc: null };
  try { res = await PX.kbTopicoDetalhe(disc, topic, id); } catch (e) {}
  // Se veio "sem login" mas a sessão pode só ainda não ter carregado, espera e tenta mais uma vez
  // antes de mostrar qualquer aviso — evita o falso "entre para ver esta aula" pra quem já está logado.
  if (res.status === 401 && window.PX && PX.ready) {
    try { await PX.ready; res = await PX.kbTopicoDetalhe(disc, topic, id); } catch (e) {}
  }
  if (!document.getElementById('kb-conteudo')) return;
  const doc = res.doc;
  if (doc && (doc.conteudo || '').trim()) {
    box.innerHTML = (doc.titulo ? '<h3>' + doc.titulo + '</h3>' : '') + PX.kbHTML(doc.conteudo);
    return;
  }
  const btn = (txt, href) => '<p style="margin:12px 0 0"><a class="btn-primary" style="display:inline-block;text-decoration:none;padding:9px 16px;border-radius:10px" href="' + href + '">' + txt + '</a></p>';
  // Trava de acesso pago desativada por enquanto (fase de testes): qualquer aluno
  // logado vê o material liberado; só falta login mesmo é que ainda bloqueia.
  if (res.status === 401) {
    box.innerHTML = kbAvisoHTML('Entre para ver esta aula', 'O conteúdo completo é liberado para alunos logados.', btn('Entrar na minha conta', 'login.html?next=' + encodeURIComponent(location.pathname + location.search)));
  } else if (res.status === 200 || res.status === 403) {
    box.innerHTML = kbAvisoHTML('Aula ainda não publicada para este tópico', 'O conteúdo de <b>' + topic + '</b> está sendo preparado. Enquanto isso, use as questões, os flashcards e o chat da Athena.', '');
  } else {
    box.innerHTML = kbAvisoHTML('Não consegui carregar esta aula', 'Verifique sua conexão e tente novamente.', '<p style="margin:12px 0 0"><button class="btn-secondary" onclick="carregarConteudoKB()">Tentar de novo</button></p>');
  }
}

(function () {
  const wsEl = document.querySelector('.ws');
  const handle = document.getElementById('ws-resize');
  if (!wsEl || !handle) return;
  const MIN = 280, MAX = 560, PADRAO = 360;
  const salva = parseInt(localStorage.getItem('ws:rightWidth') || '', 10);
  const inicial = Math.min(MAX, Math.max(MIN, Number.isFinite(salva) ? salva : PADRAO));
  wsEl.style.setProperty('--ws-right-w', inicial + 'px');

  let dragging = false, startX = 0, startW = inicial;
  function larguraAtual() {
    return parseInt(getComputedStyle(wsEl).getPropertyValue('--ws-right-w'), 10) || PADRAO;
  }
  function onMove(e) {
    if (!dragging) return;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const w = Math.min(MAX, Math.max(MIN, startW + (startX - x)));
    wsEl.style.setProperty('--ws-right-w', w + 'px');
  }
  function onUp() {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.userSelect = '';
    localStorage.setItem('ws:rightWidth', String(larguraAtual()));
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);
  }
  function onDown(e) {
    dragging = true;
    startX = e.touches ? e.touches[0].clientX : e.clientX;
    startW = larguraAtual();
    handle.classList.add('dragging');
    document.body.style.userSelect = 'none';
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('touchend', onUp);
    e.preventDefault();
  }
  handle.addEventListener('mousedown', onDown);
  handle.addEventListener('touchstart', onDown, { passive: false });
  handle.addEventListener('dblclick', () => {
    wsEl.style.setProperty('--ws-right-w', PADRAO + 'px');
    localStorage.setItem('ws:rightWidth', String(PADRAO));
  });
})();

      <div class="stat-row"><span>Último acesso</span><b>${stats.acesso}</b></div>
    </div>
    <div class="reco">
      <div class="rlbl">IA recomenda estudar</div>
      ${reco.map(r => `<a href="workspace.html?${base}&disc=${encodeURIComponent(disc)}&topic=${encodeURIComponent(r)}">${dotHTML(statusOf(r))} ${r}</a>`).join('')}
    </div>
  </div>`;

document.querySelectorAll('.rtab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.rtab').forEach(x => x.classList.toggle('active', x === b));
  document.getElementById('r-chat').hidden = b.dataset.r !== 'chat';
  document.getElementById('r-stats').hidden = b.dataset.r !== 'stats';
});

/* Histórico persistente por concurso, com contexto do tópico/ferramenta atual */
const CHAT_KEY = 'athena:chat:' + id;
function loadChat() {
  try { return JSON.parse(localStorage.getItem(CHAT_KEY)) || []; } catch { return []; }
}
function saveChat(h) { localStorage.setItem(CHAT_KEY, JSON.stringify(h.slice(-60))); }
let history_ = loadChat();

function currentCtx() {
  const tabLabel = (WS_TABS.find(t => t.id === tab) || { label: 'Aula' }).label;
  return `${ctxLabel()} · ${tabLabel}`;
}
document.getElementById('chat-ctx').textContent = 'Contexto: ' + currentCtx();

function renderChat() {
  const log = document.getElementById('side-log');
  log.innerHTML = '';
  if (!history_.length) {
    const d = document.createElement('div');
    d.className = 'b';
    d.textContent = `Aqui para te ajudar em ${ctxLabel()}. Pergunte o que quiser.`;
    log.appendChild(d);
  }
  let lastCtx = null;
  history_.forEach(m => {
    if (m.ctx && m.ctx !== lastCtx) {
      const c = document.createElement('div');
      c.className = 'ctxsep';
      c.textContent = m.ctx;
      log.appendChild(c);
      lastCtx = m.ctx;
    }
    const d = document.createElement('div');
    d.className = 'b' + (m.role === 'me' ? ' me' : '');
    d.textContent = m.text;
    log.appendChild(d);
  });
  log.scrollTop = log.scrollHeight;
}
renderChat();

const _renderPane = renderPane;
renderPane = function () { _renderPane(); const c = document.getElementById('chat-ctx'); if (c) c.textContent = 'Contexto: ' + currentCtx(); };

document.getElementById('chat-clear').onclick = () => { history_ = []; saveChat(history_); renderChat(); };

document.getElementById('side-form').onsubmit = e => {
  e.preventDefault();
  const i = document.getElementById('side-msg');
  const v = i.value.trim();
  if (!v) return;
  const ctx = currentCtx();
  history_.push({ role: 'me', text: v, ctx });
  saveChat(history_); renderChat();
  i.value = '';
  history_.push({ role: 'ai', ctx, text: 'Athena está consultando o material…', pending: true });
  saveChat(history_); renderChat();
  PX.athenaAsk(disc, scope === 'topico' ? topic : null, v, id).then(resp => {
    const i2 = history_.findIndex(m => m.pending);
    if (i2 >= 0) history_[i2] = { role: 'ai', ctx, text: resp };
    saveChat(history_); renderChat();
  });
};
</script>
