<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspace – Prova X</title>
<link rel="stylesheet" href="shell.css">
<style>
  .ws { display:grid; grid-template-columns: minmax(0,1fr) 268px; height:100%; }
  @media (max-width: 1100px) { .ws { grid-template-columns: minmax(0,1fr); } .ws-right { display:none; } }


  .ws-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:8px; font-size:0.86rem; color:#4A5162; cursor:pointer; transition:background .14s, color .14s; }
  .ws-item:hover { background:#F2F2F3; color:var(--text); }
  .ws-item.active { background:#EDEDEE; color:var(--text); font-weight:600; }
  .ws-item .ic { width:18px; text-align:center; font-size:0.9rem; }

  .ws-center { overflow-y:auto; padding:26px 34px 80px; }
  .ws-center h1 { font-size:1.5rem; font-weight:700; letter-spacing:-0.025em; }
  .pane { animation: fade .18s ease; }
  @keyframes fade { from { opacity:0; transform:translateY(4px);} to { opacity:1; transform:none;} }
  .prose { font-size:0.92rem; line-height:1.75; color:#31363F; margin-top:18px; }
  .prose h3 { font-size:1rem; font-weight:600; color:var(--text); margin:22px 0 8px; }
  .prose ul { margin:8px 0 8px 18px; }
  .prose li { margin:4px 0; }

  .fc { border:1px solid var(--line); border-radius:14px; padding:36px 24px; text-align:center; margin-top:20px; cursor:pointer; min-height:190px; display:grid; place-items:center; transition:border-color .16s; background:#fff; }
  .fc:hover { border-color:var(--line-strong); }
  .fc .q { font-size:1.05rem; font-weight:600; }
  .fc .a { font-size:0.9rem; color:var(--muted); margin-top:12px; }
  .mini { display:flex; gap:8px; margin-top:14px; }
  .mini button { border:1px solid var(--line-strong); background:#fff; border-radius:8px; padding:7px 14px; font-size:0.82rem; cursor:pointer; font-family:inherit; color:#4A5162; }
  .mini button:hover { background:#F6F6F7; }

  .qbox { border:1px solid var(--line); border-radius:12px; padding:18px; margin-top:16px; }
  .opt { display:flex; gap:10px; align-items:center; padding:10px 12px; border:1px solid var(--line); border-radius:9px; margin-top:8px; font-size:0.88rem; cursor:pointer; transition:all .14s; }
  .opt:hover { background:#FAFAFA; border-color:var(--line-strong); }
  .opt.ok { border-color:#22C55E; background:#F2FDF5; }
  .opt.no { border-color:#EF4444; background:#FEF3F2; }

  .cesp-head { margin-top:18px; display:flex; flex-direction:column; gap:4px; }
  .cesp-head b { font-size:0.95rem; }
  .cesp-head span { font-size:0.8rem; color:var(--muted); }
  .qtxt { font-size:0.9rem; line-height:1.6; }
  .ce { display:flex; align-items:center; gap:8px; margin-top:12px; flex-wrap:wrap; }
  .ce-btn { border:1px solid var(--line-strong); background:#fff; border-radius:8px; padding:7px 16px; font-size:0.8rem; font-weight:700; letter-spacing:.03em; cursor:pointer; font-family:inherit; color:#4A5162; }
  .ce-btn:hover { background:#F6F6F7; }
  .ce-btn.sel { background:#2563EB; border-color:#2563EB; color:#fff; }
  .ce-fb { font-size:0.8rem; color:var(--muted); }
  .qbox.ok { border-color:#22C55E; background:#F6FDF8; }
  .qbox.no { border-color:#EF4444; background:#FEF6F5; }
  .rev-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; border-bottom:1px solid var(--line); font-size:0.88rem; }
  .rev-row:last-child { border-bottom:none; }
  .rev-when { font-size:0.8rem; color:var(--muted); }

  .ws-chat { margin-top:20px; border-top:1px solid var(--line); padding-top:16px; }
  .ws-chat .rlbl { font-size:0.68rem; text-transform:uppercase; letter-spacing:.08em; color:#A6ACBB; font-weight:600; margin-bottom:10px; }
  .ws-chat .log { display:flex; flex-direction:column; gap:8px; max-height:220px; overflow-y:auto; }
  .ws-chat .b { font-size:0.82rem; line-height:1.55; padding:8px 10px; border-radius:10px; background:#fff; border:1px solid var(--line); }
  .ws-chat .b.me { background:var(--text); color:#fff; border-color:var(--text); align-self:flex-end; max-width:90%; }
  .ws-chat form { display:flex; gap:6px; margin-top:10px; }
  .ws-chat input { flex:1; min-width:0; border:1px solid var(--line-strong); border-radius:9px; padding:8px 10px; font-size:0.82rem; font-family:inherit; outline:none; }
  .ws-chat button { border:none; background:#2563EB; color:#fff; border-radius:9px; padding:0 12px; font-size:0.8rem; font-weight:600; cursor:pointer; }

  .chatlog { margin-top:18px; display:flex; flex-direction:column; gap:12px; }
  .bub { max-width:80%; padding:11px 14px; border-radius:12px; font-size:0.88rem; line-height:1.6; }
  .bub.ai { background:#F5F5F6; }
  .bub.me { background:var(--text); color:#fff; align-self:flex-end; }
  .composer { display:flex; gap:8px; margin-top:16px; }
  .composer input { flex:1; border:1px solid var(--line-strong); border-radius:9px; padding:10px 12px; font-size:0.88rem; font-family:inherit; outline:none; }
  .composer button { border:none; background:#2563EB; color:#fff; border-radius:9px; padding:0 16px; font-size:0.85rem; font-weight:600; cursor:pointer; }

  textarea.notes { width:100%; min-height:280px; border:1px solid var(--line); border-radius:12px; padding:16px; font-size:0.9rem; line-height:1.7; font-family:inherit; resize:vertical; outline:none; margin-top:18px; }
  textarea.notes:focus { border-color:var(--line-strong); }

  .ws-right { border-left:1px solid var(--line); padding:22px 18px; overflow-y:auto; background:var(--bg-soft); }
  .ws-right h2 { font-size:0.95rem; font-weight:600; letter-spacing:-0.01em; }
  .stat-row { display:flex; align-items:baseline; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line); font-size:0.82rem; color:var(--muted); }
  .stat-row b { font-size:0.92rem; color:var(--text); font-weight:600; font-variant-numeric:tabular-nums; }
  .rtabs { display:flex; gap:4px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:3px; }
  .rtab { flex:1; border:none; background:transparent; border-radius:8px; padding:7px 8px; font-size:0.8rem; font-weight:600; color:var(--muted); cursor:pointer; font-family:inherit; }
  .rtab.active { background:#EEF2FF; color:#2563EB; }
  .reco { margin-top:18px; }
  .reco .rlbl { font-size:0.68rem; text-transform:uppercase; letter-spacing:.08em; color:#A6ACBB; font-weight:600; margin-bottom:10px; }
  .reco a { display:block; padding:8px 10px; background:rgba(255,251,235,.6); border:1px solid rgba(253,230,138,.6); border-radius:8px; font-size:0.84rem; text-decoration:none; color:var(--text); margin-bottom:7px; }
  .reco a:hover { border-color:#F59E0B; }
</style>
</head>
<body>
<aside id="shell-sidebar"></aside>
<div class="shell-main">
  <header id="shell-topbar"></header>
  <div class="shell-body" style="overflow:hidden;">
    <div class="ws">
      

      <section class="ws-center">
        <a class="page-back" id="page-back" href="#">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          <span id="page-back-label"></span>
        </a>
        <div class="crumb" id="crumb"></div>
        <h1 id="t-title"></h1>
        <p class="subtitle" id="t-sub"></p>
        <div id="pane"></div>
      </section>

      <aside class="ws-right" id="ws-right"></aside>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="shell.js"></script>
<script>


const params = new URLSearchParams(location.search);
const id = params.get('id') || 'prf-2021';
const mat = materialById(id);
const title = params.get('title') || (mat ? mat.title : 'Material');
const type = params.get('type') || (mat ? mat.type : 'Material');
const allDiscs = disciplinasDe(id);
const disc = params.get('disc') || allDiscs[0];
const topic = params.get('topic') || (TOPICS[disc] || ['Tópico'])[0];
const base = `id=${encodeURIComponent(id)}&type=${encodeURIComponent(type)}&title=${encodeURIComponent(title)}`;
const discHref = `disciplina.html?${base}&disc=${encodeURIComponent(disc)}`;

document.getElementById('page-back').href = discHref;
document.getElementById('page-back-label').textContent = disc;

document.getElementById('crumb').innerHTML =
  `<a href="study-sets.html">Meus Concursos</a><span class="sep">/</span>` +
  (allDiscs.length > 1 ? `<a href="disciplinas.html?${base}">${title}</a>` : `<span>${title}</span>`) +
  `<span class="sep">/</span><a href="${discHref}">${disc}</a><span class="sep">/</span><span>${topic}</span>`;

const stats = topicStats(topic);
const sm = STATUS_META[stats.status];
document.getElementById('t-title').textContent = topic;
document.getElementById('t-sub').innerHTML = `${dotHTML(stats.status)} ${sm.label} · ${disc}`;

/* ---------- Coluna esquerda ---------- */
const TABS = WS_TABS;
let tab = params.get('tab') || 'tutor';

renderShell({
  active: 'materiais',
  topicNav: {
    items: wsMenuHTML(t => `<div class="ws-item${t.id === tab ? ' active' : ''}" data-t="${t.id}"><span class="ic">${t.ic}</span><span>${t.label}</span></div>`),
  },
});

document.getElementById('shell-sidebar').addEventListener('click', e => {
  const el = e.target.closest('.ws-item');
  if (!el) return;
  tab = el.dataset.t;
  document.querySelectorAll('.ws-item').forEach(x => x.classList.toggle('active', x === el));
  const u = new URL(location.href); u.searchParams.set('tab', tab);
  history.replaceState(null, '', u);
  renderPane();
});

/* ---------- Coluna central ---------- */
let fcIdx = 0, fcOpen = false;
const cards = [1,2,3,4].map(i => ({ q: `${topic} — conceito-chave ${i}`, a: `Resposta objetiva sobre ${topic.toLowerCase()} (ponto ${i}).` }));

function renderPane() {
  const p = document.getElementById('pane');
  if (tab === 'tutor') {
    p.innerHTML = `<div class="pane prose">
      <h3>Aula com Athena IA — ${topic}</h3>
      <p>Esta aula apresenta <b>${topic}</b> dentro de ${disc}, com foco no que costuma ser cobrado em prova.</p>
      <h3>1. Conceito e regra geral</h3>
      <p>Comece fixando a definição e a regra geral de ${topic.toLowerCase()}. É a partir dela que a banca constrói os itens de certo/errado, trocando uma palavra ou invertendo uma condição.</p>
      <h3>2. Exceções que a banca adora</h3>
      <ul>
        <li>Situações em que a regra geral não se aplica.</li>
        <li>Prazos, competências e requisitos formais.</li>
        <li>Confusões clássicas com institutos parecidos.</li>
      </ul>
      <h3>3. Como estudar este tópico</h3>
      <p>Leia a aula, ouça o podcast, resolva a bateria de questões no padrão Cebraspe e feche o ciclo com flashcards e revisão espaçada.</p>
      <p style="margin-top:16px;color:var(--muted);font-size:0.85rem;">Dúvidas? Use o chat da Athena no painel à direita.</p>
    </div>`;
  } else if (tab === 'flashcards') {
    const c = cards[fcIdx];
    p.innerHTML = `<div class="pane">
      <div class="fc" id="fc"><div><div class="q">${c.q}</div>${fcOpen ? `<div class="a">${c.a}</div>` : '<div class="a">Clique para revelar</div>'}</div></div>
      <div class="mini"><button id="prev">← Anterior</button><button id="next">Próximo →</button><span style="align-self:center;font-size:0.8rem;color:var(--muted);">${fcIdx+1} de ${cards.length}</span></div>
    </div>`;
    document.getElementById('fc').onclick = () => { fcOpen = !fcOpen; renderPane(); };
    document.getElementById('prev').onclick = () => { fcIdx = (fcIdx - 1 + cards.length) % cards.length; fcOpen = false; renderPane(); };
    document.getElementById('next').onclick = () => { fcIdx = (fcIdx + 1) % cards.length; fcOpen = false; renderPane(); };
  } else if (tab === 'questoes' || tab === 'simulados') {
    const n = tab === 'simulados' ? 10 : 5;
    const items = Array.from({length:n}).map((_,i) => ({
      txt: `Julgue o item a seguir, relativo a ${topic.toLowerCase()}: a regra geral aplicável ao caso ${i % 2 === 0 ? 'admite' : 'não admite'} exceção expressa em lei, conforme entendimento cobrado pela banca.`,
      gab: i % 2 === 0 ? 'C' : 'E',
    }));
    p.innerHTML = `<div class="pane">
      <div class="cesp-head">
        <b>${tab === 'simulados' ? 'Simulado' : 'Bateria de questões'} — estilo Cebraspe/Cespe</b>
        <span>Julgue os itens em CERTO ou ERRADO. Item errado anula um item certo.</span>
      </div>
      ${items.map((q,i) => `
      <div class="qbox" data-gab="${q.gab}">
        <div class="qtxt"><b>${i+1}.</b> ${q.txt}</div>
        <div class="ce">
          <button class="ce-btn" data-v="C">CERTO</button>
          <button class="ce-btn" data-v="E">ERRADO</button>
          <span class="ce-fb"></span>
        </div>
      </div>`).join('')}
      <div class="mini"><button id="gab">Ver desempenho</button></div>
    </div>`;
    p.querySelectorAll('.qbox').forEach(box => {
      box.querySelectorAll('.ce-btn').forEach(b => b.onclick = () => {
        box.querySelectorAll('.ce-btn').forEach(x => x.classList.remove('sel'));
        b.classList.add('sel');
        box.dataset.resp = b.dataset.v;
        const ok = b.dataset.v === box.dataset.gab;
        box.classList.toggle('ok', ok); box.classList.toggle('no', !ok);
        box.querySelector('.ce-fb').textContent = ok ? 'Certo — item correto.' : `Errado — gabarito: ${box.dataset.gab === 'C' ? 'CERTO' : 'ERRADO'}.`;
      });
    });
    document.getElementById('gab').onclick = () => {
      const boxes = [...p.querySelectorAll('.qbox')];
      const resp = boxes.filter(b => b.dataset.resp);
      const certos = resp.filter(b => b.dataset.resp === b.dataset.gab).length;
      alert(`Respondidos: ${resp.length}/${boxes.length}\nAcertos: ${certos}\nLíquido (Cebraspe): ${certos - (resp.length - certos)}`);
    };
  } else if (tab === 'revisao') {
    const fila = (TOPICS[disc] || []).slice(0, 5).map((t,i) => ({ t, quando: ['Hoje','Hoje','Amanhã','Em 3 dias','Em 1 semana'][i] || 'Em 1 semana' }));
    p.innerHTML = `<div class="pane">
      <div class="cesp-head"><b>Revisão espaçada</b><span>Plano de revisão de ${disc} — intervalos crescentes: 1 · 3 · 7 · 15 · 30 dias.</span></div>
      <div class="qbox" style="padding:0;overflow:hidden;">
        ${fila.map(f => `<div class="rev-row"><span>${dotHTML(statusOf(f.t))} ${f.t}</span><span class="rev-when">${f.quando}</span></div>`).join('')}
      </div>
      <div class="mini"><button onclick="alert('Sessão de revisão iniciada!')">Iniciar revisão de hoje</button></div>
    </div>`;
  } else if (tab === 'teste') {
    p.innerHTML = `<div class="pane">
      <p class="prose">Discorra sobre <b>${topic}</b> em até 15 linhas, destacando regra geral, exceções e aplicação prática.</p>
      <textarea class="notes" placeholder="Escreva sua resposta..."></textarea>
      <div class="mini"><button onclick="alert('Correção por IA em breve!')">Corrigir com IA</button></div>
    </div>`;
  } else if (tab === 'espacos') {
    p.innerHTML = `<div class="pane prose">
      <p>Complete as lacunas sobre ${topic}:</p>
      <p style="margin-top:14px;">A regra geral de ${topic.toLowerCase()} determina que <input style="border:none;border-bottom:1.5px solid var(--line-strong);outline:none;font-family:inherit;font-size:0.9rem;width:180px;"> deve ser observado, salvo quando <input style="border:none;border-bottom:1.5px solid var(--line-strong);outline:none;font-family:inherit;font-size:0.9rem;width:180px;">.</p>
      <div class="mini"><button onclick="alert('Verificação em breve!')">Verificar</button></div>
    </div>`;
  } else if (tab === 'podcast') {
    p.innerHTML = `<div class="pane">
      <div class="qbox" style="display:flex;align-items:center;gap:16px;">
        <div style="width:46px;height:46px;border-radius:12px;background:var(--text);color:#fff;display:grid;place-items:center;font-size:1.1rem;">▶</div>
        <div><div style="font-size:0.92rem;font-weight:600;">${topic} — episódio em áudio</div><div class="subtitle" style="margin-top:2px;">12 min · gerado por IA</div></div>
      </div>
    </div>`;
  } else if (tab === 'evolucao') {
    p.innerHTML = `<div class="pane">
      <div class="cesp-head"><b>Evolução em ${topic}</b><span>Acompanhe seu índice de domínio e suas estatísticas de estudo.</span></div>
      <div class="qbox">
        <div class="stat-row" style="border-bottom:none;padding-bottom:6px;"><span>Índice de domínio</span><b>${stats.dominio}%</b></div>
        <div class="track"><div class="fill ${fillClass(stats.dominio)}" style="width:${stats.dominio}%"></div></div>
        <div class="stat-row"><span>Tempo estudado</span><b>${stats.tempo}</b></div>
        <div class="stat-row"><span>Questões resolvidas</span><b>${stats.questoes}</b></div>
        <div class="stat-row"><span>Acertos</span><b>${stats.acertos}%</b></div>
        <div class="stat-row"><span>Flashcards revisados</span><b>${stats.flashcards}</b></div>
        <div class="stat-row"><span>Próxima revisão</span><b>${stats.revisao}</b></div>
        <div class="stat-row"><span>Dificuldade</span><b>${stats.dificuldade}</b></div>
        <div class="stat-row" style="border-bottom:none;"><span>Último acesso</span><b>${stats.acesso}</b></div>
      </div>
    </div>`;
  } else {
    const key = 'notes:' + id + ':' + disc + ':' + topic;
    p.innerHTML = `<div class="pane"><textarea class="notes" id="nt" placeholder="Suas anotações sobre ${topic}...">${localStorage.getItem(key) || ''}</textarea></div>`;
    document.getElementById('nt').oninput = e => localStorage.setItem(key, e.target.value);
  }
}
renderPane();

/* ---------- Coluna direita ---------- */
const reco = (TOPICS[disc] || []).filter(t => t !== topic).slice(0, 3);
document.getElementById('ws-right').innerHTML = `
  <div class="rtabs">
    <button class="rtab active" data-r="chat">Chat</button>
    <button class="rtab" data-r="stats">Estatísticas</button>
  </div>
  <div id="r-chat">
    <div class="ws-chat" style="margin-top:14px;border-top:none;padding-top:0;">
      <div class="rlbl">Chat com Athena IA</div>
      <div class="log" id="side-log"><div class="b">Aqui para te ajudar a aprender ${topic}. Pergunte o que quiser sobre a aula.</div></div>
      <form id="side-form"><input id="side-msg" placeholder="Pergunte-me qualquer coisa sobre o material..." autocomplete="off"><button type="submit">↑</button></form>
    </div>
  </div>
  <div id="r-stats" hidden>
    <h2>${topic}</h2>
    <div style="margin-top:14px;">
      <div class="stat-row" style="border-bottom:none;padding-bottom:4px;"><span>Índice de domínio</span><b>${stats.dominio}%</b></div>
      <div class="track"><div class="fill ${fillClass(stats.dominio)}" style="width:${stats.dominio}%"></div></div>
    </div>
    <div style="margin-top:12px;">
      <div class="stat-row"><span>Tempo estudado</span><b>${stats.tempo}</b></div>
      <div class="stat-row"><span>Questões</span><b>${stats.questoes}</b></div>
      <div class="stat-row"><span>Acertos</span><b>${stats.acertos}%</b></div>
      <div class="stat-row"><span>Flashcards</span><b>${stats.flashcards}</b></div>
      <div class="stat-row"><span>Próxima revisão</span><b>${stats.revisao}</b></div>
      <div class="stat-row"><span>Dificuldade</span><b>${stats.dificuldade}</b></div>
      <div class="stat-row"><span>Último acesso</span><b>${stats.acesso}</b></div>
    </div>
    <div class="reco">
      <div class="rlbl">IA recomenda estudar</div>
      ${reco.map(r => `<a href="workspace.html?${base}&disc=${encodeURIComponent(disc)}&topic=${encodeURIComponent(r)}">${dotHTML(statusOf(r))} ${r}</a>`).join('')}
    </div>
  </div>`;

document.querySelectorAll('.rtab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.rtab').forEach(x => x.classList.toggle('active', x === b));
  document.getElementById('r-chat').hidden = b.dataset.r !== 'chat';
  document.getElementById('r-stats').hidden = b.dataset.r !== 'stats';
});

document.getElementById('side-form').onsubmit = e => {
  e.preventDefault();
  const i = document.getElementById('side-msg');
  const v = i.value.trim();
  if (!v) return;
  const log = document.getElementById('side-log');
  log.insertAdjacentHTML('beforeend', `<div class="b me"></div>`);
  log.lastElementChild.textContent = v;
  i.value = '';
  setTimeout(() => {
    log.insertAdjacentHTML('beforeend', `<div class="b"></div>`);
    log.lastElementChild.textContent = `Sobre "${v}" em ${topic}: comece pela regra geral e depois treine com itens certo/errado.`;
    log.scrollTop = log.scrollHeight;
  }, 300);
  log.scrollTop = log.scrollHeight;
};
</script>
</body>
</html>
