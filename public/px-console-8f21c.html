<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Painel Administrativo – Prova X</title>
<meta name="description" content="Gestão de alunos, cursos, assinaturas, IA e suporte da plataforma Prova X.">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  #kb-editor-wrap.is-full{position:fixed;inset:0;z-index:9000;background:#fff;padding:16px 20px;display:flex;flex-direction:column;}
  #kb-editor-wrap.is-full #kb-txt{flex:1;height:auto !important;min-height:0;resize:none;}

  :root{
    --bg:#EAF0F6;
    --surface:#FFFFFF;
    --surface-elevated:#F8FAFC;
    --surface-tint:#F4F7FB;
    --surface-warm:#FAF8F5;
    --border:#D9E0EA;
    --border-strong:#C3CDDA;
    --text:#0F172A;
    --text-muted:#5E6B7D;
    --brand:#1E3A8A;
    --brand-light:#3B82F6;
    --gold:#C9A84C;
    --ring:rgba(30,58,138,.12);
  }
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px;}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  header h1{font-size:1.25rem;font-weight:800;letter-spacing:-0.02em;color:var(--brand);}
  .badge{background:#EFF6FF;color:var(--brand);border-radius:999px;padding:4px 10px;font-size:0.72rem;font-weight:700;border:1px solid #BFDBFE;}
  .spacer{flex:1;}
  a.back{font-size:0.83rem;color:var(--brand-light);text-decoration:none;font-weight:600;}
  .tabs{display:flex;gap:6px;overflow-x:auto;background:var(--surface-tint);border:1px solid var(--border);border-radius:14px;padding:5px;margin-bottom:18px;}
  .tabs button{white-space:nowrap;border:none;background:transparent;padding:9px 14px;border-radius:10px;font-size:0.84rem;font-weight:600;color:var(--text-muted);cursor:pointer;font-family:inherit;}
  .tabs button.on{background:var(--brand);color:#fff;box-shadow:0 2px 8px rgba(30,58,138,.18);}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px;}
  .kpi{background:linear-gradient(180deg,#fff 0%,var(--surface-elevated) 100%);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(15,23,42,.04);}
  .kpi b{display:block;font-size:1.5rem;font-weight:800;letter-spacing:-0.03em;color:var(--brand);}
  .kpi span{font-size:0.78rem;color:var(--text-muted);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04);}
  .card h2{font-size:0.95rem;font-weight:700;margin-bottom:12px;color:var(--brand);}
  table{width:100%;border-collapse:collapse;font-size:0.83rem;}
  th{text-align:left;color:var(--text-muted);font-weight:600;font-size:0.75rem;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--border-strong);background:var(--surface-elevated);}
  td{padding:9px 10px;border-bottom:1px solid #E8EDF3;vertical-align:middle;}
  tbody tr:nth-child(even){background:var(--surface-elevated);}
  tbody tr:hover{background:#F1F5F9;}
  tr:last-child td{border-bottom:none;}
  .pill{border-radius:999px;padding:3px 9px;font-size:0.72rem;font-weight:700;}
  .pill.ok{background:#ECFDF5;color:#047857;}
  .pill.warn{background:#FFFBEB;color:#B45309;}
  .pill.off{background:#FEF2F2;color:#B91C1C;}
  .pill.n{background:#F1F5F9;color:#475569;}
  button.act{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:5px 10px;font-size:0.76rem;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text);}
  button.act:hover:not(:disabled){background:var(--surface-elevated);}
  button.act.primary{background:var(--brand);border-color:var(--brand);color:#fff;}
  button.act.primary:hover:not(:disabled){background:#172A5A;}
  button.act.danger{color:#B91C1C;}
  input,select,textarea{border:1px solid var(--border-strong);border-radius:9px;padding:8px 10px;font-size:0.84rem;font-family:inherit;background:var(--surface-elevated);width:100%;color:var(--text);}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-light);box-shadow:0 0 0 3px var(--ring);background:var(--surface);}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end;margin-bottom:12px;}
  .muted{color:var(--text-muted);font-size:0.82rem;}
  .hide{display:none;}
  @media(max-width:640px){ table{font-size:0.78rem;} th,td{padding:7px 6px;} }
@keyframes pxspin{to{transform:rotate(360deg)}}

  /* ===== Base de conhecimento (IA) — camada visual minimalista ===== */
  .kb-scope{font-size:0.875rem;color:var(--text);}
  .kb-scope .muted{color:#7C8798;font-size:0.8125rem;line-height:1.55;}
  .kb-scope label.muted{display:block;font-size:0.75rem;font-weight:600;color:var(--text-muted);margin-bottom:5px;}
  .kb-scope input,.kb-scope select,.kb-scope textarea{background:var(--surface);border-color:var(--border);border-radius:10px;padding:9px 12px;font-size:0.84rem;}
  .kb-scope input:focus,.kb-scope select:focus,.kb-scope textarea:focus{outline:none;border-color:var(--brand-light);box-shadow:0 0 0 3px var(--ring);}
  .kb-scope button.act{border-radius:10px;padding:7px 13px;font-size:0.8rem;border-color:var(--border);}
  .kb-scope button.act:hover:not(:disabled){background:var(--surface-elevated);}
  .kb-scope button.act.primary:hover:not(:disabled){background:#172A5A;}
  .kb-scope button.act:disabled{opacity:.45;cursor:not-allowed;}

  /* estatísticas discretas, sem cartões concorrendo */
  .kb-stats{display:flex;flex-wrap:wrap;gap:26px 40px;padding:4px 4px 20px;margin-bottom:4px;}
  .kb-stat b{display:block;font-size:1.45rem;font-weight:700;letter-spacing:-0.03em;line-height:1.15;color:var(--brand);}
  .kb-stat span{display:block;font-size:0.75rem;color:#8A94A6;margin-top:2px;}

  /* navegação por passos: segmented control calmo */
  .kb-nav{display:flex;gap:4px;flex-wrap:wrap;background:#E2E8F0;border-radius:12px;padding:4px;}
  .kb-nav button{border:none;background:transparent;border-radius:9px;padding:8px 15px;font-size:0.8125rem;font-weight:600;
    color:var(--text-muted);cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:7px;}
  .kb-nav button:hover{color:var(--text);}
  .kb-nav button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 2px rgba(15,23,42,.08);}
  .kb-nav .kb-count{background:#E7ECF4;color:var(--text-muted);border-radius:99px;padding:1px 7px;font-size:0.68rem;font-weight:700;}
  .kb-nav button.on .kb-count{background:#EFF3FA;color:#334155;}

  /* blocos/cards de seção */
  .kb-block{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:22px 24px;margin-bottom:16px;box-shadow:0 1px 3px rgba(15,23,42,.04);}
  .kb-block > h3{font-size:1rem;font-weight:700;letter-spacing:-0.01em;margin:0;color:var(--brand);}
  .kb-block > .kb-sub{color:#8A94A6;font-size:0.8125rem;line-height:1.55;margin:5px 0 18px;max-width:70ch;}
  .kb-block h4{font-size:0.85rem;font-weight:700;margin:0 0 4px;color:var(--text);}
  .kb-hr{border:none;border-top:1px solid var(--border);margin:22px 0;}
  @media(max-width:640px){ .kb-block{padding:18px 16px;} .kb-stats{gap:18px 26px;} }

  /* selo neutro único, no lugar de badges coloridos concorrentes */
  .kb-tag{display:inline-block;font-size:0.6875rem;font-weight:600;letter-spacing:.01em;padding:2px 9px;border-radius:99px;
    background:#F1F4F9;color:var(--text-muted);white-space:nowrap;}
  .kb-tag.is-on{background:#ECFDF5;color:#047857;}
  .kb-tag.is-wait{background:#FFFBEB;color:#B45309;}

  /* listas e superfícies suaves */
  .kb-surface{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden;}
  .kb-drop{border:1.5px dashed var(--border-strong);border-radius:14px;padding:22px 16px;text-align:center;background:var(--surface-tint);transition:.15s;}
  .kb-drop:hover{background:#EDF1F7;border-color:var(--brand-light);}
  .kb-soft{background:var(--surface-tint);border:1px solid #E4EBF5;border-radius:14px;padding:16px;}
  .kb-soft.alt{background:var(--surface-warm);border-color:#EDE8E0;}
  .kb-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
  .kb-fields > div,.row > div{background:var(--surface-elevated);border:1px solid var(--border);border-radius:12px;padding:12px;}
  .kb-fields > div label,.row > div label{display:block;margin-bottom:6px;}
  .kb-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px;}

  /* diferenciação sutil de campos / grupos */
  .field-group{background:var(--surface-elevated);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;}
  .field-group.alt{background:var(--surface-warm);border-color:#EDE8E0;}
  .field-group h4{font-size:0.85rem;font-weight:700;margin-bottom:10px;color:var(--brand);}
</style>


</head>
<body>
<div class="wrap">
  <header>
    <h1>Painel Administrativo</h1>
    <span class="badge">Prova X</span>
    <div class="spacer"></div>
    <span class="muted" id="who"></span>
    <a class="back" href="home.html">← Voltar ao app</a>
  </header>

  <div class="tabs" id="tabs"></div>
  <div id="view"><p class="muted">Carregando…</p></div>
</div>

<script src="data.js"></script>
<script src="px-kb-payload.js"></script>
<script src="px-auth.js"></script>
<script>
const TABS = [
  ['geral','Visão geral'],['conhecimento','Base de conhecimento (IA)'],['rag','RAG da Athena'],['alunos','Alunos'],['cursos','Cursos'],['conteudo','Conteúdo'],
  ['financeiro','Financeiro'],['planos','Planos e cupons'],['ia','Athena IA'],
  ['suporte','Suporte'],['logs','Logs'],['config','Central de IA']
];
let tab = location.hash.replace('#','') || 'geral';
const view = document.getElementById('view');
const money = c => 'R$ ' + ((c || 0) / 100).toFixed(2).replace('.', ',');
const dt = s => s ? new Date(s).toLocaleDateString('pt-BR') : '—';
const esc = s => String(s == null ? '' : s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(([id,l]) =>
    `<button class="${id===tab?'on':''}" onclick="go('${id}')">${l}</button>`).join('');
}
function go(id){ tab = id; location.hash = id; renderTabs(); render(); }

async function logAdmin(acao, alvo_tipo, alvo_id, detalhes){
  await PX.sb.from('admin_logs').insert({ admin_id: PX.user.id, acao, alvo_tipo, alvo_id: alvo_id || null, detalhes: detalhes || {} });
}

/* ---------- Alterações pendentes de sincronização ---------- */
const ACOES_CONTEUDO = ['salvar_conhecimento','status_conhecimento','excluir_conhecimento','montar_curso_ia',
  'importar_edital','reindexar_conhecimento','limpar_orfaos_conhecimento'];
const dth = s => s ? new Date(s).toLocaleString('pt-BR', { dateStyle:'short', timeStyle:'short' }) : '—';

async function syncPendencia(){
  const [sync, edit] = await Promise.all([
    PX.sb.from('admin_logs').select('created_at').eq('acao','sincronizar_curriculo')
      .order('created_at',{ascending:false}).limit(1).maybeSingle(),
    PX.sb.from('admin_logs').select('created_at,acao').in('acao', ACOES_CONTEUDO)
      .order('created_at',{ascending:false}).limit(1).maybeSingle(),
  ]);
  const ultimaSync = sync.data ? sync.data.created_at : null;
  const ultimaEdicao = edit.data ? edit.data.created_at : null;
  const pendente = !!ultimaEdicao && (!ultimaSync || new Date(ultimaEdicao) > new Date(ultimaSync));
  return { ultimaSync, ultimaEdicao, pendente };
}

function syncAvisoHTML(p){
  if(p.pendente){
    return `<div style="border:1px solid #f0c36d;background:#fff8e6;color:#7a5300;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:.9rem">
      ⚠ Há alterações não sincronizadas${p.ultimaSync?` desde a última sincronização (${dth(p.ultimaSync)})`:' — o currículo nunca foi sincronizado'}.
      Última edição de conteúdo: ${dth(p.ultimaEdicao)}. Clique em <b>Sincronizar currículo agora</b> na Central de IA para os alunos verem a versão atual.</div>`;
  }
  return `<div style="border:1px solid #cfe8d4;background:#f2fbf4;color:#1f6b39;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:.9rem">
    ✓ Currículo sincronizado${p.ultimaSync?` em ${dth(p.ultimaSync)}`:''}.</div>`;
}

async function pintarSyncAviso(){
  const alvos = ['sync-alerta','cfg-sync-alerta'].map(id=>document.getElementById(id)).filter(Boolean);
  if(!alvos.length) return;
  try {
    const p = await syncPendencia();
    const html = syncAvisoHTML(p);
    alvos.forEach(el => { el.innerHTML = html; });
  } catch(e){ alvos.forEach(el => { el.innerHTML = ''; }); }
}


/* ---------- Views ---------- */
async function viewGeral(){
  const cnt = async (t, f) => { let q = PX.sb.from(t).select('*', {count:'exact', head:true}); if(f) q = f(q); const {count} = await q; return count || 0; };
  const hoje = new Date(Date.now()-86400000).toISOString();
  const [alunos, ativos, subs, cursos, tickets, sessoes] = await Promise.all([
    cnt('profiles'), cnt('login_events', q=>q.gte('created_at', hoje)),
    cnt('subscriptions', q=>q.eq('status','ativa')), cnt('courses'),
    cnt('support_tickets', q=>q.eq('status','aberto')), cnt('study_sessions', q=>q.gte('created_at', hoje)),
  ]);
  const { data: comp } = await PX.sb.from('purchases').select('valor_cents').eq('status','pago');
  const receita = (comp||[]).reduce((a,p)=>a+(p.valor_cents||0),0);
  const { data: ia } = await PX.sb.from('ai_logs').select('custo_cents,tokens_entrada,tokens_saida');
  const custoIA = (ia||[]).reduce((a,l)=>a+(l.custo_cents||0),0);

  view.innerHTML = `
    <div id="sync-alerta"></div>
    <div class="kpis">
      <div class="kpi"><b>${alunos}</b><span>Alunos cadastrados</span></div>

      <div class="kpi"><b>${ativos}</b><span>Logins nas últimas 24h</span></div>
      <div class="kpi"><b>${subs}</b><span>Assinaturas ativas</span></div>
      <div class="kpi"><b>${money(receita)}</b><span>Receita confirmada</span></div>
      <div class="kpi"><b>${sessoes}</b><span>Sessões de estudo (24h)</span></div>
      <div class="kpi"><b>${cursos}</b><span>Cursos publicados</span></div>
      <div class="kpi"><b>${tickets}</b><span>Chamados abertos</span></div>
      <div class="kpi"><b>${money(custoIA)}</b><span>Custo de IA acumulado</span></div>
    </div>
    <div class="card"><h2>Últimos cadastros</h2><div id="recent" class="muted">Carregando…</div></div>`;
  const { data: recent } = await PX.sb.from('profiles').select('full_name,email,created_at').order('created_at',{ascending:false}).limit(8);
  document.getElementById('recent').innerHTML = tabela(['Nome','E-mail','Cadastro'],
    (recent||[]).map(p=>[esc(p.full_name||'—'), esc(p.email), dt(p.created_at)]));
  pintarSyncAviso();
}


function tabela(head, rows){
  if(!rows.length) return '<p class="muted">Nenhum registro.</p>';
  return `<table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

async function viewAlunos(){
  view.innerHTML = `<div class="card">
    <h2>Alunos</h2>
    <div class="row"><input id="busca" placeholder="Buscar por nome ou e-mail"><button class="act primary" onclick="viewAlunos()">Atualizar</button></div>
    <div class="row" style="align-items:center;gap:10px">
      <label class="muted">Curso para liberar/remover acesso</label>
      <select id="ac-curso" style="max-width:280px"></select>
      <button class="act" onclick="liberarParaMim()">Liberar para mim (testar como aluno)</button>
    </div>
    <p class="muted" id="ac-msg"></p>
    <div id="lista" class="muted">Carregando…</div></div>`;
  const [{ data: ps }, { data: rs }, { data: cs }, { data: acs }] = await Promise.all([
    PX.sb.from('profiles').select('*').order('created_at',{ascending:false}).limit(200),
    PX.sb.from('user_roles').select('user_id,role'),
    PX.sb.from('courses').select('id,nome,slug').order('ordem'),
    PX.sb.from('course_access').select('user_id,course_id,expira_em'),
  ]);
  const roleMap = {}; (rs||[]).forEach(r=>{ (roleMap[r.user_id]=roleMap[r.user_id]||[]).push(r.role); });
  const sel = document.getElementById('ac-curso');
  sel.innerHTML = (cs||[]).map(c=>`<option value="${c.id}">${esc(c.nome)} (${esc(c.slug)})</option>`).join('') || '<option value="">Nenhum curso</option>';
  const cursoAtual = () => sel.value;
  const temAcesso = (uid) => (acs||[]).some(a => a.user_id===uid && a.course_id===cursoAtual()
    && (!a.expira_em || new Date(a.expira_em).getTime() > Date.now()));
  const paint = (filtro) => {
    const list = (ps||[]).filter(p => !filtro ||
      (p.email||'').toLowerCase().includes(filtro) || (p.full_name||'').toLowerCase().includes(filtro));
    document.getElementById('lista').innerHTML = tabela(['Nome','E-mail','Papéis','Último acesso','Status','Acesso ao curso','Ações'],
      list.map(p=>[
        esc(p.full_name||'—'), esc(p.email),
        (roleMap[p.id]||['student']).map(r=>`<span class="pill n">${r}</span>`).join(' '),
        dt(p.last_login_at),
        p.suspended?'<span class="pill off">Suspenso</span>':'<span class="pill ok">Ativo</span>',
        temAcesso(p.id)?'<span class="pill ok">Liberado</span>':'<span class="pill off">Sem acesso</span>',
        `<button class="act" onclick="verDesempenho('${p.id}','${esc(p.full_name||p.email||'aluno').replace(/'/g,'&#39;')}')">Ver desempenho</button>
         <button class="act ${temAcesso(p.id)?'danger':'primary'}" onclick="acessoCurso('${p.id}',${!temAcesso(p.id)})">${temAcesso(p.id)?'Remover acesso':'Liberar acesso'}</button>
         <button class="act" onclick="toggleAdmin('${p.id}',${(roleMap[p.id]||[]).includes('admin')})">${(roleMap[p.id]||[]).includes('admin')?'Remover admin':'Tornar admin'}</button>
         <button class="act ${p.suspended?'':'danger'}" onclick="suspender('${p.id}',${!p.suspended})">${p.suspended?'Reativar':'Suspender'}</button>
         <button class="act danger" onclick="excluirAluno('${p.id}','${esc(p.email||p.full_name||'')}')">Excluir</button>`


      ]));
  };
  paint('');
  sel.onchange = () => paint((document.getElementById('busca').value||'').toLowerCase().trim());
  document.getElementById('busca').oninput = e => paint(e.target.value.toLowerCase().trim());
}
async function acessoCurso(userId, liberar){
  const courseId = document.getElementById('ac-curso').value;
  const msg = document.getElementById('ac-msg');
  if(!courseId){ msg.textContent = 'Cadastre um curso antes de liberar acesso.'; return; }
  msg.textContent = liberar ? 'Liberando acesso…' : 'Removendo acesso…';
  const q = liberar
    ? await PX.sb.from('course_access').insert({ user_id:userId, course_id:courseId, origem:'manual' })
    : await PX.sb.from('course_access').delete().eq('user_id',userId).eq('course_id',courseId);
  if(q.error){ msg.textContent = 'Não deu certo: ' + q.error.message; return; }
  await logAdmin(liberar?'liberar_acesso':'remover_acesso','course_access', userId + '|' + courseId);
  viewAlunos();
}
async function liberarParaMim(){
  const u = await PX.sb.auth.getUser();
  const uid = u && u.data && u.data.user && u.data.user.id;
  if(uid) await acessoCurso(uid, true);
}

async function toggleAdmin(id, isAdm){
  if(isAdm) await PX.sb.from('user_roles').delete().eq('user_id',id).eq('role','admin');
  else await PX.sb.from('user_roles').insert({user_id:id, role:'admin'});
  await logAdmin(isAdm?'remover_admin':'conceder_admin','profile',id);
  viewAlunos();
}
async function suspender(id, val){
  await PX.sb.from('profiles').update({suspended: val}).eq('id',id);
  await logAdmin(val?'suspender_aluno':'reativar_aluno','profile',id);
  viewAlunos();
}
async function excluirAluno(id, quem){
  const msg = document.getElementById('ac-msg');
  if(!confirm('Excluir definitivamente a conta de ' + (quem || 'este aluno') + '?\n\nTodo o histórico (progresso, anotações, flashcards, acessos e compras) será apagado. Não dá para desfazer.')) return;
  if(msg) msg.textContent = 'Excluindo conta…';
  try{
    const r = await fetch('/api/public/admin-delete-user', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + (await kbToken()) },
      body: JSON.stringify({ user_id: id })
    });
    const j = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error || 'Falha ao excluir.');
    await viewAlunos();

let _dpAluno = null;
async function verDesempenho(userId, nome){
  view.innerHTML = `<div class="card"><h2>Desempenho — ${esc(nome)}</h2><p class="muted">Carregando…</p></div>`;
  const [{ data: prog }, { data: snaps }] = await Promise.all([
    PX.sb.from('topic_progress').select('*').eq('user_id', userId),
    PX.sb.from('dominio_snapshots').select('dia,dominio,acertos_pct,questoes').eq('user_id', userId).order('dia').limit(60),
  ]);
  const map = {};
  (prog||[]).forEach(r=>{ map[r.topic_nome] = {
    status:r.status, dominio:r.dominio, tempo_segundos:r.tempo_segundos,
    questoes_respondidas:r.questoes_respondidas, questoes_certas:r.questoes_certas,
    last_access_at:r.last_access_at }; });
  _dpAluno = { userId, nome, map, snaps: snaps||[] };
  pintarDesempenho('geral');
}
function _dpAgg(){
  const antes = PX_PROG_OVERRIDE;
  PX_PROG_OVERRIDE = _dpAluno.map;
  try { return desempenhoAgregado('prf-2021'); }
  finally { PX_PROG_OVERRIDE = antes; }
}
function pintarDesempenho(aba){
  const { nome, snaps } = _dpAluno;
  const agg = _dpAgg(), t = agg.totals;
  const tab = (id,label)=>`<button class="act ${aba===id?'primary':''}" onclick="pintarDesempenho('${id}')">${label}</button>`;
  let corpo = '';
  if(aba==='geral'){
    const linha = snaps.length>=3
      ? tabela(['Dia','Domínio','Acertos','Questões'], snaps.map(s=>[s.dia, s.dominio+'%', s.acertos_pct+'%', s.questoes]))
      : '<p class="muted">Histórico insuficiente (mínimo de 3 dias registrados).</p>';
    corpo = `<div class="kpis">
        <div class="kpi"><b>${t.dominioMedio}%</b><span>Índice de domínio médio</span></div>
        <div class="kpi"><b>${t.tempo}</b><span>Tempo de estudo</span></div>
        <div class="kpi"><b>${t.questoes}</b><span>Questões resolvidas</span></div>
        <div class="kpi"><b>${t.acertoPct}%</b><span>Aproveitamento</span></div>
        <div class="kpi"><b>${t.saldo}</b><span>Saldo líquido (Cebraspe)</span></div>
        <div class="kpi"><b>${t.conta.dom}/${t.topicos}</b><span>Tópicos dominados</span></div>
      </div>
      <div class="card"><h2>Evolução</h2>${linha}</div>`;
  } else if(aba==='disciplina'){
    const rows = agg.discs.slice().sort((a,b)=> b.pct-a.pct || b.peso.peso-a.peso.peso || a.name.localeCompare(b.name));
    corpo = tabela(['Disciplina','Peso','Domínio','Questões','Acertos','Saldo','Tópicos dominados'],
      rows.map(d=>[esc(d.name), d.peso.peso, d.pct+'%', d.questoes, d.acertoPct+'%', (d.certas-d.erros), `${d.conta.dom}/${d.topics.length}`]));
  } else {
    const rows = [];
    agg.discs.forEach(d=>d.topics.forEach(tp=>{
      const p = _dpAluno.map[tp.name] || {};
      rows.push([esc(d.name), esc(tp.name),
        ({nao:'Não estudado',apr:'Aprendendo',fam:'Familiar',dom:'Dominado'})[tp.st] || tp.st,
        tp.prog+'%', p.questoes_respondidas||0, p.questoes_certas||0, p.last_access_at?dt(p.last_access_at):'—']);
    }));
    corpo = tabela(['Disciplina','Tópico','Status','Domínio','Questões','Acertos','Último acesso'], rows);
  }
  view.innerHTML = `<div class="card">
      <div class="row" style="align-items:center;gap:10px">
        <button class="act" onclick="viewAlunos()">← Voltar para Alunos</button>
        <h2 style="margin:0">Desempenho — ${esc(nome)}</h2>
      </div>
      <p class="muted">Visão somente leitura do administrador. Nenhum dado do aluno é alterado.</p>
      <div class="row">${tab('geral','Geral')}${tab('disciplina','Por disciplina')}${tab('topico','Por tópico')}</div>
    </div>
    <div class="card">${corpo}</div>`;
}

async function salvarPesoDisc(id, campo, el){
  const msg = document.getElementById('dp-msg');
  const n = Math.round(Number(el.value));
  const min = campo==='peso' ? 1 : 0, max = campo==='peso' ? 20 : 100;
  if(!Number.isFinite(n) || n < min || n > max){
    el.value = el.defaultValue;
    if(msg) msg.textContent = `Valor inválido: ${campo==='peso'?'Peso':'Incidência'} deve ser um número inteiro de ${min} a ${max}.`;
    return;
  }
  el.value = n;
  if(msg) msg.textContent = 'Salvando…';
  const { error } = await PX.sb.from('disciplines').update({ [campo]: n }).eq('id', id);
  if(error){ el.value = el.defaultValue; if(msg) msg.textContent = 'Não deu certo: ' + error.message; return; }
  el.defaultValue = String(n);
  await logAdmin('editar_'+campo, 'discipline', id, { valor: n });
  try{ if(PX.syncCurriculo) await PX.syncCurriculo(); }catch(e){}
  if(msg) msg.textContent = 'Salvo. O Cronograma usa o novo valor na próxima geração.';
}

async function aiAcao(payload){
  const { data:{ session } } = await PX.sb.auth.getSession();
  const r = await fetch('/api/public/ai-central', {
    method:'POST',
    headers: Object.assign({ 'Content-Type':'application/json' }, session ? { Authorization:'Bearer ' + session.access_token } : {}),
    body: JSON.stringify(payload),
  });
  return r.json().catch(()=>({ error:'resposta inválida' }));
}
async function aiSalvarRota(slug){
  const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const st = document.getElementById('rt-'+slug+'-status');
  if(st){ st.textContent = 'Salvando…'; st.style.color = ''; }
  const custom = (val('rt-'+slug+'-custom')||'').trim();
  if(custom && !/^[\w./:-]{2,120}$/.test(custom)){
    if(st){ st.textContent = '✗ modelo personalizado inválido (sem espaços)'; st.style.color = '#991b1b'; }
    return;
  }
  const j = await aiAcao({
    acao:'salvar_rota', agent:slug,
    provider: val('rt-'+slug+'-prov'),
    model: val('rt-'+slug+'-mod'),
    custom_model: custom,
    fallback_provider: val('rt-'+slug+'-fbprov'),
    fallback_model: val('rt-'+slug+'-fbmod'),
    fallback_ativo: !!val('rt-'+slug+'-fbprov'),
    limite_diario: parseInt(val('rt-'+slug+'-limite')||'0',10)||0,
  });
  if(st){ st.textContent = j.ok ? '✓ rota salva — já vale para as próximas chamadas' : '✗ ' + (j.error || 'erro ao salvar'); st.style.color = j.ok ? '#166534' : '#991b1b'; }
}
async function aiTestarRota(slug){
  const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
  const st = document.getElementById('rt-'+slug+'-status');
  const model = (val('rt-'+slug+'-custom')||'').trim() || val('rt-'+slug+'-mod');
  if(st){ st.textContent = 'Testando com uma chamada real…'; st.style.color = ''; }
  const j = await aiAcao({ acao:'testar_modelo', provider: val('rt-'+slug+'-prov'), model });
  if(st){
    st.textContent = j.ok ? `✓ funcionou — ${j.detalhe}` : '✗ ' + (j.detalhe || j.error || 'falhou');
    st.style.color = j.ok ? '#166534' : '#991b1b';
  }
}

async function cfgTestarChave(env){
  const alvo = document.getElementById('teste-'+env);
  if(alvo) alvo.textContent = 'Testando…';
  try {
    const { data:{ session } } = await PX.sb.auth.getSession();
    const r = await fetch('/api/public/ai-test', {
      method:'POST',
      headers: Object.assign({ 'Content-Type':'application/json' }, session ? { Authorization:'Bearer ' + session.access_token } : {}),
      body: JSON.stringify({ env }),
    });
    const j = await r.json().catch(()=>({ ok:false, detalhe:'resposta inválida' }));
    if(alvo){
      if(j.ok){ alvo.textContent = '✓ chave válida — testada agora'; alvo.style.color = '#166534'; }
      else if(r.status === 401 || r.status === 403){
        alvo.textContent = 'ⓘ chave salva, mas não foi possível testar agora (acesso restrito).';
        alvo.style.color = '#92400e';
      } else {
        alvo.textContent = '✗ o teste falhou: ' + String(j.detalhe || j.error || 'falhou').slice(0,220);
        alvo.style.color = '#991b1b';
      }
    }
    return !!j.ok;

  } catch(e){
    if(alvo){ alvo.textContent = '✗ erro: ' + e.message; alvo.style.color = '#991b1b'; }
    return false;
  }
}

async function cfgCriarIntegracao(){

  const valor = (document.getElementById('int-valor').value||'').trim();

  if(CFG_CHAVES.some(c=>c.env===env)) return alert('Essa integração já existe na lista fixa.');
  const novas = (CFG_EXTRAS||[]).filter(x=>x.env!==env).concat([{ env, nome }]);

    if(!(await cfgChaveApi({ acao:'salvar', chave: env, valor }))) return;
    await logAdmin('salvar_chave_api','api_keys',env);
  }
  alert('Integração cadastrada e chave salva.');
  viewConfig();
}

async function cfgSincronizar(){
  const btn = document.getElementById('cfg-sync'); const msg = document.getElementById('cfg-sync-msg');
  const topics = kbGlobalTopics(); const porCurso = kbGlobalDiscs();
  btn.disabled = true; msg.textContent = 'Sincronizando…';
  try {
    const { data: cursos } = await PX.sb.from('courses').select('id,slug');
    let nd = 0, nt = 0;
    for(const c of (cursos||[])){
      const discs = porCurso[c.slug] || [];
      for(let i=0;i<discs.length;i++){
        const nome = discs[i];
        let { data: d } = await PX.sb.from('disciplines').select('id').eq('course_id', c.id).eq('nome', nome).maybeSingle();
        if(!d){
          const ins = await PX.sb.from('disciplines').insert({ course_id:c.id, nome, area:'geral', ordem:i }).select('id').single();
          if(ins.error) throw ins.error;
          d = ins.data; nd++;
        }
        const { data: exist } = await PX.sb.from('topics').select('nome').eq('discipline_id', d.id);
        const tem = new Set((exist||[]).map(t=>t.nome));
        const novos = (topics[nome]||[]).map((t,j)=>({ discipline_id:d.id, nome:t, ordem:j })).filter(t=>!tem.has(t.nome));
        if(novos.length){
          const r = await PX.sb.from('topics').insert(novos);
          if(r.error) throw r.error;
          nt += novos.length;
        }
        msg.textContent = `Sincronizando… ${c.slug} · ${nome}`;
      }
    }
    msg.textContent = `Pronto: ${nd} disciplina(s) e ${nt} tópico(s) publicados para os alunos.`;
    await logAdmin('sincronizar_curriculo','courses',null);
    await pintarSyncAviso();
  } catch(e){

    msg.textContent = 'Erro ao sincronizar: ' + (e.message || e);
  }
  btn.disabled = false;
}

function kbStatusDoc(doc){
  if(!doc) return 'rascunho';
  if(doc.publicado === true) return 'publicado';
  return doc.status === 'publicado' ? 'publicado' : 'rascunho';
}

/* Checklist do edital: tópico a tópico, o que já tem material e o que falta. */
function kbCoberturaDetalhe(discs){
  let totalTop = 0, totalOk = 0;
  const blocos = discs.map(function(d){
    const tops = kbTopicList(d);
    const linhas = tops.map(function(t){
      const doc = kbFind(d, t) || {};
      const tem = !!((doc.conteudo||'').trim());
      const st = tem ? kbStatusDoc(doc) : null;
      totalTop++; if(tem) totalOk++;
      const cor = !tem ? '#DC2626' : st === 'publicado' ? '#047857' : '#B45309';
      const rot = !tem ? 'Sem material' : st === 'publicado' ? 'Publicado' : KB_STATUS[st].rotulo;
      return '<div style="display:flex;gap:10px;align-items:center;padding:8px 13px;border-bottom:1px solid #F5F7FA;font-size:0.8rem">' +
        '<span style="width:6px;height:6px;border-radius:99px;background:' + cor + ';flex:none"></span>' +
        '<span style="flex:1;min-width:0">' + esc(t) + '</span>' +
        '<span class="kb-tag" style="color:' + cor + '">' + rot + '</span>' +
        '<button class="act" onclick="kbAbrirDoc(\'' + escJs(d) + '\',\'' + escJs(t) + '\')">Abrir</button>' +
      '</div>';
    }).join('');
    const ok = tops.filter(function(t){ return !!((kbFind(d,t)||{}).conteudo||'').trim(); }).length;
    return '<details style="margin-top:10px" ' + (ok < tops.length ? '' : '') + '>' +
      '<summary style="cursor:pointer;font-size:0.85rem;font-weight:650;padding:6px 2px">' + esc(d) +
        ' <span class="muted" style="font-weight:400">· ' + ok + '/' + tops.length + ' tópicos com material</span></summary>' +
      '<div class="kb-surface" style="margin-top:8px">' + (linhas || kbVazio('Sem tópicos cadastrados.')) + '</div></details>';
  }).join('');
  const pct = totalTop ? Math.round(totalOk / totalTop * 100) : 0;
  return '<hr class="kb-hr"><h4>Checklist do edital</h4>' +
    '<p class="muted" style="margin:4px 0 10px">' + totalOk + ' de ' + totalTop + ' tópicos do edital já têm material (' + pct + '%). ' +
    'Vermelho = nenhum material; amarelo = em rascunho (aluno não vê); verde = publicado para o aluno.</p>' + blocos;
}

/* =========================================================
   Carregar edital → IA extrai matérias, tópicos e subtópicos
   ========================================================= */
let ED_GRADE = [];
const edEl = id => document.getElementById(id);
function edMsg(t){ const el = edEl('ed-msg'); if(el) el.textContent = t; }
function edProg(feito, total, texto){
  const wrap = edEl('ed-prog-wrap'), bar = edEl('ed-prog-bar'), txt = edEl('ed-prog-txt');
  if(!wrap) return;
  if(total <= 0){ wrap.style.display = 'none'; return; }
  const pct = Math.max(0, Math.min(100, Math.round((feito/total)*100)));
  wrap.style.display = 'block';
  if(bar) bar.style.width = pct + '%';
  if(txt) txt.textContent = (texto || 'Processando') + ' — ' + pct + '%';
}
function edProgHide(){ const w = edEl('ed-prog-wrap'); if(w) w.style.display = 'none'; }

async function edInit(){
  const sel = edEl('ed-curso');
  if(sel && !sel.dataset.loaded){
    sel.dataset.loaded = '1';
    const { data: cs } = await PX.sb.from('courses').select('id,nome,slug').order('ordem');
    sel.innerHTML = (cs||[]).map(c=>`<option value="${c.id}" data-slug="${esc(c.slug)}" ${c.slug==='prf-2021'?'selected':''}>${esc(c.nome)} (${esc(c.slug)})</option>`).join('')
      || '<option value="">Cadastre um curso primeiro</option>';
  }
  const inp = edEl('ed-file');
  if(inp && !inp.dataset.bound){
    inp.dataset.bound = '1';
    inp.addEventListener('change', ()=> edLerArquivos(Array.from(inp.files||[])));
  }
  const drop = edEl('ed-drop');
  if(drop && !drop.dataset.bound){
    drop.dataset.bound = '1';
    ['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.style.borderColor='#94A9C9'; drop.style.background='#F5F8FE'; }));
    ['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.style.borderColor='#DDE3EC'; drop.style.background='#FBFCFE'; }));
    drop.addEventListener('drop', e => { const fs = Array.from((e.dataTransfer&&e.dataTransfer.files)||[]); if(fs.length) edLerArquivos(fs); });
  }
  if(ED_GRADE.length) edPaint();
}

window.edLimpar = function(){
  ED_GRADE = [];
  ED_EXIST = null; ED_REVISADO = false; ED_SOMENTE_NOVOS = false;
  const ta = edEl('ed-txt'); if(ta) ta.value = '';
  const pv = edEl('ed-preview'); if(pv) pv.innerHTML = '';
  edProgHide(); edMsg('');
};

async function edLerArquivos(files){
  const ta = edEl('ed-txt');
  if(!ta) return;
  let i = 0;
  for(const f of files){
    try{
      edProg(i, files.length, 'Lendo ' + f.name);
      const texto = await kbLerArquivo(f, null);

      if(texto) ta.value = (ta.value.trim() ? ta.value + '\n\n' : '') + texto;
    }catch(e){ edMsg('Erro ao ler "' + f.name + '": ' + e.message); }
    i++;
    edProg(i, files.length, 'Lendo edital');
  }
  edProgHide();
  edMsg(ta.value.length.toLocaleString('pt-BR') + ' caracteres carregados. Agora clique em “Extrair grade do edital”.');
}

function edPedacos(texto, tam){
  const out = [];
  for(let i=0;i<texto.length;i+=tam) out.push(texto.slice(i, i+tam));
  return out;
}
function edMesclar(disciplinas){
  disciplinas.forEach(function(d){
    const chave = d.nome.toLowerCase();
    let alvo = ED_GRADE.find(function(x){ return x.nome.toLowerCase() === chave; });
    if(!alvo){ alvo = { nome:d.nome, area:d.area||'especifica', incluir:true, topicos:[] }; ED_GRADE.push(alvo); }
    (d.topicos||[]).forEach(function(t){
      const tk = t.nome.toLowerCase();
      let tt = alvo.topicos.find(function(x){ return x.nome.toLowerCase() === tk; });
      if(!tt){ tt = { nome:t.nome, incluir:true, subtopicos:[] }; alvo.topicos.push(tt); }
      (t.subtopicos||[]).forEach(function(s){
        if(!tt.subtopicos.some(function(x){ return x.toLowerCase() === s.toLowerCase(); })) tt.subtopicos.push(s);
      });
    });
  });
}

window.edAnalisar = async function(){
  const ta = edEl('ed-txt');
  const material = (ta ? ta.value : '').trim();
  if(material.length < 200) return edMsg('Carregue o edital (arquivo) ou cole o conteúdo programático antes de extrair.');
  const btn = edEl('ed-btn');
  if(btn){ btn.disabled = true; btn.textContent = 'A IA está lendo o edital…'; }
  ED_GRADE = []; ED_EXIST = null; ED_REVISADO = false;
  const pedacos = edPedacos(material, 90000);
  const modelo = (edEl('ed-modelo')||{}).value || '';
  const cargo = (edEl('ed-cargo')||{}).value || '';
  let erros = 0;
  for(let i=0;i<pedacos.length;i++){
    edProg(i, pedacos.length, 'Extraindo grade (parte ' + (i+1) + ' de ' + pedacos.length + ')');
    try{
      const payload = { material: pedacos[i], parte: i+1, total_partes: pedacos.length };
      if(modelo) payload.modelo = modelo;
      if(cargo) payload.cargo = cargo;
      const j = await kbPost('/api/public/kb-edital', payload);
      edMesclar(j.disciplinas || []);
      edPaint();
    }catch(e){ erros++; edMsg('Parte ' + (i+1) + ': ' + e.message); }
    edProg(i+1, pedacos.length, 'Extraindo grade');
  }
  if(btn){ btn.disabled = false; btn.textContent = 'Extrair grade do edital'; }
  setTimeout(edProgHide, 1200);
  edPaint();
  if(!ED_GRADE.length) return edMsg('Não consegui identificar o conteúdo programático. Confira se o texto do edital foi carregado corretamente.');
  const tot = edTotais();
  edMsg('Grade extraída: ' + tot.d + ' matéria(s), ' + tot.t + ' tópico(s) e ' + tot.s + ' subtópico(s).'
    + (erros ? ' ' + erros + ' parte(s) falharam — você pode extrair de novo.' : '')
    + ' Confira abaixo e grave no curso.');
};

function edTotais(){
  const sel = ED_GRADE.filter(d=>d.incluir);
  const t = sel.reduce((a,d)=>a+d.topicos.filter(x=>x.incluir).length,0);
  const s = sel.reduce((a,d)=>a+d.topicos.filter(x=>x.incluir).reduce((b,x)=>b+x.subtopicos.length,0),0);
  return { d: sel.length, t, s };
}
window.edToggleDisc = function(i, v){ if(ED_GRADE[i]){ ED_GRADE[i].incluir = v; ED_GRADE[i].topicos.forEach(t=>t.incluir=v); edPaint(); } };
window.edToggleTop = function(i, j, v){ if(ED_GRADE[i] && ED_GRADE[i].topicos[j]){ ED_GRADE[i].topicos[j].incluir = v; edPaint(); } };
window.edRemoverDisc = function(i){ ED_GRADE.splice(i,1); edPaint(); };

/* ---- Etapa de revisão com modo comparar ---- */
let ED_EXIST = null;      /* { disciplina: Set(tópicos) } já gravado no curso */
let ED_REVISADO = false;  /* só libera a gravação depois da revisão */
let ED_SOMENTE_NOVOS = false;

const edNorm = s => String(s||'').trim().toLowerCase();

window.edComparar = async function(){
  const sel = edEl('ed-curso');
  const courseId = sel ? sel.value : '';
  if(!courseId) return edMsg('Selecione o curso de destino para comparar.');
  const btn = edEl('ed-comparar');
  if(btn){ btn.disabled = true; btn.textContent = 'Comparando…'; }
  try{
    const { data: ds, error } = await PX.sb.from('disciplines').select('id,nome').eq('course_id', courseId);
    if(error) throw error;
    const mapa = {};
    for(const d of (ds||[])){
      const { data: ts } = await PX.sb.from('topics').select('nome').eq('discipline_id', d.id);
      mapa[edNorm(d.nome)] = { nome: d.nome, topicos: new Set((ts||[]).map(t=>edNorm(t.nome))) };
    }
    ED_EXIST = mapa;
    ED_REVISADO = true;
    const r = edResumoComparacao();
    edMsg('Comparação pronta: ' + r.novasD + ' matéria(s) nova(s), ' + r.novosT + ' tópico(s)/subtópico(s) novo(s), '
      + r.iguais + ' já existente(s) e ' + r.faltando + ' item(ns) do curso que não estão neste edital. Confira e confirme a gravação.');
    edPaint();
  }catch(e){ edMsg('Não consegui comparar agora: ' + (e.message || e)); }
  if(btn){ btn.disabled = false; btn.textContent = 'Comparar com o curso'; }
};

/* Linhas que serão gravadas para um tópico (ele + subtópicos). */
function edLinhasTopico(t){
  const out = [t.nome];
  (t.subtopicos||[]).forEach(s => out.push(t.nome + ' — ' + s));
  return out;
}
function edStatusLinha(discKey, linha){
  if(!ED_EXIST) return 'desconhecido';
  const d = ED_EXIST[discKey];
  if(!d) return 'novo';
  return d.topicos.has(edNorm(linha)) ? 'existente' : 'novo';
}
function edResumoComparacao(){
  let novasD = 0, novosT = 0, iguais = 0;
  const usados = {};
  ED_GRADE.filter(d=>d.incluir).forEach(function(d){
    const k = edNorm(d.nome);
    if(!ED_EXIST || !ED_EXIST[k]) novasD++;
    usados[k] = usados[k] || new Set();
    d.topicos.filter(t=>t.incluir).forEach(function(t){
      edLinhasTopico(t).forEach(function(l){
        usados[k].add(edNorm(l));
        edStatusLinha(k, l) === 'existente' ? iguais++ : novosT++;
      });
    });
  });
  let faltando = 0;
  Object.keys(ED_EXIST || {}).forEach(function(k){
    ED_EXIST[k].topicos.forEach(function(t){ if(!usados[k] || !usados[k].has(t)) faltando++; });
  });
  return { novasD, novosT, iguais, faltando };
}
window.edFiltroNovos = function(v){ ED_SOMENTE_NOVOS = !!v; edPaint(); };
window.edRefazerRevisao = function(){ ED_REVISADO = false; ED_EXIST = null; edMsg('Revisão reiniciada. Ajuste a seleção e compare de novo.'); edPaint(); };

function edBadge(status){
  if(status === 'existente') return '<span class="kb-tag">já existe</span>';
  if(status === 'novo') return '<span class="kb-tag is-on">novo</span>';
  return '';
}

function edPaint(){
  const box = edEl('ed-preview');
  if(!box) return;
  if(!ED_GRADE.length){ box.innerHTML = ''; return; }
  const tot = edTotais();
  const cmp = ED_REVISADO ? edResumoComparacao() : null;

  const cabecalho = '<div style="padding:14px 16px;border-bottom:1px solid #EEF1F6;display:flex;gap:12px;align-items:center;flex-wrap:wrap">'
    + '<span style="min-width:0"><b style="display:block;font-size:0.875rem">Grade extraída do edital</b>'
    + '<span class="muted" style="font-size:0.75rem">' + tot.d + ' matérias · ' + tot.t + ' tópicos · ' + tot.s + ' subtópicos'
    + (cmp ? ' · ' + cmp.novasD + ' matérias novas · ' + cmp.novosT + ' itens novos · ' + cmp.iguais + ' já existentes · ' + cmp.faltando + ' só no curso' : '')
    + '</span></span>'
    + '<span style="flex:1"></span>'
    + (ED_REVISADO
        ? '<label class="muted" style="display:flex;gap:6px;align-items:center;font-size:0.78rem;margin:0"><input type="checkbox" ' + (ED_SOMENTE_NOVOS?'checked':'') + ' onchange="edFiltroNovos(this.checked)" style="width:auto">Mostrar só o que é novo</label>'
          + '<button class="act" onclick="edRefazerRevisao()">Refazer revisão</button>'
          + '<button class="act primary" id="ed-aplicar" onclick="edAplicar()">Confirmar e gravar</button>'
        : '<button class="act primary" id="ed-comparar" onclick="edComparar()">Comparar com o curso</button>')
    + '</div>'
    + (ED_REVISADO ? '' : '<div style="padding:10px 16px;background:#FBFCFE;border-bottom:1px solid #EEF1F6;font-size:0.78rem;color:#64748B">Etapa de revisão: compare com o que já está no curso antes de gravar.</div>');

  const lista = ED_GRADE.map(function(d,i){
    const k = edNorm(d.nome);
    const discNova = ED_REVISADO && !(ED_EXIST && ED_EXIST[k]);
    const topicosHTML = d.topicos.map(function(t,j){
      const linhas = edLinhasTopico(t);
      const status = ED_REVISADO ? (linhas.every(l => edStatusLinha(k,l) === 'existente') ? 'existente' : 'novo') : '';
      if(ED_REVISADO && ED_SOMENTE_NOVOS && status === 'existente') return '';
      return '<div style="padding:4px 0;font-size:0.8125rem">'
        + '<label style="display:flex;gap:9px;align-items:flex-start">'
        + '<input type="checkbox" ' + (t.incluir?'checked':'') + ' onchange="edToggleTop(' + i + ',' + j + ',this.checked)" style="width:auto;margin-top:3px">'
        + '<span>' + esc(t.nome) + ' ' + (ED_REVISADO ? edBadge(status) : '')
        + (t.subtopicos.length ? '<span class="muted"> — ' + t.subtopicos.map(esc).join(' · ') + '</span>' : '')
        + '</span></label></div>';
    }).join('');
    if(ED_REVISADO && ED_SOMENTE_NOVOS && !topicosHTML.trim() && !discNova) return '';
    return '<div style="border-bottom:1px solid #F5F7FA;padding:14px 16px">'
      + '<div style="display:flex;gap:10px;align-items:center">'
      + '<input type="checkbox" ' + (d.incluir?'checked':'') + ' onchange="edToggleDisc(' + i + ',this.checked)" style="width:auto">'
      + '<b style="flex:1;font-size:0.875rem">' + esc(d.nome) + '</b>'
      + (ED_REVISADO ? edBadge(discNova ? 'novo' : 'existente') : '')
      + '<span class="muted" style="font-size:0.75rem">' + esc(d.area) + ' · ' + d.topicos.length + ' tópicos</span>'
      + '<button class="act" onclick="edRemoverDisc(' + i + ')">Remover</button></div>'
      + '<div style="margin:8px 0 0 27px">' + (topicosHTML || '<span class="muted" style="font-size:0.75rem">Nada novo nesta matéria.</span>') + '</div></div>';
  }).join('');

  const soNoCurso = (ED_REVISADO && ED_EXIST) ? edSoNoCursoHTML() : '';

  box.innerHTML = '<div class="kb-surface">'
    + cabecalho + '<div style="max-height:52vh;overflow:auto">' + lista + soNoCurso + '</div></div>';
}

/* O que já está no curso e não aparece no edital extraído (nada é apagado — é só aviso). */
function edSoNoCursoHTML(){
  const usados = {};
  ED_GRADE.filter(d=>d.incluir).forEach(function(d){
    const k = edNorm(d.nome);
    usados[k] = usados[k] || new Set();
    d.topicos.filter(t=>t.incluir).forEach(t => edLinhasTopico(t).forEach(l => usados[k].add(edNorm(l))));
  });
  const blocos = Object.keys(ED_EXIST).map(function(k){
    const faltam = [];
    ED_EXIST[k].topicos.forEach(function(t){ if(!usados[k] || !usados[k].has(t)) faltam.push(t); });
    if(!faltam.length) return '';
    return '<div style="padding:4px 0;font-size:0.78rem"><b>' + esc(ED_EXIST[k].nome) + '</b>'
      + '<span class="muted"> — ' + faltam.slice(0,40).map(esc).join(' · ') + (faltam.length>40 ? ' … (+' + (faltam.length-40) + ')' : '') + '</span></div>';
  }).join('');
  if(!blocos) return '';
  return '<div style="padding:14px 16px;background:#FBFCFE;border-top:1px solid #EEF1F6">'
    + '<b style="font-size:0.82rem">Já está no curso e não veio neste edital</b>'
    + '<p class="muted" style="margin:3px 0 8px;font-size:0.75rem">Nada será apagado. Confira se algum item ficou de fora da extração.</p>'
    + blocos + '</div>';
}


window.edAplicar = async function(){
  const sel = edEl('ed-curso');
  const courseId = sel ? sel.value : '';
  if(!courseId) return edMsg('Selecione (ou cadastre) o curso de destino.');
  const escolhidas = ED_GRADE.filter(d=>d.incluir && d.topicos.some(t=>t.incluir));
  if(!escolhidas.length) return edMsg('Marque ao menos uma matéria para gravar.');
  if(!ED_REVISADO) return edMsg('Clique em “Comparar com o curso” e revise a grade antes de gravar.');
  const btn = edEl('ed-aplicar');
  if(btn){ btn.disabled = true; btn.textContent = 'Gravando…'; }
  let nd = 0, nt = 0;
  try{
    for(let i=0;i<escolhidas.length;i++){
      const d = escolhidas[i];
      edProg(i, escolhidas.length, 'Gravando ' + d.nome);
      let { data: row } = await PX.sb.from('disciplines').select('id').eq('course_id', courseId).eq('nome', d.nome).maybeSingle();
      if(!row){
        const ins = await PX.sb.from('disciplines').insert({ course_id: courseId, nome: d.nome, area: d.area || 'especifica', ordem: i }).select('id').single();
        if(ins.error) throw ins.error;
        row = ins.data; nd++;
      }
      const { data: exist } = await PX.sb.from('topics').select('nome').eq('discipline_id', row.id);
      const jaTem = new Set((exist||[]).map(t=>t.nome));
      const linhas = [];
      d.topicos.filter(t=>t.incluir).forEach(function(t){
        linhas.push(t.nome);
        t.subtopicos.forEach(function(s){ linhas.push(t.nome + ' — ' + s); });
      });
      const novos = linhas.filter(function(n){ return !jaTem.has(n); })
        .map(function(n, j){ return { discipline_id: row.id, nome: n, ordem: (exist||[]).length + j }; });
      for(let k=0;k<novos.length;k+=200){
        const r = await PX.sb.from('topics').insert(novos.slice(k, k+200));
        if(r.error) throw r.error;
      }
      nt += novos.length;
      edProg(i+1, escolhidas.length, 'Gravando matérias');
    }
    await logAdmin('importar_edital','courses',courseId,{ disciplinas: escolhidas.length, novas: nd, topicos: nt });
    edMsg('Pronto: ' + nd + ' matéria(s) nova(s) e ' + nt + ' tópico(s)/subtópico(s) gravados. Já aparecem na base de conhecimento e para os alunos.');
    setTimeout(edProgHide, 1200);
    ED_REVISADO = false; ED_EXIST = null;
    await loadKB();
    kbPaint();
  }catch(e){
    edMsg('Erro ao gravar: ' + (e.message || e));
  }
  if(btn){ btn.disabled = false; btn.textContent = 'Gravar no curso'; }
};

/* A coluna de Tópicos só faz sentido na edição manual de um tópico.
   No fluxo de upload (aba "Material e curso com IA") ela é recolhida. */
function kbAjustarColunas(){
  const grid = document.getElementById('kb-grid');
  const cols = document.getElementById('kb-topics');
  const discs = document.getElementById('kb-discs');
  if(!grid || !cols) return;
  /* A lista lateral de matérias é redundante: os cartões de matéria já ficam
     na tela anterior, com o botão "voltar". Fica sempre oculta. */
  if(discs) discs.style.display = 'none';
  const estreito = window.matchMedia('(max-width:820px)').matches;
  const esconder = KB_PANE === 'ia' || KB_PANE === 'aulas';
  cols.style.display = esconder ? 'none' : '';

}


/* Cobertura da matéria mostrada dentro do painel de upload. */
function kbCoberturaDisc(d){
  const tops = kbTopicList(d);
  const comAula = tops.filter(function(t){ return !!((kbFind(d, t)||{}).conteudo||'').trim(); });
  const faltam = tops.filter(function(t){ return !((kbFind(d, t)||{}).conteudo||'').trim(); });
  return { total: tops.length, feitos: comAula.length, faltam: faltam };
}
function kbPaintCobIA(){
  const box = document.getElementById('kb-cob-ia');
  if(!box) return;
  const c = kbCoberturaDisc(kbDisc);
  if(!c.total){ box.innerHTML = '<span class="muted">Esta matéria ainda não tem tópicos cadastrados.</span>'; return; }
  const ok = !c.faltam.length;
  box.innerHTML =
    '<b style="font-weight:650;color:' + (ok ? '#047857' : '#0F172A') + '">' + c.feitos + ' de ' + c.total + ' tópicos com aula</b>' +
    (ok ? ' <span class="muted">· matéria completa</span>'
        : ' <span class="muted">· faltam: ' + esc(c.faltam.join(' · ')) + '</span>');
}

let KB_AULAS = [];
let KB_AULAS_DISC = null;
let KB_CURSO_ID = null;

async function kbCursoId(){
  if(KB_CURSO_ID) return KB_CURSO_ID;
  const { data } = await PX.sb.from('courses').select('id').eq('slug','prf-2021').maybeSingle();
  KB_CURSO_ID = data ? data.id : null;
  return KB_CURSO_ID;
}
async function kbDiscId(nome){
  const cid = await kbCursoId();
  if(!cid) return null;
  const { data } = await PX.sb.from('disciplines').select('id').eq('course_id', cid).eq('nome', nome).maybeSingle();
  if(data) return data.id;
  const ins = await PX.sb.from('disciplines').insert({ course_id: cid, nome: nome, area: 'Geral', ordem: 99 }).select('id').maybeSingle();
  return ins.data ? ins.data.id : null;
}
function kbAulaNum(n){ return String(n).padStart(2,'0'); }
function kbAulaTitulo(nome){
  const m = /^\s*aula\s*(\d+)\s*[-–—:.]\s*(.+)$/i.exec(String(nome||''));
  return m ? m[2].trim() : String(nome||'');
}
async function kbAulasCarregar(disc){
  KB_AULAS_DISC = disc;
  KB_AULAS = [];
  const id = await kbDiscId(disc);
  if(!id) return;
  const { data } = await PX.sb.from('topics').select('id,nome,ordem').eq('discipline_id', id).order('ordem');
  KB_AULAS = (data || []).map(t => ({ id:t.id, nome:t.nome, ordem: typeof t.ordem === 'number' ? t.ordem : 0 }));
}

/* Excluir todas as aulas da matéria (aulas + conteúdo + PDFs anexados). */
window.kbAulasExcluirTodas = async function(){
  if(!KB_AULAS.length) return alert('Não há aulas cadastradas nesta matéria.');
  const nomes = KB_AULAS.map(function(a){ return a.nome; });
  if(!confirm('Excluir TODAS as ' + KB_AULAS.length + ' aulas de ' + kbDisc + '?\n\nO conteúdo e os PDFs dessas aulas serão apagados. Esta ação não pode ser desfeita.')) return;
  if(prompt('Para confirmar, digite EXCLUIR') !== 'EXCLUIR') return;
  const docs = KB_DOCS.filter(function(d){ return d.disciplina === kbDisc && nomes.indexOf(d.topico || '') >= 0; });
  const pdfs = docs.map(function(d){ return d.pdf_url; }).filter(function(u){ return String(u||'').trim(); });
  if(pdfs.length){ try{ await PX.sb.storage.from('aulas-pdf').remove(pdfs); }catch(e){} }
  if(docs.length){
    const r = await PX.sb.from('knowledge_docs').delete().in('id', docs.map(function(d){ return d.id; }));
    if(r.error) return alert('Erro ao apagar o conteúdo: ' + r.error.message);

async function kbAulasMover(de, para){
  const ordenadas = KB_AULAS.slice().sort((a,b)=>a.ordem-b.ordem);

  ordenadas.splice(para, 0, item);

  KB_AULAS = ordenadas;
  kbAulasPaint();
  kbAulaMsg('Salvando nova ordem…');

   e as demais são renumeradas automaticamente (00, 01, 02…). */
window.kbAulaNumeroEditar = async function(id){
  const ordenadas = KB_AULAS.slice().sort((a,b)=>a.ordem-b.ordem);
  const de = ordenadas.findIndex(x => x.id === id);
  if(de < 0) return;
  const max = ordenadas.length - 1;
  const resp = prompt('Número desta aula (0 a ' + max + '):', String(ordenadas[de].ordem));
  if(resp == null) return;
  const n = parseInt(String(resp).replace(/\D/g,''), 10);
  if(!Number.isFinite(n)) return kbAulaMsg('Digite apenas números.');
  const para = Math.max(0, Math.min(max, n));
  if(para === de) return;
  await kbAulasMover(de, para);
};

let KB_AULA_EDIT = null;
/* Markdown simples -> HTML, para a pré-visualização do modal. */
function kbMD(md){
  const e = function(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); };
  const inline = function(t){
    return t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
            .replace(/(^|[^*])\*([^*]+)\*/g,'$1<i>$2</i>')
            .replace(/`([^`]+)`/g,'<code style="background:#F1F5F9;padding:1px 4px;border-radius:4px">$1</code>');
  };
  const out = []; let ul = false, ol = false;
  e(md || '').split(/\r?\n/).forEach(function(ln){
    const l = ln.trim();
    const li = l.match(/^[-*]\s+(.*)$/);
    const oli = l.match(/^\d+[.)]\s+(.*)$/);
    if(li){ if(ol){ out.push('</ol>'); ol=false; } if(!ul){ out.push('<ul>'); ul=true; } return out.push('<li>'+inline(li[1])+'</li>'); }
    if(oli){ if(ul){ out.push('</ul>'); ul=false; } if(!ol){ out.push('<ol>'); ol=true; } return out.push('<li>'+inline(oli[1])+'</li>'); }
    if(ul){ out.push('</ul>'); ul=false; }
    if(ol){ out.push('</ol>'); ol=false; }
    if(!l) return;
    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if(h) return out.push('<h' + Math.min(h[1].length+2,5) + ' style="margin:12px 0 6px;color:#1E3A8A">' + inline(h[2]) + '</h' + Math.min(h[1].length+2,5) + '>');
    if(/^>\s?/.test(l)) return out.push('<blockquote style="margin:8px 0;padding-left:10px;border-left:3px solid #CBD5E1;color:#475569">'+inline(l.replace(/^>\s?/,''))+'</blockquote>');
    out.push('<p style="margin:6px 0">' + inline(l) + '</p>');
  });
  if(ul) out.push('</ul>');
  if(ol) out.push('</ol>');
  return out.join('');
}

/* ---------- Editor visual estilo Word ----------
   O conteúdo continua salvo em Markdown (compatível com a IA e o RAG): o editor
   converte Markdown -> HTML ao abrir a janela e HTML -> Markdown ao salvar. */
function kbMdInline(t){
  return t
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/==(.+?)==/g, '<mark>$1</mark>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>');
}
window.kbMdParaHtml = function(md){
  const e = function(s){ return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); };
  const out = []; let ul = false, ol = false;
  const fecha = function(){ if(ul){ out.push('</ul>'); ul = false; } if(ol){ out.push('</ol>'); ol = false; } };
  e(md || '').split(/\r?\n/).forEach(function(ln){
    const l = ln.trim();
    const li = l.match(/^[-*]\s+(.*)$/);
    if(li){ if(ol){ out.push('</ol>'); ol = false; } if(!ul){ out.push('<ul>'); ul = true; } return out.push('<li>' + kbMdInline(li[1]) + '</li>'); }
    const oli = l.match(/^\d+[.)]\s+(.*)$/);
    if(oli){ if(ul){ out.push('</ul>'); ul = false; } if(!ol){ out.push('<ol>'); ol = true; } return out.push('<li>' + kbMdInline(oli[1]) + '</li>'); }
    fecha();
    if(!l) return;
    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if(h){ const n = Math.min(h[1].length + 1, 4); return out.push('<h' + n + '>' + kbMdInline(h[2]) + '</h' + n + '>'); }
    const q = l.match(/^>\s?(.*)$/);
    if(q) return out.push('<blockquote>' + kbMdInline(q[1]) + '</blockquote>');
    out.push('<p>' + kbMdInline(l) + '</p>');
  });
  fecha();
  return out.join('');
};
window.kbHtmlParaMd = function(html){
  const raiz = document.createElement('div');
  raiz.innerHTML = html || '';
  const linhas = [];
  const inlineMd = function(no){
    let t = '';
    no.childNodes.forEach(function(n){
      if(n.nodeType === 3){ t += n.nodeValue.replace(/\s{2,}/g, ' '); return; }
      if(n.nodeType !== 1) return;
      const tag = n.tagName.toLowerCase();
      if(tag === 'script' || tag === 'style') return;
      if(tag === 'br'){ t += '\n'; return; }
      const inner = inlineMd(n);
      const limpo = inner.trim();
      if(tag === 'b' || tag === 'strong'){ t += limpo ? '**' + limpo + '**' : ''; return; }
      if(tag === 'i' || tag === 'em'){ t += limpo ? '*' + limpo + '*' : ''; return; }
      if(tag === 'mark'){ t += limpo ? '==' + limpo + '==' : ''; return; }
      if(tag === 'code'){ t += limpo ? '`' + limpo.replace(/`/g, '') + '`' : ''; return; }
      t += inner;
    });
    return t;
  };
  const bloco = function(n){
    if(n.nodeType === 3){ const v = n.nodeValue.trim(); if(v) linhas.push(v, ''); return; }
    if(n.nodeType !== 1) return;
    const tag = n.tagName.toLowerCase();
    if(tag === 'ul' || tag === 'ol'){
      let i = 0;
      n.childNodes.forEach(function(li){
        if(li.nodeType !== 1 || li.tagName.toLowerCase() !== 'li') return;
        i++;
        const txt = inlineMd(li).replace(/\n+/g, ' ').trim();
        if(txt) linhas.push((tag === 'ul' ? '- ' : i + '. ') + txt);
      });
      linhas.push('');
      return;
    }
    if(tag === 'blockquote'){
      inlineMd(n).split('\n').forEach(function(l){ const v = l.trim(); if(v) linhas.push('> ' + v); });
      linhas.push('');
      return;
    }
    const hm = tag.match(/^h([1-6])$/);
    if(hm){
      const nivel = Math.min(Math.max(parseInt(hm[1], 10) - 1, 1), 4);
      const txt = inlineMd(n).trim();
      if(txt) linhas.push('#'.repeat(nivel) + ' ' + txt, '');
      return;
    }
    if(tag === 'hr' || tag === 'script' || tag === 'style') return;
    inlineMd(n).split('\n').forEach(function(l){ linhas.push(l.replace(/[ \t]+$/g, '')); });
    linhas.push('');
  };
  raiz.childNodes.forEach(bloco);
  return linhas.join('\n').replace(/\n{3,}/g, '\n\n').replace(/^\n+|\n+$/g, '');
};
window.kbEdCmd = function(alvo, cmd){
  const ed = document.getElementById(alvo);
  if(!ed) return;
  ed.focus();
  if(cmd === 'mark'){ kbEdGrifar(ed); kbAulaModalMudou(); return; }
  if(cmd === 'h2' || cmd === 'h3' || cmd === 'p' || cmd === 'blockquote'){
    let atual = '';
    const sel = window.getSelection();
    if(sel && sel.anchorNode){
      const no = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
      const b = no && no.closest ? no.closest('h2,h3,p,blockquote') : null;
      if(b && ed.contains(b)) atual = b.tagName.toLowerCase();
    }
    document.execCommand('formatBlock', false, atual === cmd ? 'p' : cmd);
  }else{
    document.execCommand(cmd, false, null);
  }
  kbAulaModalMudou();
};
function kbEdGrifar(ed){
  const sel = window.getSelection();
  if(!sel || !sel.rangeCount || !sel.anchorNode) return;
  const r = sel.getRangeAt(0);
  if(r.collapsed || !ed.contains(r.commonAncestorContainer)) return;
  const no = sel.anchorNode.nodeType === 1 ? sel.anchorNode : sel.anchorNode.parentElement;
  const mk0 = no && no.closest ? no.closest('mark') : null;
  if(mk0 && ed.contains(mk0)){
    const pai = mk0.parentNode;
    while(mk0.firstChild) pai.insertBefore(mk0.firstChild, mk0);
    pai.removeChild(mk0);
    return;
  }
  const frag = r.extractContents();
  const mk = document.createElement('mark');
  mk.appendChild(frag);
  r.insertNode(mk);
  sel.removeAllRanges();
}
window.kbEdColar = function(ev){

/* Marca de uma vez todas as aulas com PDF anexado para abrirem no modo PDF. */
window.kbAulasTodasPdf = async function(){
  if(!kbDisc) return;
  const docs = KB_AULAS.map(function(a){ return kbFind(kbDisc, a.nome); }).filter(Boolean);
  const comPdf = docs.filter(function(d){ return String(d.pdf_url||'').trim(); });
  const semPdf = docs.length - comPdf.length;
  if(!comPdf.length){
    if(confirm('Nenhuma aula desta matéria tem PDF anexado ainda.\n\nQuer escolher os PDFs agora e anexá-los às aulas de uma vez?')){
      return kbAulasPdfLote();
    }
    kbAulaMsg('Nenhuma aula com PDF anexado nesta matéria.');
    return;
  }
  const quebradas = docs.filter(function(d){ return d.modo_exibicao === 'pdf' && !String(d.pdf_url||'').trim(); });
  if(quebradas.length && confirm(quebradas.length + ' aula(s) estão marcadas como PDF mas sem arquivo anexado — por isso o aluno não vê o PDF.\n\nQuer escolher os arquivos agora para anexar a elas?')){
    return kbAulasPdfLote();
  }
  const faltam = comPdf.filter(function(d){ return d.modo_exibicao !== 'pdf'; });
  if(!confirm('Colocar ' + comPdf.length + ' aula(s) de ' + kbDisc + ' para o aluno ver em PDF?' +
      (semPdf ? '\n\n' + semPdf + ' aula(s) sem PDF anexado ficarão como estão.' : ''))) return;
  kbAulaMsg('Atualizando ' + comPdf.length + ' aula(s)…');
  const { data, error } = await PX.sb.from('knowledge_docs')
    .update({ modo_exibicao: 'pdf', updated_by: PX.user ? PX.user.id : null })
    .in('id', comPdf.map(function(d){ return d.id; }))
    .select('id');
  if(error){ alert('Erro ao atualizar: ' + error.message); kbAulaMsg('Erro ao atualizar: ' + error.message); return; }
  if(!data || !data.length){
    alert('Nada foi alterado — sua sessão de administrador expirou. Entre novamente e repita.');
    kbAulaMsg('Nada foi alterado: sessão de administrador expirada.');
    return;
  }
  await logAdmin('aulas_modo_pdf','knowledge_docs', null, { disciplina: kbDisc, total: data.length });
  await loadKB();
  kbPaint();
  const aviso = data.length + ' aula(s) de ' + kbDisc + ' agora abrem em PDF para o aluno' +
    (faltam.length ? ' (' + faltam.length + ' foram alteradas agora).' : '.') +
    (semPdf ? '\n' + semPdf + ' aula(s) sem PDF continuam em texto.' : '');
  alert('Pronto! ' + aviso);
  kbAulaMsg(aviso.replace('\n', ' '));
};

/* Anexa vários PDFs de uma vez às aulas já cadastradas.
   Casa pelo número da aula no nome do arquivo (ex.: "Aula 03.pdf");
   o que não casar entra, em ordem, nas aulas que ainda estão sem PDF. */
window.kbAulasPdfLote = function(){
  if(!kbDisc) return;
  if(!KB_AULAS.length) return alert('Cadastre as aulas antes de anexar os PDFs.');
  const inp = document.createElement('input');
  inp.type = 'file'; inp.multiple = true; inp.accept = 'application/pdf,.pdf';
  inp.onchange = async function(){
    const files = Array.prototype.slice.call(inp.files || []).filter(function(f){
      return /pdf/i.test(f.type || '') || /\.pdf$/i.test(f.name || '');
    });
    if(!files.length) return;
    files.sort(function(a,b){ return a.name.localeCompare(b.name, 'pt-BR', { numeric:true }); });

    const aulas = KB_AULAS.slice().sort(function(a,b){ return a.ordem - b.ordem; });
    const usadas = {};
    const pares = [];
    const sobra = [];
    files.forEach(function(f){
      const m = /aula[\s_\-]*(\d+)/i.exec(f.name);
      let alvo = null;
      if(m){ const n = parseInt(m[1],10); alvo = aulas.find(function(a){ return a.ordem === n && !usadas[a.id]; }) || null; }
      if(alvo){ usadas[alvo.id] = 1; pares.push({ aula: alvo, file: f }); } else sobra.push(f);
    });
    const livres = aulas.filter(function(a){
      return !usadas[a.id] && !String((kbFind(kbDisc, a.nome)||{}).pdf_url || '').trim();
    });
    sobra.forEach(function(f, i){ if(livres[i]){ usadas[livres[i].id] = 1; pares.push({ aula: livres[i], file: f }); } });
    if(!pares.length) return alert('Não consegui casar nenhum arquivo com as aulas desta matéria.');

    if(!confirm('Anexar ' + pares.length + ' PDF(s) às aulas de ' + kbDisc + ' e deixar o aluno abrindo em PDF?')) return;
    KB_ING_ATIVO = true;
    let ok = 0, passo = 0;
    for(const p of pares){
      kbAulaMsg('Enviando ' + p.file.name + '…');
      kbIngProg(passo, pares.length, 'Enviando PDFs');
      try{
        const limpo = p.file.name.replace(/[^\w.\-]+/g, '_');
        const caminho = 'prf-2021/' + String(kbDisc).replace(/[^\w\-]+/g, '_') + '/' + p.aula.id + '-' + Date.now() + '-' + limpo;
        const up = await PX.sb.storage.from('aulas-pdf').upload(caminho, p.file, { contentType:'application/pdf', upsert:true });
        if(up.error) throw new Error(up.error.message);
        const doc = kbFind(kbDisc, p.aula.nome);
        if(doc){
          const r = await PX.sb.from('knowledge_docs')
            .update({ pdf_url: caminho, modo_exibicao: 'pdf', updated_by: PX.user ? PX.user.id : null })
            .eq('id', doc.id).select('id');
          if(r.error) throw new Error(r.error.message);
          if(!r.data || !r.data.length) throw new Error('sessão de administrador expirada');
        }else{
          const r = await PX.sb.from('knowledge_docs').insert({
            course_slug:'prf-2021', disciplina: kbDisc, topico: p.aula.nome, titulo: kbAulaTitulo(p.aula.nome),
            conteudo: '', status: 'publicado', publicado: true, modo_exibicao: 'pdf', pdf_url: caminho,
            updated_by: PX.user ? PX.user.id : null,
          }).select('id');
          if(r.error) throw new Error(r.error.message);
        }
        ok++;
      }catch(e){ kbAulaMsg('Falha em ' + p.file.name + ': ' + (e.message || e)); }
      passo++;
      kbIngProg(passo, pares.length, 'Enviando PDFs');
    }
    KB_ING_ATIVO = false;
    setTimeout(kbIngProgHide, 1200);
    await logAdmin('anexar_pdfs_lote','knowledge_docs', null, { disciplina: kbDisc, total: ok });
    await loadKB();
    kbPaint();
    alert(ok + ' PDF(s) anexados — essas aulas agora abrem em PDF para o aluno.');
    kbAulaMsg(ok + ' PDF(s) anexados às aulas de ' + kbDisc + '.');
  };
  inp.click();
};

/* Adiciona arquivos escolhidos ou soltos na área de arrastar. */
function kbAulaFilaAdd(files){
  const novos = Array.prototype.slice.call(files || []);
  if(!novos.length) return;
  let repetidos = 0;
  novos.forEach(function(f){
    /* Não deixa o mesmo arquivo entrar duas vezes na fila. */
    const ja = KB_AULA_FILA.some(function(x){ return x.nome === f.name && x.file && x.file.size === f.size; });
    if(ja){ repetidos++; return; }
    KB_AULA_FILA.push({ file:f, nome:f.name, estado:'fila', chars:0, erro:'' });
  });
  kbAulaFilaPaint();
  kbAulaMsg(KB_AULA_FILA.length + ' arquivo(s) na fila' + (repetidos ? ' (' + repetidos + ' repetido(s) ignorado(s))' : '') + '. Clique em “Cadastrar aula(s)”.');
}
function kbBindAulaFile(){
  const inp = document.getElementById('kb-aula-file');
  if(inp && !inp.dataset.bound){
    inp.dataset.bound = '1';
    inp.addEventListener('change', function(){ kbAulaFilaAdd(inp.files); });
  }
  const drop = document.getElementById('kb-aula-drop');
  if(drop && !drop.dataset.bound){
    drop.dataset.bound = '1';
    ['dragenter','dragover'].forEach(function(ev){
      drop.addEventListener(ev, function(e){ e.preventDefault(); drop.style.borderColor = '#94A9C9'; drop.style.background = '#F5F8FE'; });
    });
    ['dragleave','drop'].forEach(function(ev){
      drop.addEventListener(ev, function(e){ e.preventDefault(); drop.style.borderColor = ''; drop.style.background = ''; });
    });
    drop.addEventListener('drop', function(e){
      kbAulaFilaAdd((e.dataTransfer && e.dataTransfer.files) || []);
    });
  }
}

/* Título automático: primeira linha útil do material, ou o nome do arquivo. */
function kbAulaTituloAuto(texto, origem, numero){
  const linha = String(texto || '').split(/\r?\n/).map(s => s.trim()).find(s => s.length > 3);
  let t = kbAulaTitulo(String(linha || '').replace(/^#+\s*/, '')).trim();
  if(!t && origem) t = kbAulaTitulo(String(origem).replace(/\.[a-z0-9]+$/i, '')).trim();
  if(!t) t = 'Aula ' + kbAulaNum(numero);
  return t.slice(0, 90);
}

/* Aulas criadas na última operação (usado para preparar o conteúdo de IA). */
let KB_AULAS_CRIADAS = [];

/* Cria (ou atualiza) uma aula com o texto recebido. Devolve o número usado. */
async function kbAulaCriar(disc, texto, origem, publicar, arquivo){
  await kbAulasCarregar(disc);
  const numero = KB_AULAS.length ? Math.max.apply(null, KB_AULAS.map(a=>a.ordem)) + 1 : 0;
  const titulo = kbAulaTituloAuto(texto, origem, numero);
  const discId = await kbDiscId(disc);
  if(!discId) throw new Error('Não encontrei esta matéria no curso.');

  const existente = KB_AULAS.find(a => kbAulaTitulo(a.nome).toLowerCase() === titulo.toLowerCase());
  let nomeTopico = titulo;
  let topicoId = existente ? existente.id : null;
  if(existente){
    nomeTopico = existente.nome;
  }else{
    const ins = await PX.sb.from('topics').insert({ discipline_id: discId, nome: titulo, ordem: numero, dificuldade: 'media' }).select('id').maybeSingle();
    if(ins.error) throw new Error('Erro ao criar a aula: ' + ins.error.message);
    topicoId = ins.data ? ins.data.id : null;
  }
  const ordem = existente ? existente.ordem : numero;

  /* Se o material enviado for um PDF, ele também fica anexado à aula,
     para o aluno poder abrir o arquivo original (modo PDF). */
  let pdfPath = '';
  if(arquivo && (/pdf/i.test(arquivo.type || '') || /\.pdf$/i.test(arquivo.name || ''))){
    const limpo = String(arquivo.name).replace(/[^\w.\-]+/g, '_');
    const caminho = 'prf-2021/' + String(disc || 'geral').replace(/[^\w\-]+/g, '_') + '/' +
      (topicoId || 'aula') + '-' + Date.now() + '-' + limpo;
    const up = await PX.sb.storage.from('aulas-pdf').upload(caminho, arquivo, { contentType: 'application/pdf', upsert: true });
    if(up.error) throw new Error('Não consegui enviar o PDF desta aula: ' + up.error.message);
    pdfPath = caminho;
  }

  const payload = {
    course_slug: 'prf-2021', disciplina: disc, topico: nomeTopico,
    titulo: titulo,
    conteudo: texto, status: publicar ? 'publicado' : 'rascunho',
    publicado: !!publicar, updated_by: PX.user ? PX.user.id : null,
  };
  if(pdfPath){ payload.pdf_url = pdfPath; payload.modo_exibicao = 'pdf'; }
  const atual = kbFind(disc, nomeTopico);
  const q = atual
    ? await PX.sb.from('knowledge_docs').update(payload).eq('id', atual.id)
    : await PX.sb.from('knowledge_docs').insert(payload);
  if(q.error) throw new Error('Aula criada, mas o conteúdo não salvou: ' + q.error.message);

window.kbAulaCadastrar = async function(){
  const disc = kbValidDisc(kbDisc);
  if(!disc) return kbAulaMsg('Escolha uma matéria antes.');
  const publicar = !!(document.getElementById('kb-aula-pub')||{}).checked;
  KB_AULAS_CRIADAS = [];

  try{
    if(KB_AULA_TAB === 'doc'){
      const pend = KB_AULA_FILA.filter(f => f.estado === 'fila' || f.estado === 'falhou');
      if(!pend.length) return kbAulaMsg('Escolha um ou mais arquivos antes.');
      let feitas = 0, passo = 0;
      KB_ING_ATIVO = true;
      kbIngProg(0, pend.length, 'Lendo arquivos');
      for(const item of pend){
        item.estado = 'lendo'; item.erro = ''; kbAulaFilaPaint();
        kbAulaMsg('Lendo ' + item.nome + '…');
        try{
          const texto = await kbAulaLerArquivo(item.file);
          if(texto.length < 20) throw new Error('Não consegui extrair texto deste arquivo.');
          item.chars = texto.length;
          await kbAulaCriar(disc, texto, item.nome, publicar, item.file);
          item.estado = 'pronto'; feitas++;
        }catch(e){ item.estado = 'falhou'; item.erro = e.message || String(e); }
        passo++;
        kbAulaFilaPaint();
        kbIngProg(passo, pend.length, 'Lendo arquivos');
      }
      KB_ING_ATIVO = false;
      kbIngProg(pend.length, pend.length, 'Leitura concluída');
      setTimeout(kbIngProgHide, 1200);
      try{ if(PX.syncCurriculo) await PX.syncCurriculo(); }catch(e){}
      /* Tira da fila o que já virou aula — só sobra o que falhou, sem lista repetida. */
      KB_AULA_FILA = KB_AULA_FILA.filter(function(f){ return f.estado !== 'pronto'; });
      const inpDoc = document.getElementById('kb-aula-file');
      if(inpDoc) inpDoc.value = '';
      kbPaint(); kbPane('aulas');
      kbAulaFilaPaint();
      if(publicar && KB_AULAS_CRIADAS.length){
        prepPainel();
        prepLog('Preparando o conteúdo de IA de ' + KB_AULAS_CRIADAS.length + ' aula(s) publicada(s)…', '#FDE68A');
        (async function(){
          const lista = KB_AULAS_CRIADAS.slice();
          for(let i=0;i<lista.length;i++){
            prepLog('— ' + (i+1) + '/' + lista.length, '#64748B');
            await kbPrepararAula(lista[i].disc, lista[i].topico);
          }
          prepLog('<b>Tudo pronto — o aluno já encontra aula, resumo, questões, flashcards e podcast salvos.</b>', '#FDE68A');
        })();
      }
      return kbAulaMsg(feitas + ' aula(s) cadastrada(s)' + (publicar ? ' e publicada(s).' : ' como rascunho.') +
        ' Os PDFs enviados ficaram anexados às aulas — use “Exibir todas em PDF” para o aluno abrir o arquivo original.');
    }

    let texto = '', origem = '';
    if(KB_AULA_TAB === 'texto'){
      texto = String((document.getElementById('kb-aula-txt')||{}).value || '').trim();
    }else{
      const campo = KB_AULA_TAB === 'video' ? 'kb-aula-video' : 'kb-aula-url';
      const url = String((document.getElementById(campo)||{}).value || '').trim();
      if(!url) return kbAulaMsg('Cole o link antes de cadastrar.');
      kbAulaMsg('Lendo o conteúdo do link…');
      const j = await kbPost('/api/public/kb-ingest', { tipo: KB_AULA_TAB === 'video' ? 'video' : 'url', url: url, disciplina: disc || undefined, topico: kbTopic || undefined });
      texto = String(j.texto || '').trim();
      origem = j.origem || url;
    }
    if(texto.length < 20) return kbAulaMsg('Material muito curto — cole o conteúdo da aula antes de cadastrar.');

    kbAulaMsg('Cadastrando aula…');
    const n = await kbAulaCriar(disc, texto, origem, publicar);
    try{ if(PX.syncCurriculo) await PX.syncCurriculo(); }catch(e){}
    ['kb-aula-txt','kb-aula-url','kb-aula-video'].forEach(function(id){ const el = document.getElementById(id); if(el) el.value = ''; });
    kbPaint();
    kbPane('aulas');
    kbAulaMsg('Aula ' + kbAulaNum(n) + (publicar ? ' publicada — preparando aula da Athena, resumo, questões, flashcards, lacunas e podcast…' : ' salva como rascunho.'));
    if(publicar && KB_AULAS_CRIADAS.length) kbPrepararAula(KB_AULAS_CRIADAS[0].disc, KB_AULAS_CRIADAS[0].topico);
  }catch(e){ KB_ING_ATIVO = false; kbIngProgHide(); kbAulaMsg('Erro: ' + (e.message || e)); }
};

/* Importação do Drive: lê a pasta (ou o arquivo), guarda na biblioteca e já
   deixa o texto disponível como fonte para montar o curso. */
window.kbDriveImportar = async function(){
  const msg = document.getElementById('kb-drive-msg');
  const url = (document.getElementById('kb-drive-url')||{}).value || '';
  const setMsg = t => { if(msg) msg.textContent = t; };
  if(!kbValidDisc(kbDisc)){ setMsg('Selecione uma matéria válida antes de importar.'); return 0; }
  if(!url.trim()){ setMsg('Cole o link da pasta ou do arquivo do Google Drive.'); return 0; }
  setMsg('Conectando ao Google Drive…');
  try{
    const j = await kbPost('/api/public/kb-drive', { pasta_url: url.trim(), disciplina: kbDisc, topico: kbTopic || null });
    const arqs = j.arquivos || [];
    let n = 0, falhas = 0, ultimoErro = '';
    for(const a of arqs){
      const erro = await kbLibGravar({ nome:a.nome, tipo:'google_drive', origem_url:a.origem_url, texto:a.texto, direitos:'material_proprio' }, true);
      if(erro){ falhas++; ultimoErro = erro; }
      else n++;
      setMsg('Importando ' + (n + falhas) + ' de ' + arqs.length + '…');
    }
    await loadLib();
    kbPaintBiblioteca();
    setMsg(n + ' arquivo(s) importados do Drive e guardados nos documentos-fonte desta matéria.' +
      (falhas ? ' ' + falhas + ' falharam ao salvar: ' + ultimoErro : ''));
    return n;
  }catch(e){ setMsg(e.message); return 0; }
};

async function kbToken(){ const { data } = await PX.sb.auth.getSession(); return data.session ? data.session.access_token : ''; }
async function kbPost(path, payload){
  const token = await kbToken();
  const headers = { 'Content-Type':'application/json' };
  if(token) headers.Authorization = 'Bearer ' + token;
  const r = await fetch(path, { method:'POST', headers:headers, body: JSON.stringify(payload) });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || 'Falha na requisição.');
  return j;
}
async function kbReq(path, method, payload){
  const token = await kbToken();
  const opt = { method: method || 'GET', headers:{} };
  if(token) opt.headers.Authorization = 'Bearer ' + token;
  if(payload){ opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(payload); }
  const r = await fetch(path, opt);
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || 'Falha na requisição.');
  return j;
}
function kbEhTextoSimples(f){

  return /^text\//i.test(f.type || '') || /\.(txt|md|markdown|csv|json|srt|vtt|log|tsv)$/i.test(f.name || '');
}
function kbEhImagem(f){
  return /^image\//i.test(f.type || '') || /\.(png|jpe?g|webp|gif|bmp|heic|heif|tiff?)$/i.test(f.name || '');
}

/* ---- Leitor único de material (usado pelo edital, pela aula e pelo lote) ----
   PDF digital, PDF escaneado (transcrito por IA), imagem e texto simples.
   Quando há matéria selecionada, o texto extraído já fica guardado na
   biblioteca da matéria para revisão/edição antes de publicar. */
async function kbLerArquivo(f, disciplina){
  if(kbEhTextoSimples(f)){
    const texto = (await f.text()).trim();
    if(texto && disciplina){
      try{ await kbPost('/api/public/kb-ingest', { tipo:'texto', texto:texto, nome:f.name, disciplina:disciplina, topico:kbTopic||undefined }); }catch(e){}
    }
    return texto;
  }
  const b64 = await new Promise(function(res,rej){ const r = new FileReader(); r.onload=function(){ res(String(r.result)); }; r.onerror=rej; r.readAsDataURL(f); });
  const j = await kbPost('/api/public/kb-ingest', {
    tipo: kbEhImagem(f) ? 'imagem' : 'auto',
    nome: f.name, mime: f.type || '', arquivo_base64: b64,
    disciplina: disciplina || undefined, topico: kbTopic || undefined,
  });
  return String(j.texto || '').trim();
}

function kbEhVideoUrl(u){
  return /(youtube\.com|youtu\.be|vimeo\.com|dailymotion\.com)/i.test(u || '');
}
