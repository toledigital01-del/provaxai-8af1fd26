<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Painel Administrativo – Prova X</title>
<meta name="description" content="Gestão de alunos, cursos, assinaturas, IA e suporte da plataforma Prova X.">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F8FAFC;color:#0F172A;}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 18px 60px;}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  header h1{font-size:1.25rem;font-weight:800;letter-spacing:-0.02em;}
  .badge{background:#EFF6FF;color:#1D4ED8;border-radius:999px;padding:4px 10px;font-size:0.72rem;font-weight:700;}
  .spacer{flex:1;}
  a.back{font-size:0.83rem;color:#2563EB;text-decoration:none;font-weight:600;}
  .tabs{display:flex;gap:6px;overflow-x:auto;background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:5px;margin-bottom:18px;}
  .tabs button{white-space:nowrap;border:none;background:transparent;padding:9px 14px;border-radius:10px;font-size:0.84rem;font-weight:600;color:#64748B;cursor:pointer;font-family:inherit;}
  .tabs button.on{background:#2563EB;color:#fff;}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px;}
  .kpi{background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:14px 16px;}
  .kpi b{display:block;font-size:1.5rem;font-weight:800;letter-spacing:-0.03em;}
  .kpi span{font-size:0.78rem;color:#64748B;}
  .card{background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:16px;margin-bottom:16px;}
  .card h2{font-size:0.95rem;font-weight:700;margin-bottom:12px;}
  table{width:100%;border-collapse:collapse;font-size:0.83rem;}
  th{text-align:left;color:#64748B;font-weight:600;font-size:0.75rem;text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid #E2E8F0;}
  td{padding:9px 10px;border-bottom:1px solid #F1F5F9;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  .pill{border-radius:999px;padding:3px 9px;font-size:0.72rem;font-weight:700;}
  .pill.ok{background:#ECFDF5;color:#047857;}
  .pill.warn{background:#FFFBEB;color:#B45309;}
  .pill.off{background:#FEF2F2;color:#B91C1C;}
  .pill.n{background:#F1F5F9;color:#475569;}
  button.act{border:1px solid #E2E8F0;background:#fff;border-radius:9px;padding:5px 10px;font-size:0.76rem;font-weight:600;cursor:pointer;font-family:inherit;color:#0F172A;}
  button.act.primary{background:#2563EB;border-color:#2563EB;color:#fff;}
  button.act.danger{color:#B91C1C;}
  input,select,textarea{border:1px solid #E2E8F0;border-radius:9px;padding:8px 10px;font-size:0.84rem;font-family:inherit;background:#FBFBFC;width:100%;}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end;margin-bottom:12px;}
  .muted{color:#64748B;font-size:0.82rem;}
  .hide{display:none;}
  @media(max-width:640px){ table{font-size:0.78rem;} th,td{padding:7px 6px;} }
@keyframes pxspin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Painel Administrativo</h1>
    <span class="badge">Prova X</span>
    <div class="spacer"></div>
    <span class="muted" id="who"></span>
    <a class="back" href="home.html">← Voltar ao app</a>
  </header>

  <div class="tabs" id="tabs"></div>
  <div id="view"><p class="muted">Carregando…</p></div>
</div>

<script src="data.js"></script>
<script src="px-kb-payload.js"></script>
<script src="px-auth.js"></script>
<script>
const TABS = [
  ['geral','Visão geral'],['conhecimento','Base de conhecimento (IA)'],['alunos','Alunos'],['cursos','Cursos'],['conteudo','Conteúdo'],
  ['financeiro','Financeiro'],['planos','Planos e cupons'],['ia','Athena IA'],
  ['suporte','Suporte'],['logs','Logs'],['config','Configurações']
];
let tab = location.hash.replace('#','') || 'geral';
const view = document.getElementById('view');
const money = c => 'R$ ' + ((c || 0) / 100).toFixed(2).replace('.', ',');
const dt = s => s ? new Date(s).toLocaleDateString('pt-BR') : '—';
const esc = s => String(s == null ? '' : s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function renderTabs(){
  document.getElementById('tabs').innerHTML = TABS.map(([id,l]) =>
    `<button class="${id===tab?'on':''}" onclick="go('${id}')">${l}</button>`).join('');
}
function go(id){ tab = id; location.hash = id; renderTabs(); render(); }

async function logAdmin(acao, alvo_tipo, alvo_id, detalhes){
  await PX.sb.from('admin_logs').insert({ admin_id: PX.user.id, acao, alvo_tipo, alvo_id: alvo_id || null, detalhes: detalhes || {} });
}

/* ---------- Views ---------- */
async function viewGeral(){
  const cnt = async (t, f) => { let q = PX.sb.from(t).select('*', {count:'exact', head:true}); if(f) q = f(q); const {count} = await q; return count || 0; };
  const hoje = new Date(Date.now()-86400000).toISOString();
  const [alunos, ativos, subs, cursos, tickets, sessoes] = await Promise.all([
    cnt('profiles'), cnt('login_events', q=>q.gte('created_at', hoje)),
    cnt('subscriptions', q=>q.eq('status','ativa')), cnt('courses'),
    cnt('support_tickets', q=>q.eq('status','aberto')), cnt('study_sessions', q=>q.gte('created_at', hoje)),
  ]);
  const { data: comp } = await PX.sb.from('purchases').select('valor_cents').eq('status','pago');
  const receita = (comp||[]).reduce((a,p)=>a+(p.valor_cents||0),0);
  const { data: ia } = await PX.sb.from('ai_logs').select('custo_cents,tokens_entrada,tokens_saida');
  const custoIA = (ia||[]).reduce((a,l)=>a+(l.custo_cents||0),0);

  view.innerHTML = `
    <div class="kpis">
      <div class="kpi"><b>${alunos}</b><span>Alunos cadastrados</span></div>
      <div class="kpi"><b>${ativos}</b><span>Logins nas últimas 24h</span></div>
      <div class="kpi"><b>${subs}</b><span>Assinaturas ativas</span></div>
      <div class="kpi"><b>${money(receita)}</b><span>Receita confirmada</span></div>
      <div class="kpi"><b>${sessoes}</b><span>Sessões de estudo (24h)</span></div>
      <div class="kpi"><b>${cursos}</b><span>Cursos publicados</span></div>
      <div class="kpi"><b>${tickets}</b><span>Chamados abertos</span></div>
      <div class="kpi"><b>${money(custoIA)}</b><span>Custo de IA acumulado</span></div>
    </div>
    <div class="card"><h2>Últimos cadastros</h2><div id="recent" class="muted">Carregando…</div></div>`;
  const { data: recent } = await PX.sb.from('profiles').select('full_name,email,created_at').order('created_at',{ascending:false}).limit(8);
  document.getElementById('recent').innerHTML = tabela(['Nome','E-mail','Cadastro'],
    (recent||[]).map(p=>[esc(p.full_name||'—'), esc(p.email), dt(p.created_at)]));
}

function tabela(head, rows){
  if(!rows.length) return '<p class="muted">Nenhum registro.</p>';
  return `<table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

async function viewAlunos(){
  view.innerHTML = `<div class="card">
    <h2>Alunos</h2>
    <div class="row"><input id="busca" placeholder="Buscar por nome ou e-mail"><button class="act primary" onclick="viewAlunos()">Atualizar</button></div>
    <div id="lista" class="muted">Carregando…</div></div>`;
  const termo = '';
  const { data: ps } = await PX.sb.from('profiles').select('*').order('created_at',{ascending:false}).limit(200);
  const { data: rs } = await PX.sb.from('user_roles').select('user_id,role');
  const roleMap = {}; (rs||[]).forEach(r=>{ (roleMap[r.user_id]=roleMap[r.user_id]||[]).push(r.role); });
  const paint = (filtro) => {
    const list = (ps||[]).filter(p => !filtro ||
      (p.email||'').toLowerCase().includes(filtro) || (p.full_name||'').toLowerCase().includes(filtro));
    document.getElementById('lista').innerHTML = tabela(['Nome','E-mail','Papéis','Último acesso','Status','Ações'],
      list.map(p=>[
        esc(p.full_name||'—'), esc(p.email),
        (roleMap[p.id]||['student']).map(r=>`<span class="pill n">${r}</span>`).join(' '),
        dt(p.last_login_at),
        p.suspended?'<span class="pill off">Suspenso</span>':'<span class="pill ok">Ativo</span>',
        `<button class="act" onclick="toggleAdmin('${p.id}',${(roleMap[p.id]||[]).includes('admin')})">${(roleMap[p.id]||[]).includes('admin')?'Remover admin':'Tornar admin'}</button>
         <button class="act ${p.suspended?'':'danger'}" onclick="suspender('${p.id}',${!p.suspended})">${p.suspended?'Reativar':'Suspender'}</button>`
      ]));
  };
  paint('');
  document.getElementById('busca').oninput = e => paint(e.target.value.toLowerCase().trim());
}
async function toggleAdmin(id, isAdm){
  if(isAdm) await PX.sb.from('user_roles').delete().eq('user_id',id).eq('role','admin');
  else await PX.sb.from('user_roles').insert({user_id:id, role:'admin'});
  await logAdmin(isAdm?'remover_admin':'conceder_admin','profile',id);
  viewAlunos();
}
async function suspender(id, val){
  await PX.sb.from('profiles').update({suspended: val}).eq('id',id);
  await logAdmin(val?'suspender_aluno':'reativar_aluno','profile',id);
  viewAlunos();
}

async function viewCursos(){
  const { data: cs } = await PX.sb.from('courses').select('*').order('ordem');
  view.innerHTML = `<div class="card"><h2>Novo curso</h2>
      <div class="row">
        <div><label class="muted">Slug</label><input id="c-slug" placeholder="pf-2026"></div>
        <div><label class="muted">Nome</label><input id="c-nome" placeholder="Concurso PF"></div>
        <div><label class="muted">Preço (R$)</label><input id="c-preco" type="number" step="0.01" value="0"></div>
        <div><button class="act primary" onclick="criarCurso()">Criar curso</button></div>
      </div></div>
    <div class="card"><h2>Cursos</h2>${tabela(['Nome','Slug','Preço','Status','Ações'],
      (cs||[]).map(c=>[esc(c.nome), esc(c.slug), money(c.preco_cents),
        `<span class="pill ${c.status==='publicado'?'ok':'warn'}">${c.status}</span>`,
        `<button class="act" onclick="statusCurso('${c.id}','${c.status==='publicado'?'rascunho':'publicado'}')">${c.status==='publicado'?'Despublicar':'Publicar'}</button>`]))}</div>`;
}
async function criarCurso(){
  const slug = document.getElementById('c-slug').value.trim();
  const nome = document.getElementById('c-nome').value.trim();
  const preco = Math.round(parseFloat(document.getElementById('c-preco').value||'0')*100);
  if(!slug||!nome) return alert('Informe slug e nome.');
  const { error } = await PX.sb.from('courses').insert({slug,nome,preco_cents:preco,status:'rascunho'});
  if(error) return alert(error.message);
  await logAdmin('criar_curso','course',null,{slug});
  viewCursos();
}
async function statusCurso(id,status){
  await PX.sb.from('courses').update({status}).eq('id',id);
  await logAdmin('status_curso','course',id,{status});
  viewCursos();
}

async function viewConteudo(){
  const { data: cs } = await PX.sb.from('courses').select('id,nome,slug').order('ordem');
  const { data: ds } = await PX.sb.from('disciplines').select('id,nome,course_id,peso,incidencia').order('ordem');
  const { data: ts } = await PX.sb.from('topics').select('id,discipline_id');
  const { data: qs } = await PX.sb.from('questions').select('id,discipline_nome');
  const topCount = {}; (ts||[]).forEach(t=>topCount[t.discipline_id]=(topCount[t.discipline_id]||0)+1);
  const qCount = {}; (qs||[]).forEach(q=>qCount[q.discipline_nome]=(qCount[q.discipline_nome]||0)+1);
  const cname = {}; (cs||[]).forEach(c=>cname[c.id]=c.nome);
  view.innerHTML = `<div class="card"><h2>Disciplinas e tópicos</h2>${tabela(
    ['Curso','Disciplina','Tópicos','Peso','Incidência','Questões'],
    (ds||[]).map(d=>[esc(cname[d.course_id]||'—'), esc(d.nome), topCount[d.id]||0, d.peso, d.incidencia+'%', qCount[d.nome]||0]))}</div>`;
}

async function viewFinanceiro(){
  const { data: ps } = await PX.sb.from('purchases').select('*').order('created_at',{ascending:false}).limit(100);
  const { data: ss } = await PX.sb.from('subscriptions').select('*, plans(nome,preco_cents)').order('created_at',{ascending:false}).limit(100);
  const pago = (ps||[]).filter(p=>p.status==='pago').reduce((a,p)=>a+p.valor_cents,0);
  const mrr = (ss||[]).filter(s=>s.status==='ativa').reduce((a,s)=>a+((s.plans&&s.plans.preco_cents)||0),0);
  view.innerHTML = `
    <div class="kpis">
      <div class="kpi"><b>${money(pago)}</b><span>Total recebido</span></div>
      <div class="kpi"><b>${money(mrr)}</b><span>Receita recorrente</span></div>
      <div class="kpi"><b>${(ss||[]).filter(s=>s.status==='ativa').length}</b><span>Assinaturas ativas</span></div>
    </div>
    <div class="card"><h2>Compras</h2>${tabela(['Data','Valor','Status','Provedor','Cupom'],
      (ps||[]).map(p=>[dt(p.created_at), money(p.valor_cents),
        `<span class="pill ${p.status==='pago'?'ok':p.status==='reembolsado'?'off':'warn'}">${p.status}</span>`,
        esc(p.provider||'—'), esc(p.cupom||'—')]))}</div>
    <div class="card"><h2>Assinaturas</h2>${tabela(['Plano','Status','Renova em','Provedor'],
      (ss||[]).map(s=>[esc((s.plans&&s.plans.nome)||'—'),
        `<span class="pill ${s.status==='ativa'?'ok':'off'}">${s.status}</span>`,
        dt(s.current_period_end), esc(s.provider||'—')]))}</div>`;
}

async function viewPlanos(){
  const { data: pl } = await PX.sb.from('plans').select('*').order('ordem');
  const { data: cp } = await PX.sb.from('coupons').select('*').order('created_at',{ascending:false});
  view.innerHTML = `
    <div class="card"><h2>Planos</h2>${tabela(['Nome','Preço','Intervalo','Ativo','Ações'],
      (pl||[]).map(p=>[esc(p.nome), money(p.preco_cents), esc(p.intervalo),
        p.ativo?'<span class="pill ok">Sim</span>':'<span class="pill off">Não</span>',
        `<button class="act" onclick="togglePlano('${p.id}',${!p.ativo})">${p.ativo?'Desativar':'Ativar'}</button>`]))}</div>
    <div class="card"><h2>Novo cupom</h2>
      <div class="row">
        <div><label class="muted">Código</label><input id="cp-cod" placeholder="PRF20"></div>
        <div><label class="muted">Desconto (%)</label><input id="cp-pct" type="number" value="20"></div>
        <div><label class="muted">Usos máximos</label><input id="cp-max" type="number" placeholder="ilimitado"></div>
        <div><button class="act primary" onclick="criarCupom()">Criar cupom</button></div>
      </div>
      ${tabela(['Código','Desconto','Usos','Ativo'],
        (cp||[]).map(c=>[esc(c.codigo), (c.desconto_percent?c.desconto_percent+'%':money(c.desconto_cents)),
          (c.usos||0)+'/'+(c.usos_maximos||'∞'),
          c.ativo?'<span class="pill ok">Sim</span>':'<span class="pill off">Não</span>']))}</div>`;
}
async function togglePlano(id, ativo){ await PX.sb.from('plans').update({ativo}).eq('id',id); await logAdmin('plano','plan',id,{ativo}); viewPlanos(); }
async function criarCupom(){
  const codigo = document.getElementById('cp-cod').value.trim().toUpperCase();
  if(!codigo) return alert('Informe o código.');
  const pct = parseInt(document.getElementById('cp-pct').value||'0',10);
  const max = document.getElementById('cp-max').value;
  const { error } = await PX.sb.from('coupons').insert({codigo, desconto_percent:pct, usos_maximos:max?parseInt(max,10):null});
  if(error) return alert(error.message);
  await logAdmin('criar_cupom','coupon',null,{codigo});
  viewPlanos();
}

async function viewIA(){
  const { data: st } = await PX.sb.from('ai_settings').select('*').order('chave');
  const { data: lg } = await PX.sb.from('ai_logs').select('*').order('created_at',{ascending:false}).limit(50);
  const custo = (lg||[]).reduce((a,l)=>a+(l.custo_cents||0),0);
  view.innerHTML = `
    <div class="kpis">
      <div class="kpi"><b>${(lg||[]).length}</b><span>Chamadas recentes</span></div>
      <div class="kpi"><b>${money(custo)}</b><span>Custo (últimas 50)</span></div>
    </div>
    <div class="card"><h2>Prompts da Athena</h2>
      ${(st||[]).map(s=>`<div style="margin-bottom:14px">
        <label class="muted">${esc(s.chave)} · modelo ${esc(s.modelo)}</label>
        <textarea rows="4" id="ai-${s.id}">${esc(s.prompt)}</textarea>
        <button class="act primary" style="margin-top:6px" onclick="salvarPrompt('${s.id}')">Salvar</button>
      </div>`).join('') || '<p class="muted">Nenhum prompt configurado.</p>'}
    </div>
    <div class="card"><h2>Uso recente</h2>${tabela(['Data','Ferramenta','Modelo','Tópico','Custo'],
      (lg||[]).map(l=>[dt(l.created_at), esc(l.ferramenta), esc(l.modelo), esc(l.topic_nome||'—'), money(l.custo_cents)]))}</div>`;
}
async function salvarPrompt(id){
  const prompt = document.getElementById('ai-'+id).value;
  const { error } = await PX.sb.from('ai_settings').update({prompt}).eq('id',id);
  if(error) return alert(error.message);
  await logAdmin('editar_prompt','ai_settings',id);
  alert('Prompt atualizado.');
}

async function viewSuporte(){
  const { data: ts } = await PX.sb.from('support_tickets').select('*').order('created_at',{ascending:false}).limit(100);
  view.innerHTML = `<div class="card"><h2>Chamados</h2>${tabela(['Data','Tipo','Assunto','Prioridade','Status','Ações'],
    (ts||[]).map(t=>[dt(t.created_at), esc(t.tipo), esc(t.assunto),
      `<span class="pill n">${esc(t.prioridade)}</span>`,
      `<span class="pill ${t.status==='aberto'?'warn':t.status==='resolvido'?'ok':'n'}">${esc(t.status)}</span>`,
      `<button class="act" onclick="statusTicket('${t.id}','${t.status==='resolvido'?'aberto':'resolvido'}')">${t.status==='resolvido'?'Reabrir':'Resolver'}</button>`]))}</div>`;
}
async function statusTicket(id,status){ await PX.sb.from('support_tickets').update({status}).eq('id',id); await logAdmin('ticket','support_ticket',id,{status}); viewSuporte(); }

async function viewLogs(){
  const { data: al } = await PX.sb.from('admin_logs').select('*').order('created_at',{ascending:false}).limit(80);
  const { data: le } = await PX.sb.from('login_events').select('*').order('created_at',{ascending:false}).limit(40);
  view.innerHTML = `
    <div class="card"><h2>Ações administrativas</h2>${tabela(['Data','Ação','Alvo','Detalhes'],
      (al||[]).map(l=>[dt(l.created_at), esc(l.acao), esc(l.alvo_tipo||'—'), esc(JSON.stringify(l.detalhes||{}))]))}</div>
    <div class="card"><h2>Acessos</h2>${tabela(['Data','Dispositivo'],
      (le||[]).map(l=>[dt(l.created_at), esc((l.user_agent||'').slice(0,70))]))}</div>`;
}

async function viewConfig(){
  const { data: ps } = await PX.sb.from('platform_settings').select('*').order('chave');
  view.innerHTML = `<div class="card"><h2>Configurações da plataforma</h2>
    ${(ps||[]).map(s=>`<div class="row">
      <div><label class="muted">${esc(s.chave)}</label><input id="ps-${s.id}" value='${esc(JSON.stringify(s.valor))}'></div>
      <div><button class="act primary" onclick="salvarConfig('${s.id}')">Salvar</button></div>
    </div>`).join('') || '<p class="muted">Nenhuma configuração cadastrada.</p>'}</div>`;
}
async function salvarConfig(id){
  let valor;
  try { valor = JSON.parse(document.getElementById('ps-'+id).value); }
  catch(e){ return alert('Valor precisa ser um JSON válido.'); }
  const { error } = await PX.sb.from('platform_settings').update({valor}).eq('id',id);
  if(error) return alert(error.message);
  await logAdmin('config','platform_settings',id);
  alert('Configuração salva.');
}

/* ---------- Base de conhecimento da Athena ---------- */
let KB_DOCS = [];
let kbDisc = null, kbTopic = null;
const kbKey = (d,t) => d + '||' + (t || '');
let KB_DISCS_DB = [];
function kbGlobalTopics(){
  if (window.TOPICS) return window.TOPICS;
  try { return (typeof TOPICS !== 'undefined') ? TOPICS : {}; } catch(e){ return {}; }
}
function kbGlobalDiscs(){
  if (window.DISCIPLINAS_POR_CONCURSO) return window.DISCIPLINAS_POR_CONCURSO;
  try { return (typeof DISCIPLINAS_POR_CONCURSO !== 'undefined') ? DISCIPLINAS_POR_CONCURSO : {}; } catch(e){ return {}; }
}
function kbValidDisc(value){
  return PXKB.validarDisciplina(value, kbDiscList());
}
/* Trava única durante geração/prévia/publicação: impede troca de matéria e edição de campos. */
let KB_BUSY = false;
function kbSetBusy(on, msg){
  KB_BUSY = !!on;
  const grid = document.getElementById('kb-grid');
  if(grid){
    grid.querySelectorAll('button,input,select,textarea').forEach(function(el){
      if(el.id === 'kb-busy-nada') return;
      el.disabled = KB_BUSY;
    });
  }
  const bar = document.getElementById('kb-busy');
  if(bar){
    bar.style.display = KB_BUSY ? 'flex' : 'none';
    bar.querySelector('span[data-msg]').textContent = msg || 'Processando…';
  }
  if(msg) kbIngMsg(msg);
  if(!KB_BUSY){
    try{ kbRenderLog(); }catch(e){}
    try{ kbMontarEstado(); }catch(e){}
  }
}
const kbDiscList = () => {
  const list = (kbGlobalDiscs()['prf-2021'] || Object.keys(kbGlobalTopics()) || []).filter(Boolean);
  if (list.length) return list;
  return KB_DISCS_DB.slice();
};

async function loadKB(){
  const { data, error } = await PX.sb.from('knowledge_docs').select('*').eq('course_slug','prf-2021').order('disciplina');
  if(error) throw error;
  KB_DOCS = data || [];
  // Rede de segurança: se os dados locais não carregarem, monta a lista de matérias pelo banco.
  const nomes = {};
  KB_DOCS.forEach(x => { if(x.disciplina) nomes[x.disciplina] = 1; });
  try{
    const curso = await PX.sb.from('courses').select('id').eq('slug','prf-2021').maybeSingle();
    if(curso.data){
      const d = await PX.sb.from('disciplines').select('nome').eq('course_id', curso.data.id).order('ordem');
      (d.data || []).forEach(x => { if(x.nome) nomes[x.nome] = 1; });
    }
  }catch(e){ /* mantém apenas as matérias já presentes na base */ }
  KB_DISCS_DB = Object.keys(nomes);
}

function kbIngMsg(t){ const el = document.getElementById('kb-ing'); if(el) el.textContent = t; }

async function kbToken(){ const { data } = await PX.sb.auth.getSession(); return data.session ? data.session.access_token : ''; }
async function kbPost(path, payload){
  const r = await fetch(path, { method:'POST', headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + (await kbToken()) }, body: JSON.stringify(payload) });
  const j = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error || 'Falha na requisição.');
  return j;
}
function kbApplyText(texto, origem){
  const ta = document.getElementById('kb-txt');
  if(!ta) return;
  const modo = (document.querySelector('input[name="kb-mode"]:checked')||{}).value || 'append';
  const bloco = (origem ? `\n\n## Fonte: ${origem}\n` : '\n\n') + texto;
  ta.value = modo === 'replace' ? texto : (ta.value.trim() ? ta.value + bloco : texto);
}
function kbEhTextoSimples(f){
  return /^text\//i.test(f.type || '') || /\.(txt|md|markdown|csv|json|srt|vtt|log|tsv)$/i.test(f.name || '');
}
function kbEhImagem(f){
  return /^image\//i.test(f.type || '') || /\.(png|jpe?g|webp|gif|bmp|heic|heif|tiff?)$/i.test(f.name || '');
}
function kbEhVideoUrl(u){
  return /(youtube\.com|youtu\.be|vimeo\.com|dailymotion\.com)/i.test(u || '');
}

/* ---- Fontes carregadas + progresso do carregamento ---- */
let KB_FONTES = [];
let KB_ING_ATIVO = false;
function kbIngProg(feito, total, texto){
  const wrap = document.getElementById('kb-ing-prog-wrap');
  const bar = document.getElementById('kb-ing-prog-bar');
  const txt = document.getElementById('kb-ing-prog-txt');
  if(!wrap) return;
  if(total <= 0){ wrap.style.display = 'none'; return; }
  const pct = Math.max(0, Math.min(100, Math.round((feito / total) * 100)));
  wrap.style.display = 'block';
  if(bar) bar.style.width = pct + '%';
  if(txt) txt.textContent = (texto || 'Carregando') + ' — ' + pct + '%';
}
function kbIngProgHide(){ const w = document.getElementById('kb-ing-prog-wrap'); if(w) w.style.display = 'none'; }
function kbPaintFontes(){
  const box = document.getElementById('kb-fontes');
  if(!box) return;
  if(!KB_FONTES.length){ box.innerHTML = ''; return; }
  const total = KB_FONTES.reduce(function(a,f){ return a + f.chars; }, 0);
  box.innerHTML = '<div style="border:1px solid #E2E8F0;border-radius:10px;overflow:hidden;font-size:0.78rem">' +
    '<div style="padding:7px 10px;background:#F8FAFC;border-bottom:1px solid #E2E8F0"><b>' + KB_FONTES.length + ' fonte(s) carregada(s)</b> <span class="muted">· ' + total.toLocaleString('pt-BR') + ' caracteres</span></div>' +
    KB_FONTES.map(function(f,i){
      return '<div style="padding:6px 10px;display:flex;gap:8px;align-items:center;border-bottom:1px solid #F1F5F9">' +
        '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(f.nome) + '</span>' +
        '<span class="muted">' + f.chars.toLocaleString('pt-BR') + ' car.</span>' +
        '<button class="act" onclick="kbFonteRemover(' + i + ')">Remover</button>' +
      '</div>';
    }).join('') + '</div>';
}
window.kbFonteRemover = function(i){
  const f = KB_FONTES[i];
  if(!f) return;
  KB_FONTES.splice(i,1);
  const ta = document.getElementById('kb-txt');
  if(ta && f.bloco) ta.value = ta.value.split(f.bloco).join('').replace(/\n{4,}/g,'\n\n');
  kbPaintFontes();
  kbMontarEstado();
  kbIngMsg('Fonte "' + f.nome + '" removida do material.');
};
function kbRegistrarFonte(nome, texto){
  const ta = document.getElementById('kb-txt');
  const antes = ta ? ta.value : '';
  kbApplyText(texto, nome);
  const depois = ta ? ta.value : '';
  const bloco = depois.startsWith(antes) ? depois.slice(antes.length) : '';
  KB_FONTES.push({ nome: nome, chars: texto.length, bloco: bloco });
  kbPaintFontes();
}
function kbMontarEstado(){
  const btn = document.getElementById('kb-btn-montar');
  if(!btn) return;
  const ta = document.getElementById('kb-txt');
  const pronto = !KB_ING_ATIVO && !!ta && ta.value.trim().length >= 200 && !!kbValidDisc(kbDisc);
  btn.disabled = !pronto;
  btn.textContent = KB_ING_ATIVO ? 'Aguardando leitura do material…' : 'Montar curso desta matéria';
}
function kbBindIngest(){
  const inp = document.getElementById('kb-file');
  if(inp && !inp.dataset.bound){
    inp.dataset.bound = '1';
    inp.addEventListener('change', function(){ kbIngestFiles(Array.from(inp.files || [])); });
  }
  const drop = document.getElementById('kb-drop');
  if(drop && !drop.dataset.bound){
    drop.dataset.bound = '1';
    ['dragenter','dragover'].forEach(function(ev){
      drop.addEventListener(ev, function(e){ e.preventDefault(); drop.style.borderColor = '#2563EB'; drop.style.background = '#EFF6FF'; });
    });
    ['dragleave','drop'].forEach(function(ev){
      drop.addEventListener(ev, function(e){ e.preventDefault(); drop.style.borderColor = '#CBD5E1'; drop.style.background = '#F8FAFC'; });
    });
    drop.addEventListener('drop', function(e){
      const fs = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
      if(fs.length) kbIngestFiles(fs);
    });
  }
  const url = document.getElementById('kb-url');
  if(url && !url.dataset.bound){
    url.dataset.bound = '1';
    const go = function(){ const v = url.value.trim(); if(v && v !== url.dataset.ultimo){ url.dataset.ultimo = v; kbIngestUrlAuto(v); } };
    url.addEventListener('blur', go);
    url.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); go(); } });
  }
  const ta = document.getElementById('kb-txt');
  if(ta && !ta.dataset.boundMontar){ ta.dataset.boundMontar = '1'; ta.addEventListener('input', kbMontarEstado); }
  kbMontarEstado();
}

/* Lê os arquivos assim que são escolhidos/soltos — sem etapa manual de extração. */
window.kbIngestFiles = async function(files){
  if(!files || !files.length) return;
  if(!kbValidDisc(kbDisc)) return kbIngMsg('Selecione uma matéria válida antes de carregar material.');
  KB_ING_ATIVO = true;
  kbSetBusy(true, 'Lendo ' + files.length + ' arquivo(s)…');
  kbMontarEstado();
  let n = 0, i = 0;
  for(const f of files){
    try{
      kbIngProg(i, files.length, 'Lendo ' + f.name + ' (' + (i+1) + '/' + files.length + ')');
      kbSetBusy(true, 'Lendo ' + f.name + ' (' + (i+1) + '/' + files.length + ')…');
      let texto = '', origem = f.name;
      if(kbEhTextoSimples(f)){
        texto = (await f.text()).trim();
      }else{
        const b64 = await new Promise((res,rej)=>{ const r = new FileReader(); r.onload=()=>res(String(r.result)); r.onerror=rej; r.readAsDataURL(f); });
        const tipo = kbEhImagem(f) ? 'imagem' : 'auto';
        const j = await kbPost('/api/public/kb-ingest', { tipo, nome:f.name, mime:f.type || '', arquivo_base64:b64 });
        texto = j.texto; origem = j.origem || f.name;
      }
      if(texto){ kbRegistrarFonte(origem, texto); n++; }
    }catch(e){

};

/* ---- Montagem do curso em lotes, cobrindo todos os tópicos ---- */
function kbLotes(arr, tam){
  const out = [];
  for(let i = 0; i < arr.length; i += tam) out.push(arr.slice(i, i + tam));
  return out;
}
async function kbGerarLotes(disciplina, topicos, prefs, material){
  const lotes = kbLotes(topicos, 6);
  let feitos = 0;
  for(const lote of lotes){
    kbIngProg(feitos, topicos.length, 'Gerando aulas (' + Math.min(feitos + lote.length, topicos.length) + ' de ' + topicos.length + ')');
    kbSetBusy(true, 'Montando aulas de ' + disciplina + ' — ' + (feitos + 1) + ' a ' + Math.min(feitos + lote.length, topicos.length) + ' de ' + topicos.length + '…');
    try{
      const j = await kbPost('/api/public/kb-autocourse', {
        disciplina, topicos: lote, material: material.slice(0, 300000),
        modelo: prefs.modelo, banca: prefs.banca, cargo: prefs.cargo,
        profundidade: prefs.prof, modo_aprovacao: prefs.aprov
      });
      (j.aulas || []).forEach(function(a){
        if(!a || !a.topico) return;
        if(KB_GERADAS.some(function(x){ return x.topico === a.topico; })) return;
        KB_GERADAS.push({ disciplina: disciplina, topico: a.topico, titulo: a.titulo || a.topico,
          incidencia: a.incidencia || 'media', conteudo: String(a.conteudo || ''), incluir: true });
      });
    }catch(e){
      kbIngMsg('Falha em um lote (' + e.message + '). Continuando com os demais…');
    }
    feitos += lote.length;
    kbIngProg(feitos, topicos.length, 'Gerando aulas');
    kbPaintPreview();
  }
}
window.kbMontarCurso = async function(){
  const disciplinaSelecionada = kbValidDisc(kbDisc);
  if(!disciplinaSelecionada) return kbIngMsg('Selecione uma matéria válida antes de montar o curso.');
  if(KB_ING_ATIVO) return kbIngMsg('Aguarde a leitura do material terminar.');
  const material = document.getElementById('kb-txt').value.trim();
  if(material.length < 200) return kbIngMsg('Carregue primeiro o material (arquivo, link ou texto).');
  const topicos = kbTopicList(disciplinaSelecionada);
  if(!topicos.length) return kbIngMsg('Esta matéria não tem tópicos cadastrados.');
  const val = id => (document.getElementById(id)||{}).value;
  const prefs = { modelo: val('kb-modelo'), banca: val('kb-banca'), cargo: val('kb-cargo'), prof: val('kb-prof') || 'completo',
    aprov: (document.getElementById('kb-aprov')||{}).checked !== false };
  kbPrefsSave();
  KB_GERADAS = []; KB_ABERTA = -1;
  document.getElementById('kb-preview').innerHTML = '';
  kbSetBusy(true, 'A IA está montando o curso completo de ' + disciplinaSelecionada + '… pode levar alguns minutos, não feche a página.');
  try{
    await kbGerarLotes(disciplinaSelecionada, topicos, prefs, material);
    // Segunda passada: regera apenas os tópicos que ficaram sem aula.
    for(let tentativa = 0; tentativa < 2; tentativa++){
      const faltando = topicos.filter(function(t){ return !KB_GERADAS.some(function(a){ return a.topico === t; }); });
      if(!faltando.length) break;
      kbSetBusy(true, 'Completando ' + faltando.length + ' tópico(s) que faltaram…');
      await kbGerarLotes(disciplinaSelecionada, faltando, prefs, material);
    }
  }catch(e){ kbIngMsg('Erro: ' + e.message); }
  kbSetBusy(false);
  kbIngProgHide();
  kbMontarEstado();
  const cobertos = topicos.filter(function(t){ return KB_GERADAS.some(function(a){ return a.topico === t; }); }).length;
  kbIngMsg('Curso montado: ' + cobertos + ' de ' + topicos.length + ' tópico(s) com aula. Revise abaixo antes de publicar.');
  kbPaintPreview();
};

/* Manutenção: reindexar a base e tratar conteúdos órfãos (matéria vazia ou fora do edital). */
let KB_LOG = [];
function kbRenderLog(){
  const pre = document.getElementById('kb-log');
  if(!pre) return;
  pre.style.display = KB_LOG.length ? 'block' : 'none';
  pre.textContent = KB_LOG.join('\n');
  pre.scrollTop = pre.scrollHeight;
}
function kbLogReset(titulo){ KB_LOG = titulo ? ['— ' + titulo + ' —'] : []; kbRenderLog(); }
function kbLog(linha){ KB_LOG.push(linha); kbRenderLog(); }
function kbProg(feito, total, texto){
  const wrap = document.getElementById('kb-prog-wrap');
  const bar = document.getElementById('kb-prog-bar');
  const txt = document.getElementById('kb-prog-txt');
  if(!wrap) return;
  if(total <= 0){ wrap.style.display = 'none'; return; }
  const pct = Math.round((feito / total) * 100);
  wrap.style.display = 'block';
  if(bar) bar.style.width = pct + '%';
  if(txt) txt.textContent = (texto || 'Processando') + ' — ' + feito + '/' + total + ' (' + pct + '%)';
}
function kbProgHide(){ const w = document.getElementById('kb-prog-wrap'); if(w) w.style.display = 'none'; }
function kbOrfMsg(t){ const el = document.getElementById('kb-orf'); if(el) el.textContent = t; }
function kbPorDisciplina(docs){
  const m = {};
  (docs || []).forEach(function(d){ const k = (d.disciplina || '').trim() || '(sem matéria)'; m[k] = (m[k] || 0) + 1; });
  return Object.keys(m).sort().map(function(k){ return k + ': ' + m[k]; });
}
async function kbFetchDocs(){
  const { data, error } = await PX.sb.from('knowledge_docs').select('*').eq('course_slug','prf-2021').order('disciplina');
  if(error) throw error;
  return data || [];
}

window.kbReindexar = async function(dryRun){
  const antes = KB_DOCS.slice();
  const lista = kbDiscList();
  kbLogReset(dryRun ? 'Prévia da reindexação (nada foi alterado)' : 'Reindexação da base');
  kbOrfMsg(dryRun ? 'Simulando…' : 'Reindexando…');
  kbProg(0, 1, 'Lendo banco');
  let docs;
  try{ docs = await kbFetchDocs(); }
  catch(e){ kbProgHide(); kbOrfMsg('Erro: ' + e.message); return; }
  kbLog(docs.length + ' documento(s) lidos do banco.');

  const antesMap = {}; antes.forEach(function(d){ antesMap[d.id] = d; });
  const virarOrfao = [], recuperar = [], novos = [], removidos = [];
  const orfaosAgora = [];
  docs.forEach(function(d, i){
    const eraOrfao = antesMap[d.id] ? !PXKB.validarDisciplina(antesMap[d.id].disciplina, lista) : null;
    const ehOrfao = !PXKB.validarDisciplina(d.disciplina, lista);
    if(ehOrfao) orfaosAgora.push(d);
    if(eraOrfao === null) novos.push(d);
    else if(!eraOrfao && ehOrfao) virarOrfao.push(d);
    else if(eraOrfao && !ehOrfao) recuperar.push(d);
    if(i % 25 === 0 || i === docs.length - 1) kbProg(i + 1, docs.length, 'Analisando documentos');
  });
  const idsNovos = {}; docs.forEach(function(d){ idsNovos[d.id] = 1; });
  antes.forEach(function(d){ if(!idsNovos[d.id]) removidos.push(d); });

  kbProg(docs.length, docs.length, 'Análise concluída');
  kbLog('Resultado por disciplina:');
  kbPorDisciplina(docs).forEach(function(l){ kbLog('  • ' + l); });
  kbLog('Órfãos após reindexar: ' + orfaosAgora.length);
  kbLog('Vão virar órfãos: ' + virarOrfao.length + (virarOrfao.length ? ' → ' + virarOrfao.slice(0,10).map(function(d){ return (d.titulo || d.topico || d.id) + ' [' + (d.disciplina||'sem matéria') + ']'; }).join('; ') : ''));
  kbLog('Vão recuperar disciplina válida: ' + recuperar.length + (recuperar.length ? ' → ' + recuperar.slice(0,10).map(function(d){ return (d.titulo || d.topico || d.id) + ' [' + d.disciplina + ']'; }).join('; ') : ''));
  if(novos.length) kbLog('Novos desde a última leitura: ' + novos.length);
  if(removidos.length) kbLog('Sumiram do banco: ' + removidos.length);

  if(dryRun){
    kbLog('Prévia — nenhuma alteração aplicada. Use "Reindexar base" para confirmar.');
    kbOrfMsg('Prévia: ' + docs.length + ' documento(s), ' + orfaosAgora.length + ' órfão(s), ' + virarOrfao.length + ' novo(s) órfão(s), ' + recuperar.length + ' recuperado(s).');
    return;
  }
  await loadKB(); kbPaint();
  kbLog('Base reindexada com sucesso.');
  kbProgHide();
  kbOrfMsg('Base reindexada: ' + KB_DOCS.length + ' conteúdo(s), ' + PXKB.encontrarOrfaos(KB_DOCS, kbDiscList()).length + ' órfão(s).');
};

window.kbCorrigirOrfaos = async function(acao){
  const orfaos = PXKB.encontrarOrfaos(KB_DOCS, kbDiscList());
  if(!orfaos.length) return;
  const destino = kbValidDisc(kbDisc);
  if(acao === 'mover' && !destino) return alert('Selecione uma matéria válida para receber os conteúdos órfãos.');
  const txt = acao === 'mover'
    ? 'Mover ' + orfaos.length + ' conteúdo(s) órfão(s) para "' + destino + '"?'
    : 'Excluir definitivamente ' + orfaos.length + ' conteúdo(s) órfão(s)?';
  if(!confirm(txt)) return;
  kbLogReset(acao === 'mover' ? 'Movendo órfãos para ' + destino : 'Excluindo órfãos');
  kbOrfMsg('Processando…');
  let feito = 0;
  const porOrigem = {};
  for(const d of orfaos){
    const { error } = acao === 'mover'
      ? await PX.sb.from('knowledge_docs').update({ disciplina:destino, updated_by:PX.user.id }).eq('id', d.id)
      : await PX.sb.from('knowledge_docs').delete().eq('id', d.id);
    feito++;
    const origem = (d.disciplina || '').trim() || '(sem matéria)';
    if(error){
      kbLog('✗ ' + (d.titulo || d.topico || d.id) + ' — erro: ' + error.message);
      kbProgHide();
      kbOrfMsg('Erro: ' + error.message);
      return;
    }
    porOrigem[origem] = (porOrigem[origem] || 0) + 1;
    kbLog('✓ ' + (d.titulo || d.topico || d.id) + ' [' + origem + ']' + (acao === 'mover' ? ' → ' + destino : ' excluído'));
    kbProg(feito, orfaos.length, acao === 'mover' ? 'Movendo' : 'Excluindo');
  }
  kbLog('Resultado por disciplina de origem:');
  Object.keys(porOrigem).sort().forEach(function(k){ kbLog('  • ' + k + ': ' + porOrigem[k]); });
  await logAdmin(acao === 'mover' ? 'reindexar_conhecimento' : 'limpar_orfaos_conhecimento','knowledge_docs', null, { total:orfaos.length, destino:destino||null });
  await loadKB(); kbPaint();
  kbProgHide();
  kbLog('Concluído: ' + orfaos.length + ' documento(s) processados.');
  kbOrfMsg(orfaos.length + ' conteúdo(s) órfão(s) ' + (acao === 'mover' ? 'movidos para ' + destino + '.' : 'excluídos.'));
};

      <label class="muted">Senha</label>
      <input id="a-pass" type="password" placeholder="mínimo 6 caracteres" style="margin:4px 0 14px">
      <div style="display:flex;gap:8px">
        <button class="act primary" id="a-in" style="flex:1">Entrar</button>
        <button class="act" id="a-up" style="flex:1">Criar admin</button>
      </div>
      <p class="muted" id="a-msg" style="margin-top:10px"></p>
    </div>`;
  const m = document.getElementById('a-msg');
  const creds = () => [document.getElementById('a-email').value.trim(), document.getElementById('a-pass').value];
  document.getElementById('a-in').onclick = async () => {
    const [e,p] = creds(); m.textContent = 'Entrando…';
    const { error } = await PX.signIn(e, p);
    if (error) { m.textContent = error.message; return; }
    boot();
  };
  document.getElementById('a-up').onclick = async () => {
    const [e,p] = creds(); m.textContent = 'Criando conta…';
    const { error } = await PX.signUp(e, p, 'Administrador');
    if (error) { m.textContent = error.message; return; }
    const r = await PX.signIn(e, p);
    if (r.error) { m.textContent = r.error.message; return; }
    boot();
  };
}

async function boot(){
  try { await PX.ready; } catch(e){}
  if (PX.bootError) {
    renderTabs();
    return gateForm('Não foi possível conectar ao servidor. Recarregue a página.');
  }
  if (!PX.user) { renderTabs(); return gateForm(); }
  if (!PX.isAdmin()) {
    try {
      const { data } = await PX.sb.rpc('claim_admin');
      if (data === true) { PX.roles.push('admin'); }
    } catch (e) {}
  }
  if (!PX.isAdmin()) {
    renderTabs();
    gateForm('Esta conta (' + PX.user.email + ') está autenticada, mas ainda não possui o papel de administrador. Se a permissão acabou de ser concedida, clique em "Tentar novamente".');
    const box = document.querySelector('#view .card');
    if (box) {
      const p = document.createElement('p');
      p.style.marginTop = '10px';
      p.innerHTML = '<button class="act primary" id="a-retry" style="width:100%;margin-bottom:8px">Tentar novamente</button>'
                  + '<button class="act danger" id="a-out" style="width:100%">Sair desta conta</button>';
      box.appendChild(p);
      document.getElementById('a-retry').onclick = async () => {
        const btn = document.getElementById('a-retry');
        btn.textContent = 'Verificando…';
        try {
          const { data } = await PX.sb.from('user_roles').select('role').eq('user_id', PX.user.id);
          PX.roles = (data || []).map(r => r.role);
        } catch (e) {}
        if (PX.isAdmin()) { boot(); }
        else { btn.textContent = 'Tentar novamente'; document.getElementById('a-msg').textContent = 'Ainda sem permissão de administrador nesta conta.'; }
      };
      document.getElementById('a-out').onclick = async () => {
        await PX.sb.auth.signOut();
        location.href = 'home.html';
      };
    }
    return;
  }

  document.getElementById('who').textContent = PX.displayName();
  renderTabs();
  render();
}
boot();


</script>
</body>
</html>
