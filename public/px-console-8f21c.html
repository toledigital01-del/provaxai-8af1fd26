function kbIngProg(feito, total, texto){
  const wrap = document.getElementById('kb-ing-prog-wrap');
  const bar = document.getElementById('kb-ing-prog-bar');
  const txt = document.getElementById('kb-ing-prog-txt');
  if(!wrap) return;
  if(total <= 0){ wrap.style.display = 'none'; return; }
  const pct = Math.max(0, Math.min(100, Math.round((feito / total) * 100)));
  wrap.style.display = 'block';
  if(bar) bar.style.width = pct + '%';
  if(txt) txt.textContent = (texto || 'Carregando') + ' — ' + pct + '%';
}

  const pdf = document.getElementById('kb-exp-pdf');
  if(csv) csv.disabled = !KB_LOG.length || KB_BUSY;
  if(pdf) pdf.disabled = !KB_LOG.length || KB_BUSY;

  pre.textContent = KB_LOG.join('\n');
  pre.scrollTop = pre.scrollHeight;
}
function kbLogReset(titulo, acao, modo){
  KB_LOG = titulo ? ['— ' + titulo + ' —'] : [];
  KB_LOG_ROWS = [];
  KB_LOG_META = { titulo: titulo || '', acao: acao || '', modo: modo || '', quando: new Date(), resumo: {} };

}
function kbLog(linha){ KB_LOG.push(linha); kbRenderLog(); }
/* Registro estruturado para auditoria (CSV/PDF). */
function kbLogRow(r){
  KB_LOG_ROWS.push({
    quando: new Date().toISOString(),
    acao: KB_LOG_META.acao || '',
    modo: KB_LOG_META.modo || '',

    disciplina_destino: r.destino || '',

    detalhe: r.detalhe || '',
  });
}
function kbLogResumo(obj){ KB_LOG_META.resumo = Object.assign({}, KB_LOG_META.resumo, obj); }
function kbCarimbo(d){
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}
function kbBaixar(nome, conteudo, mime){
  const blob = new Blob([conteudo], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nome;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

    'th{background:#F1F5F9}pre{white-space:pre-wrap;background:#F8FAFC;border:1px solid #E2E8F0;padding:8px;border-radius:6px}' +
    '@page{size:A4;margin:14mm}</style></head><body>' +
    '<h1>Prova X — auditoria da base de conhecimento</h1>' +
    '<p>Operação: <b>' + esc(KB_LOG_META.titulo || '—') + '</b><br>' +
    'Curso: prf-2021 · Matéria selecionada: ' + esc(kbDisc || '—') + '<br>' +
    'Administrador: ' + esc((PX.user && PX.user.email) || PX.user?.id || '—') + '<br>' +
    'Data: ' + d.toLocaleString('pt-BR') + '</p>' +
    '<h2>Resumo</h2><table><tbody>' +

    '</tbody></table>' +
    '<h2>Documentos processados (' + KB_LOG_ROWS.length + ')</h2>' +
    (KB_LOG_ROWS.length ? '<table><thead><tr>' + cols.map(function(c){ return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      KB_LOG_ROWS.map(function(r){ return '<tr>' + cols.map(function(c){ return '<td>' + esc(String(r[c] == null ? '' : r[c])) + '</td>'; }).join('') + '</tr>'; }).join('') +
      '</tbody></table>' : '<p>Nenhum documento individual registrado nesta operação.</p>') +

function kbProg(feito, total, texto){
  const wrap = document.getElementById('kb-prog-wrap');
  const bar = document.getElementById('kb-prog-bar');
  const txt = document.getElementById('kb-prog-txt');
  if(!wrap) return;
  if(total <= 0){ wrap.style.display = 'none'; return; }
  const pct = Math.round((feito / total) * 100);
  wrap.style.display = 'block';
  if(bar) bar.style.width = pct + '%';
  if(txt) txt.textContent = (texto || 'Processando') + ' — ' + feito + '/' + total + ' (' + pct + '%)';
}
function kbProgHide(){ const w = document.getElementById('kb-prog-wrap'); if(w) w.style.display = 'none'; }
function kbOrfMsg(t){ const el = document.getElementById('kb-orf'); if(el) el.textContent = t; }
function kbPorDisciplina(docs){
  const m = {};
  (docs || []).forEach(function(d){ const k = (d.disciplina || '').trim() || '(sem matéria)'; m[k] = (m[k] || 0) + 1; });
  return Object.keys(m).sort().map(function(k){ return k + ': ' + m[k]; });
}
async function kbFetchDocs(){
  const { data, error } = await PX.sb.from('knowledge_docs').select('*').eq('course_slug','prf-2021').order('disciplina');
  if(error) throw error;
  return data || [];
}

window.kbReindexar = async function(dryRun){
  const antes = KB_DOCS.slice();
  const lista = kbDiscList();
  kbLogReset(dryRun ? 'Prévia da reindexação (nada foi alterado)' : 'Reindexação da base', 'reindexar', dryRun ? 'previa' : 'real');
  kbOrfMsg(dryRun ? 'Simulando…' : 'Reindexando…');
  kbProg(0, 1, 'Lendo banco');
  let docs;
  try{ docs = await kbFetchDocs(); }
  catch(e){ kbProgHide(); kbOrfMsg('Erro: ' + e.message); return; }
  kbLog(docs.length + ' documento(s) lidos do banco.');

  const antesMap = {}; antes.forEach(function(d){ antesMap[d.id] = d; });
  const virarOrfao = [], recuperar = [], novos = [], removidos = [];
  const orfaosAgora = [];
  docs.forEach(function(d, i){
    const eraOrfao = antesMap[d.id] ? !PXKB.validarDisciplina(antesMap[d.id].disciplina, lista) : null;
    const ehOrfao = !PXKB.validarDisciplina(d.disciplina, lista);
    if(ehOrfao) orfaosAgora.push(d);
    let resultado = 'inalterado';
    if(eraOrfao === null){ novos.push(d); resultado = 'novo'; }
    else if(!eraOrfao && ehOrfao){ virarOrfao.push(d); resultado = 'virou órfão'; }
    else if(eraOrfao && !ehOrfao){ recuperar.push(d); resultado = 'recuperou disciplina'; }
    else if(ehOrfao) resultado = 'segue órfão';
    kbLogRow({ id:d.id, titulo:d.titulo || d.topico || '', origem:(d.disciplina || '').trim() || '(sem matéria)',
      destino:'', resultado:resultado, detalhe: dryRun ? 'prévia — nada aplicado' : '' });
    if(i % 25 === 0 || i === docs.length - 1) kbProg(i + 1, docs.length, 'Analisando documentos');
  });
  const idsNovos = {}; docs.forEach(function(d){ idsNovos[d.id] = 1; });
  antes.forEach(function(d){ if(!idsNovos[d.id]) removidos.push(d); });

  kbProg(docs.length, docs.length, 'Análise concluída');
  kbLog('Resultado por disciplina:');
  kbPorDisciplina(docs).forEach(function(l){ kbLog('  • ' + l); });
  kbLog('Órfãos após reindexar: ' + orfaosAgora.length);
  kbLog('Vão virar órfãos: ' + virarOrfao.length + (virarOrfao.length ? ' → ' + virarOrfao.slice(0,10).map(function(d){ return (d.titulo || d.topico || d.id) + ' [' + (d.disciplina||'sem matéria') + ']'; }).join('; ') : ''));
  kbLog('Vão recuperar disciplina válida: ' + recuperar.length + (recuperar.length ? ' → ' + recuperar.slice(0,10).map(function(d){ return (d.titulo || d.topico || d.id) + ' [' + d.disciplina + ']'; }).join('; ') : ''));
  if(novos.length) kbLog('Novos desde a última leitura: ' + novos.length);
  if(removidos.length) kbLog('Sumiram do banco: ' + removidos.length);
  kbLogResumo({
    'Documentos lidos': docs.length,
    'Órfãos após a análise': orfaosAgora.length,
    'Viram órfãos': virarOrfao.length,
    'Recuperam disciplina': recuperar.length,
    'Novos desde a última leitura': novos.length,
    'Sumiram do banco': removidos.length,
    'Por disciplina': kbPorDisciplina(docs).join(' | '),
  });



  if(dryRun){
    kbLog('Prévia — nenhuma alteração aplicada. Use "Reindexar base" para confirmar.');
    kbOrfMsg('Prévia: ' + docs.length + ' documento(s), ' + orfaosAgora.length + ' órfão(s), ' + virarOrfao.length + ' novo(s) órfão(s), ' + recuperar.length + ' recuperado(s).');
    return;
  }
  await loadKB(); kbPaint();
  kbLog('Base reindexada com sucesso.');
  kbProgHide();
  kbOrfMsg('Base reindexada: ' + KB_DOCS.length + ' conteúdo(s), ' + PXKB.encontrarOrfaos(KB_DOCS, kbDiscList()).length + ' órfão(s).');
};

window.kbCorrigirOrfaos = async function(acao){
  const orfaos = PXKB.encontrarOrfaos(KB_DOCS, kbDiscList());
  if(!orfaos.length) return;
  const destino = kbValidDisc(kbDisc);
  if(acao === 'mover' && !destino) return alert('Selecione uma matéria válida para receber os conteúdos órfãos.');
  const txt = acao === 'mover'
    ? 'Mover ' + orfaos.length + ' conteúdo(s) órfão(s) para "' + destino + '"?'
    : 'Excluir definitivamente ' + orfaos.length + ' conteúdo(s) órfão(s)?';
  if(!confirm(txt)) return;
  kbLogReset(acao === 'mover' ? 'Movendo órfãos para ' + destino : 'Excluindo órfãos', acao === 'mover' ? 'mover_orfaos' : 'excluir_orfaos', 'real');
  kbOrfMsg('Processando…');
  let feito = 0;
  const porOrigem = {};
  for(const d of orfaos){
    const { error } = acao === 'mover'
      ? await PX.sb.from('knowledge_docs').update({ disciplina:destino, updated_by:PX.user.id }).eq('id', d.id)
      : await PX.sb.from('knowledge_docs').delete().eq('id', d.id);
    feito++;
    const origem = (d.disciplina || '').trim() || '(sem matéria)';
    if(error){
      kbLog('✗ ' + (d.titulo || d.topico || d.id) + ' — erro: ' + error.message);
      kbLogRow({ id:d.id, titulo:d.titulo || d.topico || '', origem:origem, destino: acao === 'mover' ? destino : '', resultado:'erro', detalhe:error.message });
      kbLogResumo({ 'Processados antes do erro': feito - 1, 'Erro': error.message });
      kbProgHide();
      kbOrfMsg('Erro: ' + error.message);
      return;
    }
    porOrigem[origem] = (porOrigem[origem] || 0) + 1;
    kbLogRow({ id:d.id, titulo:d.titulo || d.topico || '', origem:origem, destino: acao === 'mover' ? destino : '',
      resultado: acao === 'mover' ? 'movido' : 'excluído', detalhe:'' });
    kbLog('✓ ' + (d.titulo || d.topico || d.id) + ' [' + origem + ']' + (acao === 'mover' ? ' → ' + destino : ' excluído'));
    kbProg(feito, orfaos.length, acao === 'mover' ? 'Movendo' : 'Excluindo');
  }
  kbLog('Resultado por disciplina de origem:');
  Object.keys(porOrigem).sort().forEach(function(k){ kbLog('  • ' + k + ': ' + porOrigem[k]); });
  kbLogResumo({
    'Ação': acao === 'mover' ? 'mover órfãos' : 'excluir órfãos',
    'Documentos processados': orfaos.length,
    'Disciplina de destino': acao === 'mover' ? destino : '—',
    'Por disciplina de origem': Object.keys(porOrigem).sort().map(function(k){ return k + ': ' + porOrigem[k]; }).join(' | '),
  });
  await logAdmin(acao === 'mover' ? 'reindexar_conhecimento' : 'limpar_orfaos_conhecimento','knowledge_docs', null, { total:orfaos.length, destino:destino||null });
  await loadKB(); kbPaint();
  kbProgHide();
  kbLog('Concluído: ' + orfaos.length + ' documento(s) processados.');
  kbOrfMsg(orfaos.length + ' conteúdo(s) órfão(s) ' + (acao === 'mover' ? 'movidos para ' + destino + '.' : 'excluídos.'));
};

/* ===== Preparar conteúdo da aula (IA) na publicação =====
   Gera UMA VEZ: aula da Athena, resumo inteligente, questões, flashcards,
   lacunas e podcast. Depois o aluno só lê o que já está pronto. */
const PREP_ROTULO = { aula:'Aula com Athena IA', resumo:'Resumo inteligente', questoes:'Questões',
  flashcards:'Flashcards', lacunas:'Preencher espaços', podcast:'Podcast' };

function prepPainel(){

function prepLog(txt, cor){

/* Prepara todos os recursos de UMA aula. Devolve true se deu tudo certo. */
window.kbPrepararAula = async function(disc, aula, regerar, silencioso){
  if(!disc || !aula) return false;
  if(!silencioso) prepLog('<b>' + esc(disc) + ' › ' + esc(aula) + '</b>', '#93C5FD');
  try{
    const r = await fetch('/api/public/kb-preparar', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', Authorization:'Bearer ' + (await kbToken()) },
      body: JSON.stringify({ curso:'prf-2021', disciplina: disc, topico: aula, regerar: !!regerar })
    });
    const j = await r.json().catch(function(){ return {}; });
    if(!r.ok){ prepLog('✕ ' + esc(j.error || ('falhou (' + r.status + ')')), '#FCA5A5'); return false; }
    (j.resultados || []).forEach(function(it){
      prepLog((it.ok ? '✓ ' : '✕ ') + (PREP_ROTULO[it.item] || it.item) + ' — ' + esc(it.detalhe),
        it.ok ? '#86EFAC' : '#FCA5A5');
    });
    return !!j.ok;
  }catch(e){
    prepLog('✕ falha de conexão', '#FCA5A5');
    return false;
  }
};

/* Prepara, uma a uma, todas as aulas publicadas de uma matéria. */
window.kbPrepararDisc = async function(disc, regerar){
  const aulas = KB_DOCS.filter(function(d){
    return d.disciplina === disc && d.topico && kbStatusDoc(d) === 'publicado';
  });
  if(!aulas.length) return alert('Não há aulas publicadas nesta matéria.');
  if(!confirm('Preparar o conteúdo de IA (aula, resumo, questões, flashcards, lacunas e podcast) de ' +
    aulas.length + ' aula(s) de ' + disc + '?\n\nIsso pode levar alguns minutos e é feito uma única vez.')) return;
  prepPainel();
  prepLog('Iniciando ' + aulas.length + ' aula(s) de ' + esc(disc) + '…', '#FDE68A');
  let ok = 0;
  for(let i=0;i<aulas.length;i++){
    prepLog('— ' + (i+1) + '/' + aulas.length, '#64748B');
    if(await kbPrepararAula(disc, aulas[i].topico, regerar)) ok++;
  }
  prepLog('<b>Concluído: ' + ok + '/' + aulas.length + ' aula(s) com tudo pronto.</b>', '#FDE68A');
  try{ await logAdmin('preparar_ia','knowledge_docs', null, { disciplina: disc, total: aulas.length }); }catch(e){}
};

  if(!pend.length) return;

  const box = document.getElementById('kb-fila-msg');

    .update({ status:'publicado', publicado:true }).in('id', pend.map(function(x){ return x.id; }));
  if(error){ if(box) box.textContent = 'Erro: ' + error.message; return; }
  await logAdmin('publicar_materia','knowledge_docs', null, { disciplina:d, total:pend.length });
  await loadKB(); kbPaint();
  const b2 = document.getElementById('kb-fila-msg');
  if(b2) b2.textContent = pend.length + ' aula(s) de ' + d + ' publicadas. Preparando o conteúdo de IA…';
  prepPainel();
  prepLog('Preparando ' + pend.length + ' aula(s) recém-publicadas de ' + esc(d) + '…', '#FDE68A');
  for(let i=0;i<pend.length;i++){
    if(pend[i].topico){ prepLog('— ' + (i+1) + '/' + pend.length, '#64748B'); await kbPrepararAula(d, pend[i].topico); }
  }
  prepLog('<b>Conteúdo pronto — o aluno já encontra tudo salvo.</b>', '#FDE68A');
};
window.kbDelete = async function(id){

};

/* ================= RAG da Athena =================

let RAG_DISC = '';

async function ragCfgCarregar(){
  const box = document.getElementById('rag-cfg-lista');
  if(!box) return;
  try{
    const j = await kbReq('/api/public/rag-settings?curso=' + encodeURIComponent(RAG_CURSO), 'GET');
    const regras = j.regras || [];
    if(!regras.length){ box.innerHTML = '<p class="muted" style="font-size:0.8rem">Nenhuma regra personalizada — tudo usa o padrão da plataforma.</p>'; return; }
    box.innerHTML = '<div class="kb-surface" style="font-size:0.8125rem">' + regras.map(r =>
      '<div style="display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid #EEF1F6;background:#fff">' +
        '<b style="flex:1;min-width:140px">' + (r.disciplina ? esc(r.disciplina) : 'Padrão do curso') + '</b>' +
        '<span class="kb-tag">' + Number(r.max_chars).toLocaleString('pt-BR') + ' caracteres</span>' +
        '<span class="kb-tag">' + r.top_k + ' trechos</span>' +
        '<span class="kb-tag">corte ' + String(r.threshold).replace('.', ',') + '</span>' +
        '<button class="act danger" style="font-size:0.75rem;padding:4px 10px" onclick="ragCfgExcluir(\'' + r.id + '\')">Excluir</button>' +
      '</div>').join('') + '</div>';
  }catch(e){ box.innerHTML = '<p class="muted">Erro: ' + esc(e.message) + '</p>'; }
}
window.ragCfgSalvar = async function(){
  const msg = document.getElementById('rag-cfg-msg');
  const disc = document.getElementById('rag-disc').value || null;
  const payload = {
    curso: RAG_CURSO, disciplina: disc,
    max_chars: parseInt(document.getElementById('rag-maxchars').value, 10),
    top_k: parseInt(document.getElementById('rag-topk').value, 10),
    threshold: parseFloat(String(document.getElementById('rag-threshold').value).replace(',', '.')),

  msg.textContent = 'Salvando…';
  try{
    await kbPost('/api/public/rag-settings', payload);

    ragCfgCarregar();
  }catch(e){ msg.textContent = e.message; }
};
window.ragCfgExcluir = async function(id){

window.ragTestar = async function(){
  const out = document.getElementById('rag-test-out');

  const disciplina = document.getElementById('rag-test-disc').value;

  msg.textContent = 'Buscando…';
  out.innerHTML = '';
  try{
    const j = await kbPost('/api/public/rag-preview', { curso: RAG_CURSO, disciplina, topico, pergunta });
    msg.textContent = '';
    const cfg = j.cfg || {};
    let html = '<p class="muted" style="font-size:0.78rem;margin:0 0 8px">Regra aplicada: ' +
      Number(cfg.maxChars||0).toLocaleString('pt-BR') + ' caracteres · ' + (cfg.topK||0) + ' trechos · corte ' +
      String(cfg.threshold).replace('.', ',') +
      (j.indexado ? ' · contexto usado: ' + Number(j.contextoUsado||0).toLocaleString('pt-BR') + ' caracteres' : '') + '</p>';
    if(j.aviso) html += '<p class="kb-sub" style="color:#92400E">' + esc(j.aviso) + '</p>';
    if(j.trechos && j.trechos.length){
      html += j.trechos.map(t =>
        '<div class="kb-surface" style="padding:10px 12px;margin-bottom:8px;background:#fff;font-size:0.8125rem;opacity:' + (t.entraNoContexto ? '1' : '0.55') + '">' +
          '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">' +
            '<b style="flex:1;min-width:120px">[Fonte ' + t.n + '] ' + esc(t.titulo) + '</b>' +
            (t.topico ? '<span class="kb-tag">' + esc(t.topico) + '</span>' : '') +
            (t.entraNoContexto ? '' : '<span class="kb-tag" style="background:#FEF3C7;color:#92400E;border-color:#FDE68A">fora do limite</span>') +
            '<b style="color:#1E3A8A">' + t.similaridade + '%</b>' +

const RAG_MOTIVOS = { sem_trechos:'Nenhum trecho passou no corte', erro_rag:'Falha na busca vetorial', sem_material:'Sem material publicado na matéria' };
window.ragMetricas = async function(){
  const out = document.getElementById('rag-met-out');
  if(!out) return;
  const disc = (document.getElementById('rag-met-disc') || {}).value || '';
  out.innerHTML = '<p class="muted">Carregando…</p>';
  try{
    const j = await kbPost('/api/public/rag-metrics', { curso: RAG_CURSO, disciplina: disc || undefined });
    const r = j.resumo || {};
    const pct = v => v == null ? '—' : v + '%';
    let html = '';
    if(j.reindex && j.reindex.reindexadas && j.reindex.reindexadas.length){
      html += '<p class="kb-sub" style="color:#065F46">Reindexação automática: ' + j.reindex.reindexadas.map(x => esc(x.disciplina) + ' (' + x.chunks + ' trechos)').join(', ') + '.</p>';
    }
    html += '<div class="kb-stats">' +
      '<div class="kb-stat"><b>' + (r.perguntas||0) + '</b><span>Perguntas à Athena</span></div>' +
      '<div class="kb-stat"><b>' + pct(r.taxaSucesso) + '</b><span>Responderam com RAG</span></div>' +
      '<div class="kb-stat"><b>' + pct(r.simMedia) + '</b><span>Similaridade média</span></div>' +
      '<div class="kb-stat"><b>' + (r.trechosMedios == null ? '—' : r.trechosMedios) + '</b><span>Trechos por resposta</span></div>' +
    '</div>';
    const fb = r.fallbacks || {};
    const fbKeys = Object.keys(fb);
    if(fbKeys.length){
      html += '<p class="kb-sub" style="margin-top:14px"><b>Modo antigo (fallback)</b> — ' + fbKeys.map(k => esc(RAG_MOTIVOS[k]||k) + ': ' + fb[k]).join(' · ') + '</p>';
    }
    if(j.porDisciplina && j.porDisciplina.length){
      html += '<h4 style="margin:16px 0 6px;font-size:0.85rem">Por matéria</h4><div class="kb-surface" style="font-size:0.8125rem">' +
        j.porDisciplina.map(d =>
          '<div style="display:flex;gap:10px;padding:8px 12px;border-bottom:1px solid #EEF1F6;background:#fff;align-items:center">' +
            '<b style="flex:1;min-width:140px">' + esc(d.disciplina) + '</b>' +
            '<span class="kb-tag">' + d.perguntas + ' perguntas</span>' +
            '<span class="kb-tag ' + (d.taxaSucesso >= 70 ? 'is-on' : 'is-wait') + '">' + pct(d.taxaSucesso) + ' com RAG</span>' +
            '<span class="kb-tag">sim. média ' + pct(d.simMedia) + '</span>' +
            '<span class="kb-tag">' + ((j.trechosPorDisciplina||{})[d.disciplina]||0) + ' trechos indexados</span>' +
          '</div>').join('') + '</div>';
    }
    if(j.cobertura && j.cobertura.length){
      html += '<h4 style="margin:16px 0 6px;font-size:0.85rem">Cobertura das aulas (publicadas com índice)</h4><div class="kb-surface" style="font-size:0.8125rem">' +
        j.cobertura.map(c =>
          '<div style="display:flex;gap:10px;padding:8px 12px;border-bottom:1px solid #EEF1F6;background:#fff;align-items:center">' +
            '<b style="flex:1;min-width:140px">' + esc(c.disciplina) + '</b>' +
            '<div style="width:140px;height:6px;border-radius:99px;background:#EEF1F6;overflow:hidden"><div style="height:100%;width:' + (c.pct||0) + '%;background:' + (c.pct >= 90 ? '#059669' : c.pct >= 60 ? '#2563EB' : '#D97706') + '"></div></div>' +
            '<span class="kb-tag">' + c.cobertas + '/' + c.aulas + ' aulas · ' + pct(c.pct) + '</span>' +
          '</div>').join('') + '</div>';
    }
    if(j.ultimos && j.ultimos.length){
      html += '<h4 style="margin:16px 0 6px;font-size:0.85rem">Últimas perguntas</h4><div class="kb-surface" style="font-size:0.78rem">' +
        j.ultimos.map(e =>
          '<div style="display:flex;gap:10px;padding:7px 12px;border-bottom:1px solid #EEF1F6;background:#fff;align-items:center">' +
            '<span class="kb-tag ' + (e.rag_ativo ? 'is-on' : 'is-wait') + '">' + (e.rag_ativo ? 'RAG' : 'fallback') + '</span>' +
            '<span style="flex:1;min-width:120px">' + esc(e.disciplina) + '</span>' +
            '<span class="muted">' + (e.rag_ativo ? e.trechos + ' trechos · sim ' + Math.round((e.sim_media||0)*100) + '%' : esc(RAG_MOTIVOS[e.motivo_fallback]||e.motivo_fallback||'')) + '</span>' +
            '<span class="muted">' + dth(e.created_at) + '</span>' +
          '</div>').join('') + '</div>';
    }
    if(!r.perguntas) html += '<p class="muted" style="margin-top:10px">Ainda sem perguntas registradas neste filtro — o relatório enche sozinho conforme os alunos usam a Athena.</p>';
    out.innerHTML = html;
  }catch(e){ out.innerHTML = '<p class="muted">Erro: ' + esc(e.message) + '</p>'; }
};

    boot();
  };
}

// Login do painel temporariamente desativado.
// Para reativar, defina window.PX_ADMIN_GUARD_ON = true antes deste script.
const ADMIN_GUARD_ON = (window.PX_ADMIN_GUARD_ON === true);

async function boot(){
  try { await PX.ready; } catch(e){}
  if (!ADMIN_GUARD_ON) {
    document.getElementById('who').textContent = PX.user ? PX.displayName() : 'Administrador';
    renderTabs();
    render();
    return;
  }
  if (PX.bootError) {
    renderTabs();
    return gateForm('Não foi possível conectar ao servidor. Recarregue a página.');
  }
  if (!PX.user) { renderTabs(); return gateForm(); }
  if (!PX.isAdmin()) {
    try {
      const { data } = await PX.sb.rpc('claim_admin');
      if (data === true) { PX.roles.push('admin'); }
    } catch (e) {}
  }
  if (!PX.isAdmin()) {
    renderTabs();
    gateForm('Esta conta (' + PX.user.email + ') está autenticada, mas ainda não possui o papel de administrador. Se a permissão acabou de ser concedida, clique em "Tentar novamente".');
    const box = document.querySelector('#view .card');
    if (box) {
      const p = document.createElement('p');
      p.style.marginTop = '10px';
      p.innerHTML = '<button class="act primary" id="a-retry" style="width:100%;margin-bottom:8px">Tentar novamente</button>'
                  + '<button class="act danger" id="a-out" style="width:100%">Sair desta conta</button>';
      box.appendChild(p);
      document.getElementById('a-retry').onclick = async () => {
        const btn = document.getElementById('a-retry');
        btn.textContent = 'Verificando…';
        try {
          const { data } = await PX.sb.from('user_roles').select('role').eq('user_id', PX.user.id);
          PX.roles = (data || []).map(r => r.role);
        } catch (e) {}
        if (PX.isAdmin()) { boot(); }
        else { btn.textContent = 'Tentar novamente'; document.getElementById('a-msg').textContent = 'Ainda sem permissão de administrador nesta conta.'; }
      };
      document.getElementById('a-out').onclick = async () => {
        await PX.sb.auth.signOut();
        location.href = 'home.html';
      };
    }
    return;
  }

  document.getElementById('who').textContent = PX.displayName();
  renderTabs();
  render();
}
boot();

<script>

window.copToggle = function(){

function copBolha(role, txt){
  const box = document.getElementById('cop-msgs');
  const d = document.createElement('div');
  d.style.cssText = role === 'user'
    ? 'align-self:flex-end;max-width:85%;background:#0B2A5B;color:#fff;padding:9px 12px;border-radius:14px 14px 4px 14px;white-space:pre-wrap'
    : 'align-self:flex-start;max-width:90%;background:#F1F5F9;color:#0F172A;padding:9px 12px;border-radius:14px 14px 14px 4px;white-space:pre-wrap';
  d.textContent = txt;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  return d;
}
/** Diagnóstico de cobertura por matéria, usado tanto no contexto da IA quanto nas recomendações. */
function copDiagnostico(){
  try{
    return kbDiscList().map(function(d){
      const tops = kbTopicList(d);
      const faltam = tops.filter(function(t){ return !((kbFind(d,t)||{}).conteudo||'').trim(); });
      const docs = KB_LIB.filter(function(x){ return x.discipline_nome === d; });
      const semTopico = docs.filter(function(x){ return !x.topic_nome; }).length;

    });

      ' Documentos: ' + (c.nomes.length ? c.nomes.join(' | ') : 'nenhum') + '.' +
      ' Tópicos sem material: ' + (c.faltam.length ? c.faltam.slice(0,25).join('; ') : 'nenhum');

window.copRecomendar = async function(){
  const p = document.getElementById('cop-panel');

  card.style.cssText = 'align-self:stretch;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:12px;padding:12px';

    card.innerHTML = '<b>Cobertura completa.</b><div class="muted">Todos os tópicos do edital já têm material vinculado.</div>';
  } else {
    const ordenado = diag.slice().sort(function(a,b){ return b.faltam.length - a.faltam.length; }).slice(0,6);
    card.innerHTML = '<b style="font-size:0.86rem">O que falta para completar o edital</b>' + ordenado.map(function(c){

      if(c.semTopico) acoes.push(c.semTopico + ' documento(s) já enviados estão sem tópico — use "Distribuir com IA" ou ajuste manualmente');
      if(c.faltam.length) acoes.push('faltam ' + c.faltam.length + ' de ' + c.total + ' tópicos com material');

      contexto: copContexto().slice(0, 20000),

function kbIaLerConfig(){
  const modulos = {};
  Array.prototype.forEach.call(document.querySelectorAll('.ia-cfg-mod'), function(c){ modulos[c.value] = c.checked; });
  return {
    instrucoes: (document.getElementById('ia-cfg-inst')||{}).value || '',
    modulos: modulos,
    questoes: {
      quantidade: Number((document.getElementById('ia-qtd')||{}).value || 10),
      dificuldade: (document.getElementById('ia-dific')||{}).value || 'misto',
      comentarios: !!((document.getElementById('ia-coment')||{}).checked),
      prioridades: Array.prototype.map.call(document.querySelectorAll('.ia-prio:checked'), function(c){ return c.value; }),
    },
  };
}
window.kbIaSalvarConfig = async function(avisar){
  try{
    const cfg = kbIaLerConfig();
    await kbIaApi({ acao:'salvar-config', config: cfg });
    if(IA_DADOS) IA_DADOS.config = cfg;
    if(avisar !== false) toast('Configuração da aula salva.');
    return true;
  }catch(e){ toast(e.message || 'Falha ao salvar configuração.'); return false; }
};
window.kbIaAbrirPdf = async function(){
  const pdf = kbPdfDaAula(IA_AULA);
  if(!pdf) return;
  try{
    const r = await PX.sb.storage.from('aulas-pdf').createSignedUrl(pdf, 600);
    if(r && r.data && r.data.signedUrl) window.open(r.data.signedUrl, '_blank');
    else toast('Não consegui abrir o PDF agora.');
  }catch(e){ toast('Não consegui abrir o PDF agora.'); }
};
window.kbIaGerarTudo = async function(){
  if(IA_OCUPADO) return;
  if(!(await kbIaSalvarConfig(false))) return;
  const cfg = kbIaLerConfig();
  const tipos = IA_MODULOS.filter(function(mo){ return cfg.modulos[mo.tipo] !== false; }).map(function(mo){ return mo.tipo; });
  if(!tipos.length){ toast('Marque ao menos um módulo para gerar.'); return; }
  IA_OCUPADO = true;
  const btn = document.getElementById('ia-btn-gerar');
  if(btn){ btn.disabled = true; btn.textContent = 'Gerando…'; }
  const prog = document.getElementById('ia-progresso');
  if(prog){ prog.style.display = 'block'; prog.innerHTML = tipos.map(function(t){
    const mo = kbIaMeta(t);
    return '<div id="ia-prog-'+t+'" style="font-size:0.83rem;padding:4px 0">○ '+mo.icon+' '+mo.rotulo+'</div>';
  }).join(''); }
  for(const t of tipos){
    const linha = document.getElementById('ia-prog-'+t);
    if(linha) linha.innerHTML = '⏳ ' + linha.textContent.slice(2) + ' — gerando…';
    try{
      const tem = !!kbIaMod(t).atual;
      const r = await kbIaApi({ acao: tem ? 'regenerar' : 'gerar', tipo: t, modo: tem ? 'original' : undefined, config: { instrucoes: cfg.instrucoes || undefined, questoes: cfg.questoes } });
      if(linha) linha.innerHTML = '✓ ' + linha.textContent.slice(2).split(' — ')[0] + (r.cache ? ' — já estava pronto' : ' — v' + (r.versao||'?') + ' gerada');
    }catch(e){
      if(linha) linha.innerHTML = '✕ ' + linha.textContent.slice(2).split(' — ')[0] + ' — ' + esc(e.message || 'falhou');
    }
  }
  IA_OCUPADO = false;
  await kbIaRecarregar();
  toast('Geração concluída. Revise em "Conteúdos gerados" e publique na aba "Publicação".');
};

window.kbIaGerarUm = async function(tipo, botao){
  if(IA_OCUPADO){ toast('Aguarde a geração atual terminar.'); return; }
  IA_OCUPADO = true;
  const botoes = Array.prototype.slice.call(document.querySelectorAll('.ia-gerar-um'));
  botoes.forEach(function(b){ b.disabled = true; });
  if(botao){ botao.textContent = 'Gerando…'; botao.setAttribute('aria-busy','true'); }
  try{
    const cfg = (IA_DADOS && IA_DADOS.config) || {};
    const r = await kbIaApi({ acao:'gerar', tipo: tipo, config: { instrucoes: cfg.instrucoes || undefined, questoes: cfg.questoes } });
    toast(r.cache ? 'Este conteúdo já existia — versão mantida.' : 'Versão ' + (r.versao||1) + ' gerada (rascunho).');
    await kbIaRecarregar();
  }catch(e){
    toast(e.message || 'Não consegui gerar agora.');
    if(botao){ botao.textContent = 'Tentar novamente'; botao.removeAttribute('aria-busy'); }
    botoes.forEach(function(b){ b.disabled = false; });
  }finally{
    IA_OCUPADO = false;
  }
};
/* Busca o conteúdo completo da versão mais recente (a listagem traz só metadados). */
async function kbIaConteudoAtual(tipo){
  const j = await kbIaApi({ acao:'historico', tipo: tipo });
  const vs = j.versoes || [];
  return vs[0] || null;
}
window.kbIaVer = async function(tipo, versaoConteudo, versaoNum){
  const mo = kbIaMeta(tipo);

    try{
      const v = await kbIaConteudoAtual(tipo);

window.kbIaIns = function(qual, linha){
  const mapa = { 'H2':['## ',''], 'H3':['### ',''], 'Negrito':['**','**'], 'Itálico':['*','*'], 'Lista':['- ',''] };
  const p = mapa[qual]; if(!p) return;
  const ta = document.getElementById('ia-ed-txt'); if(!ta) return;
  const ini = ta.selectionStart, fim = ta.selectionEnd, sel = ta.value.slice(ini, fim);
  let novo;
  if(linha) novo = ta.value.slice(0, ini) + (sel || 'texto').split(/\n/).map(function(l){ return p[0] + l; }).join('\n') + ta.value.slice(fim);
  else novo = ta.value.slice(0, ini) + p[0] + (sel || 'texto') + p[1] + ta.value.slice(fim);
  ta.value = novo; ta.focus();
  kbIaPreview();
};
window.kbIaPreview = function(){
  const ta = document.getElementById('ia-ed-txt');
  const pv = document.getElementById('ia-ed-prev');
  if(ta && pv) pv.innerHTML = kbMD(ta.value) || '<span class="muted">Sem conteúdo.</span>';
};

/* ---------- sub-painéis: melhorar / acrescentar / regenerar ---------- */
window.kbIaSub = function(tipo, modo){
  const box = document.getElementById('ia-sub-' + tipo);
  if(!box) return;
  if(box.dataset.aberto === modo){ box.innerHTML = ''; box.dataset.aberto = ''; return; }
  box.dataset.aberto = modo;
  const ops = modo === 'melhorar' ? (IA_MELHORAR_OPS[tipo] || ['mais organizado','mais objetivo','mais didático','mais direcionado para prova']) : [];
  const titulos = { melhorar:'Melhorar com IA — reescreve a versão atual como nova versão', acrescentar:'Acrescentar — adiciona conteúdo sem remover o que já existe', regenerar:'Regenerar — cria nova versão a partir do material da aula' };
  box.innerHTML = '<div style="margin-top:10px;border-top:1px dashed #E2E8F0;padding-top:10px">'
    + '<div style="font-size:0.8rem;font-weight:700;margin-bottom:6px">'+titulos[modo]+'</div>'
    + (ops.length ? '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">' + ops.map(function(o){
        return '<button class="act" style="font-size:0.72rem" onclick="kbIaRodarIA(\''+tipo+'\',\'melhorar\',\''+escJs(o)+'\')">'+o+'</button>';
      }).join('') + '</div>' : '')
    + (modo === 'regenerar'
        ? '<div style="font-size:0.8rem;display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px">'

          + '<label><input type="radio" name="ia-modo-'+tipo+'" value="acrescentando"> Acrescentando novas informações do material</label></div>'
        : '')

    +   '<input id="ia-sub-in-'+tipo+'" placeholder="Instrução personalizada (opcional)" style="flex:1;min-width:220px;font-size:0.8rem">'

window.kbIaRodarIA = async function(tipo, modo, instrPre){
  if(IA_OCUPADO) return;
  const inp = document.getElementById('ia-sub-in-' + tipo);
  const instr = instrPre || (inp ? inp.value.trim() : '') || undefined;
  let modoReg;
  if(modo === 'regenerar'){
    const r = document.querySelector('input[name="ia-modo-'+tipo+'"]:checked');
    modoReg = r ? r.value : 'original';
  }
  IA_OCUPADO = true;
  const box = document.getElementById('ia-sub-' + tipo);
  if(box) box.querySelectorAll('button').forEach(function(b){ b.disabled = true; });
  try{
    const cfg = (IA_DADOS && IA_DADOS.config) || {};
    const payload = { acao: modo, tipo: tipo, instrucao: instr, config: { instrucoes: cfg.instrucoes || undefined, questoes: cfg.questoes } };
    if(modo === 'regenerar') payload.modo = modoReg;
    const r = await kbIaApi(payload);

  await kbIaRecarregar();
};

  const sts = (IA_DADOS && IA_DADOS.statusEditorial) || [

  body.innerHTML = '<div style="background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:16px 18px">'
    + '<div style="font-weight:800;margin-bottom:4px">🚀 Publicação para os alunos</div>'
    + '<div class="muted" style="font-size:0.8rem;margin-bottom:10px">Só o que está <b>publicado</b> aparece no painel do aluno e entra no contexto da Athena. Rascunhos ficam visíveis apenas aqui.</div>'
    + '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
    +   '<button class="act primary" style="padding:10px 18px;font-size:0.86rem" onclick="kbIaPublicarTudo()">Publicar todos os conteúdos aprovados</button>'
    +   '<span class="muted" style="font-size:0.75rem">Publica a versão mais recente de cada módulo que ainda está em rascunho.</span>'
    + '</div>'
    + '<details style="margin-top:12px;border-top:1px solid #F1F5F9;padding-top:10px">'
    +   '<summary class="muted" style="cursor:pointer;font-size:0.78rem">Controle editorial (status, versão, próxima revisão)</summary>'
    +   '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px">'
    +     '<div><label class="muted" style="font-size:0.74rem">Status</label><select id="ia-ed-status" style="width:100%">'
    +       sts.map(function(o){ return '<option value="'+o.valor+'"'+(ed.status===o.valor?' selected':'')+'>'+o.rotulo+'</option>'; }).join('')
    +     '</select></div>'
    +     '<div><label class="muted" style="font-size:0.74rem">Versão editorial</label><input id="ia-ed-versao" style="width:100%" value="'+esc(ed.versao_rotulo||'v1.0')+'"></div>'
    +     '<div><label class="muted" style="font-size:0.74rem">Próxima revisão</label><input id="ia-ed-revisao" type="date" style="width:100%" value="'+esc(ed.proxima_revisao||'')+'"></div>'
    +   '</div>'
    +   '<div style="margin-top:10px"><label class="muted" style="font-size:0.74rem">Observações do revisor</label>'
    +     '<textarea id="ia-ed-obs" rows="2" style="width:100%;font-size:0.84rem">'+esc(ed.observacoes||'')+'</textarea></div>'
    +   '<div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
    +     '<button class="act primary" style="font-size:0.78rem" onclick="kbIaSalvarEditorial(false)">Salvar status</button>'
    +     '<button class="act" style="font-size:0.78rem" onclick="kbIaSalvarEditorial(true)">✓ Marcar como conferida hoje</button>'
    +     '<span class="muted" style="font-size:0.74rem">Última conferência: '+(ed.ultima_verificacao ? new Date(ed.ultima_verificacao).toLocaleDateString('pt-BR') : '—')+'</span>'
    +   '</div>'
    + '</details></div>';
}
function kbIaPaintPublicacao(body){
  body.innerHTML = '<div style="max-width:760px;margin:0 auto"></div>';
  kbIaEditorialHtml(body.firstChild);
}
window.kbIaSalvarEditorial = async function(conferida){
  const v = function(id){ const e = document.getElementById(id); return e ? e.value : ''; };
  try{
    const r = await kbIaApi({ acao:'salvar-editorial', editorial:{
      status: v('ia-ed-status'), versao_rotulo: v('ia-ed-versao') || 'v1.0',
      observacoes: v('ia-ed-obs'), proxima_revisao: v('ia-ed-revisao') || undefined,
      verificado: !!conferida,
    }});
    if(IA_DADOS && r && r.editorial) IA_DADOS.editorial = r.editorial;
    toast('Status editorial salvo.');
    kbIaPaint();
  }catch(e){ toast(e.message || 'Não consegui salvar o status editorial.'); }
};
window.kbIaPublicar = async function(tipo){
  try{
    await kbIaApi({ acao:'publicar', tipo: tipo });
    toast(kbIaMeta(tipo).rotulo + ' publicado para os alunos.');
    await kbIaRecarregar();
  }catch(e){ toast(e.message || 'Não consegui publicar.'); }
};
window.kbIaDespublicar = async function(tipo){
  if(!confirm('Despublicar esconde este conteúdo dos alunos (o histórico é mantido). Continuar?')) return;
  try{
    await kbIaApi({ acao:'despublicar', tipo: tipo });
    toast(kbIaMeta(tipo).rotulo + ' despublicado.');
    await kbIaRecarregar();
  }catch(e){ toast(e.message || 'Não consegui despublicar.'); }
};
window.kbIaPublicarTudo = async function(){
  if(IA_OCUPADO) return;
  IA_OCUPADO = true;
  let feitas = 0, falhas = 0;
  for(const mo of IA_MODULOS){
    const m = kbIaMod(mo.tipo);
    if(!m.atual || (m.publicado && m.publicado.versao >= m.atual.versao)) continue;
    try{ await kbIaApi({ acao:'publicar', tipo: mo.tipo }); feitas++; }
    catch(e){ falhas++; }
  }
  IA_OCUPADO = false;
  toast(falhas ? feitas + ' módulo(s) publicados, ' + falhas + ' falharam.' : feitas ? feitas + ' módulo(s) publicados para os alunos.' : 'Nada novo para publicar.');
  await kbIaRecarregar();
};

/* ---------- geração em lote (todas as aulas da matéria) ---------- */
window.kbIaLote = function(){
  if(!kbDisc){ toast('Escolha uma matéria primeiro.'); return; }
  let m = document.getElementById('kb-ia-lote');
  if(!m){
    m = document.createElement('div');
    m.id = 'kb-ia-lote';
    m.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:60;display:none;align-items:center;justify-content:center';
    document.body.appendChild(m);
  }
  m.style.display = 'flex';
  m.innerHTML = '<div style="background:#fff;width:min(720px,94vw);max-height:88vh;border-radius:14px;display:flex;flex-direction:column;overflow:hidden">'
    + '<div style="padding:14px 16px;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;gap:10px">'
    +   '<b style="flex:1">📚 Preparar IA em lote — ' + esc(kbDisc) + '</b>'
    +   '<button class="act" onclick="document.getElementById(\'kb-ia-lote\').style.display=\'none\'">Fechar</button>'
    + '</div>'
    + '<div style="padding:16px;overflow:auto">'
    +   '<div style="font-weight:800;font-size:0.85rem;margin-bottom:6px">Aulas ('+KB_AULAS.length+') <label style="font-weight:400;font-size:0.75rem;margin-left:8px"><input type="checkbox" checked onchange="document.querySelectorAll(\'.ia-lote-aula\').forEach(c=>c.checked=this.checked)"> todas</label></div>'
    +   '<div style="max-height:180px;overflow:auto;border:1px solid #E2E8F0;border-radius:10px;padding:8px 12px;margin-bottom:12px">'
    +   KB_AULAS.map(function(a){
          return '<label style="display:flex;gap:8px;font-size:0.8rem;padding:3px 0"><input type="checkbox" class="ia-lote-aula" value="'+esc(a.nome).replace(/"/g,'&quot;')+'" checked> Aula '+String(a.ordem).padStart(2,'0')+' · '+esc(a.nome)+'</label>';
        }).join('')
    +   '</div>'
    +   '<div style="font-weight:800;font-size:0.85rem;margin-bottom:6px">Módulos</div>'
    +   '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 12px;margin-bottom:12px">'
    +   IA_MODULOS.map(function(mo){
          return '<label style="font-size:0.8rem;display:flex;gap:6px;align-items:center"><input type="checkbox" class="ia-lote-mod" value="'+mo.tipo+'" checked> '+mo.icon+' '+mo.rotulo+'</label>';
        }).join('')
    +   '</div>'
    +   '<div class="muted" style="font-size:0.74rem;margin-bottom:10px">O que já estiver gerado é apenas publicado (sem gastar IA de novo). As aulas rodam uma a uma, na ordem.</div>'
    +   '<button class="act primary" id="ia-lote-btn" style="padding:10px 18px;font-size:0.86rem" onclick="kbIaLoteRodar()">▶ INICIAR GERAÇÃO EM LOTE</button>'
    +   '<div id="ia-lote-log" style="margin-top:12px;font-size:0.78rem;max-height:200px;overflow:auto"></div>'
    + '</div></div>';
};
window.kbIaLoteRodar = async function(){
  if(IA_OCUPADO) return;
  const aulas = Array.prototype.map.call(document.querySelectorAll('.ia-lote-aula:checked'), function(c){ return c.value; });
  const tipos = Array.prototype.map.call(document.querySelectorAll('.ia-lote-mod:checked'), function(c){ return c.value; });
  if(!aulas.length || !tipos.length){ toast('Marque ao menos uma aula e um módulo.'); return; }
  const log = document.getElementById('ia-lote-log');
  const btn = document.getElementById('ia-lote-btn');
  IA_OCUPADO = true;
  if(btn) btn.disabled = true;
  const linha = function(html){
    if(!log) return;
    const d = document.createElement('div');
    d.style.cssText = 'padding:2px 0;border-bottom:1px solid #F8FAFC';
    d.innerHTML = html;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  };
  if(log) log.innerHTML = '';
  for(const nome of aulas){
    linha('<b>▶ ' + esc(nome) + '</b>');
    for(const t of tipos){
      const mo = kbIaMeta(t);
      try{
        const r = await kbPost('/api/public/aula-pacote', {
          acao:'gerar', curso:'prf-2021', disciplina: kbDisc, topico: nome, tipo: t, publicar: true,
        });
        linha('&nbsp;&nbsp;' + (r.cache ? '✓ ' : '✨ ') + mo.icon + ' ' + mo.rotulo + (r.cache ? ' — já estava pronto (publicado)' : ' — v' + (r.versao||'?') + ' gerada e publicada'));
      }catch(e){
        linha('&nbsp;&nbsp;✕ ' + mo.icon + ' ' + mo.rotulo + ' — ' + esc(e.message || 'falhou'));
      }
    }
  }
  linha('<b>Fila concluída.</b>');
  IA_OCUPADO = false;
  if(btn) btn.disabled = false;
  kbIaBadges();
  toast('Geração em lote concluída — confira o log.');
};
</script>
