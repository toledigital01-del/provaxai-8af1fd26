window.kbFilaLimpar = function(){ if(KB_ING_ATIVO) return; KB_FILA = []; kbFilaPaint(); };
window.kbFilaRemover = function(i){ if(KB_ING_ATIVO) return; KB_FILA.splice(i,1); kbFilaPaint(); };
window.kbFilaRetry = function(i){ const f = KB_FILA[i]; if(!f || KB_ING_ATIVO) return; f.estado = 'fila'; f.erro = ''; kbFilaPaint(); kbFilaProcessar(); };

/* Lê um arquivo e já grava na biblioteca da matéria. */
async function kbLerArquivo(item, direitos){
  const f = item.file;
  let texto = '', origem = f.name;
  if(kbEhTextoSimples(f)){
    texto = (await f.text()).trim();
  }else{
    const b64 = await new Promise((res,rej)=>{ const r = new FileReader(); r.onload=()=>res(String(r.result)); r.onerror=rej; r.readAsDataURL(f); });
    const j = await kbPost('/api/public/kb-ingest', { tipo: kbEhImagem(f) ? 'imagem' : 'auto', nome:f.name, mime:f.type || '', arquivo_base64:b64 });
    texto = j.texto; origem = j.origem || f.name;
  }
  if(!texto) throw new Error('Não foi possível extrair texto deste arquivo.');
  kbRegistrarFonte(origem, texto);
  await kbLibGravar({ nome: origem, tipo: kbTipoDoc(f.name, f.type || '', ''), texto: texto, direitos: direitos });
  return texto.length;
}

/* Processa a fila com 3 leituras em paralelo; falhas não param o restante. */
async function kbFilaProcessar(){
  if(KB_ING_ATIVO) return;
  const direitos = kbDireitosEscolhido();
  if(!kbValidDisc(kbDisc)) return kbIngMsg('Selecione uma matéria válida antes de carregar material.');
  const pendentes = KB_FILA.filter(function(f){ return f.estado === 'fila'; });
  if(!pendentes.length) return;

  KB_ING_ATIVO = true;
  kbMontarEstado();
  kbSetBusy(true, 'Lendo ' + pendentes.length + ' arquivo(s)…');
  const total = pendentes.length;
  let feitos = 0;
  kbIngProg(0, total, 'Lendo arquivos');

  const worker = async function(){
    for(;;){
      const item = KB_FILA.find(function(f){ return f.estado === 'fila'; });
      if(!item) return;
      item.estado = 'lendo'; item.erro = ''; kbFilaPaint();
      try{
        item.chars = await kbLerArquivo(item, direitos);
        item.estado = 'pronto';
      }catch(e){
        item.estado = 'falhou'; item.erro = e.message || 'Erro ao ler o arquivo.';
      }
      feitos++;
      kbFilaPaint();
      kbIngProg(feitos, total, 'Lendo arquivos');
    }
  };
  await Promise.all([worker(), worker(), worker()]);

  KB_ING_ATIVO = false;
  kbSetBusy(false);
  kbIngProg(total, total, 'Leitura concluída');
  setTimeout(kbIngProgHide, 1200);
  kbMontarEstado();
  const ok = KB_FILA.filter(function(f){ return f.estado === 'pronto'; }).length;
  const bad = KB_FILA.filter(function(f){ return f.estado === 'falhou'; }).length;
  const chars = KB_FILA.reduce(function(a,f){ return a + (f.chars||0); }, 0);
  kbIngMsg(ok + ' arquivo(s) lido(s) · ' + chars.toLocaleString('pt-BR') + ' caracteres' + (bad ? ' · ' + bad + ' com falha' : '') + '.');
  const auto = document.getElementById('kb-auto-classificar');
  if(ok && auto && auto.checked) await kbDistribuir();
}

/* Coloca os arquivos escolhidos/soltos na fila e começa a leitura. */
window.kbIngestFiles = async function(files){
  if(!files || !files.length) return;
  if(!kbValidDisc(kbDisc)) return kbIngMsg('Selecione uma matéria válida antes de carregar material.');
  files.forEach(function(f){ KB_FILA.push({ file:f, nome:f.name, estado:'fila', chars:0, erro:'' }); });
  kbFilaPaint();
  await kbFilaProcessar();
};

window.kbIngestUrlAuto = async function(url){
  if(!kbValidDisc(kbDisc)) return kbIngMsg('Selecione uma matéria válida antes de carregar material.');
  const direitos = kbDireitosEscolhido();
  const tipo = kbEhVideoUrl(url) ? 'video' : 'url';
  KB_ING_ATIVO = true;
  kbSetBusy(true, 'Lendo ' + (tipo === 'video' ? 'vídeo' : 'site') + '…');
  kbIngProg(0.4, 1, 'Buscando conteúdo do ' + (tipo === 'video' ? 'vídeo' : 'site'));
  kbMontarEstado();
  try{
    const j = await kbPost('/api/public/kb-ingest', { tipo, url });
    kbRegistrarFonte(j.origem || url, j.texto || '');
    await kbLibGravar({ nome: j.origem || url, tipo: tipo, origem_url: url, texto: j.texto || '', direitos: direitos });
    kbIngMsg('Conteúdo do link carregado (' + String(j.texto || '').length.toLocaleString('pt-BR') + ' caracteres).');
  }catch(e){ kbIngMsg('Erro: ' + e.message); }
  KB_ING_ATIVO = false;
  kbSetBusy(false);
  kbIngProg(1, 1, 'Leitura concluída');
  setTimeout(kbIngProgHide, 1200);
  kbMontarEstado();
};

/* ---- Distribuição do material nos tópicos do edital (sem reescrever nada) ---- */
function kbLotes(arr, tam){
  const out = [];
  for(let i = 0; i < arr.length; i += tam) out.push(arr.slice(i, i + tam));
  return out;
}
/* Corta o texto em trechos de ~5 mil caracteres respeitando parágrafos/títulos. */
function kbTrechos(texto, nome){
  const blocos = String(texto || '').split(/\n(?=#{1,3}\s)|\n\s*\n/).filter(function(b){ return b.trim(); });
  const out = [];
  let atual = '';
  for(const b of blocos){
    if((atual + '\n\n' + b).length > 5000 && atual.trim()){ out.push({ nome: nome, texto: atual.trim() }); atual = b; }
    else atual = atual ? atual + '\n\n' + b : b;
  }
  if(atual.trim()) out.push({ nome: nome, texto: atual.trim() });
  return out;
}

let KB_GERADAS = [];
let KB_ABERTA = -1;
let KB_TRECHOS = [];       /* {nome, texto, sug, topico, manual, sel} */
let KB_INCLUIR = {};       /* topico -> boolean */
let KB_FILTRO = 'todos';
let KB_TRECHO_ABERTO = -1;

/* Classifica (ou reclassifica) apenas os índices pedidos. Trechos ajustados
   à mão nunca entram — a escolha do usuário é definitiva. */
async function kbClassificarIdx(idxs, disciplina, topicos, rotulo){
  const alvo = idxs.filter(function(i){ return KB_TRECHOS[i] && !KB_TRECHOS[i].manual; });
  if(!alvo.length) return 0;
  let feitos = 0, ok = 0;
  for(const lote of kbLotes(alvo, 8)){
    kbIngProg(feitos, alvo.length, rotulo + ' (' + Math.min(feitos + lote.length, alvo.length) + ' de ' + alvo.length + ')');
    try{
      const j = await kbPost('/api/public/kb-classify', {
        disciplina: disciplina,
        topicos: topicos,
        trechos: lote.map(function(i){ return { i: i, amostra: KB_TRECHOS[i].texto.slice(0, 2500) }; }),
      });
      (j.mapa || []).forEach(function(m){
        const t = KB_TRECHOS[m.i];
        if(!t || t.manual) return;
        t.sug = m.topico || '';
        t.topico = m.topico || '';
        if(m.topico) ok++;
      });
    }catch(e){
      kbIngMsg('Falha em um lote (' + e.message + '). Continuando com os demais…');
    }
    feitos += lote.length;
    kbIngProg(feitos, alvo.length, rotulo);
  }
  return ok;
}

window.kbDistribuir = async function(){
  const disciplina = kbValidDisc(kbDisc);
  if(!disciplina) return kbIngMsg('Selecione uma matéria válida antes de guardar o material.');
  if(KB_ING_ATIVO) return kbIngMsg('Aguarde a leitura do material terminar.');
  const topicos = kbTopicList(disciplina);
  if(!topicos.length) return kbIngMsg('Esta matéria não tem tópicos cadastrados. Grave o edital primeiro.');

  let brutos = [];
  KB_FONTES.forEach(function(f){ brutos = brutos.concat(kbTrechos(f.texto, f.nome)); });
  if(!brutos.length) return kbIngMsg('Carregue primeiro o material (arquivo, link ou texto).');

  KB_TRECHOS = brutos.map(function(b){ return { nome:b.nome, texto:b.texto, sug:'', topico:'', manual:false, sel:false }; });
  KB_INCLUIR = {}; KB_GERADAS = []; KB_ABERTA = -1; KB_TRECHO_ABERTO = -1; KB_FILTRO = 'todos';
  const box = document.getElementById('kb-preview'); if(box) box.innerHTML = '';
  kbSetBusy(true, 'A IA está encaixando ' + KB_TRECHOS.length + ' trecho(s) nos tópicos de ' + disciplina + '…');

  await kbClassificarIdx(KB_TRECHOS.map(function(_,i){ return i; }), disciplina, topicos, 'Classificando trechos');

  const sem = KB_TRECHOS.filter(function(t){ return !t.topico; }).length;
  kbSetBusy(false);
  kbIngProgHide();
  kbMontarEstado();
  kbAgrupar();
  kbIngMsg('Material distribuído em ' + KB_GERADAS.length + ' de ' + topicos.length + ' tópico(s)'
    + (sem ? ' — ' + sem + ' trecho(s) ficaram sem tópico. Corrija abaixo ou reclassifique só eles.' : '.'));
  kbPaintPreview();
};

/* Junta os trechos por tópico — visão derivada, recalculada a cada ajuste. */
function kbAgrupar(){
  const topicos = kbTopicList(kbDisc);
  const porTopico = {};
  KB_TRECHOS.forEach(function(t){
    if(!t.topico) return;
    (porTopico[t.topico] = porTopico[t.topico] || []).push(t);
  });
  KB_GERADAS = Object.keys(porTopico).map(function(t){
    const partes = porTopico[t];
    if(KB_INCLUIR[t] === undefined) KB_INCLUIR[t] = true;
    return {
      disciplina: kbDisc, topico: t, titulo: t, incidencia: 'media', incluir: !!KB_INCLUIR[t],
      fontes: Array.from(new Set(partes.map(function(p){ return p.nome; }))),
      conteudo: partes.map(function(p){ return p.texto; }).join('\n\n'),
    };
  }).sort(function(a,b){ return topicos.indexOf(a.topico) - topicos.indexOf(b.topico); });
}

window.kbTrechoTopico = function(i, v){
  const t = KB_TRECHOS[i]; if(!t) return;
  t.topico = v;
  t.manual = (v !== t.sug);

};

function kbTrechosVisiveis(){
  return KB_TRECHOS.map(function(t,i){ return { t:t, i:i }; }).filter(function(x){

    return true;
  });
}
window.kbReclassificarSelecionados = async function(){
  const disciplina = kbValidDisc(kbDisc);
  if(!disciplina) return kbIngMsg('Selecione uma matéria válida.');
  const idxs = KB_TRECHOS.map(function(t,i){ return t.sel ? i : -1; }).filter(function(i){ return i >= 0; });

window.kbPublicarGeradas = async function(){
  let lista;
  try{ lista = PXKB.filtrarAulasPublicaveis(KB_GERADAS, kbDisc, kbDiscList()); }
  catch(e){ return kbIngMsg(e.message); }
  const disciplinaSelecionada = kbValidDisc(kbDisc);
  if(!lista.length) return kbIngMsg('Marque ao menos um tópico desta matéria para salvar.');
  const modo = (document.querySelector('input[name="kb-mode"]:checked')||{}).value || 'append';

  kbSetBusy(true, 'Salvando material em ' + lista.length + ' tópico(s) de ' + disciplinaSelecionada + '…');
  for(const a of lista){
    const doc = kbFind(disciplinaSelecionada, a.topico);
    const atual = doc && modo === 'append' ? String(doc.conteudo || '').trim() : '';
    const conteudo = (atual ? atual + '\n\n' : '') + String(a.conteudo).trim();
    let payload;
    try{
      /* O material entra como rascunho — só vai ao ar depois da revisão humana. */
      payload = PXKB.montarDoc({ disciplina:disciplinaSelecionada, discList:kbDiscList(), topico:a.topico,
        titulo:a.titulo || a.topico, conteudo:conteudo, status:'rascunho', userId:PX.user.id });
    }catch(e){ kbSetBusy(false); return kbIngMsg(e.message); }
    const { error } = doc
      ? await PX.sb.from('knowledge_docs').update(payload).eq('id', doc.id)
      : await PX.sb.from('knowledge_docs').insert(payload);
    if(error){ kbSetBusy(false); kbIngMsg('Erro ao salvar "' + a.topico + '": ' + error.message); return; }
    if(!doc) await loadKB();
  }
  await logAdmin('distribuir_material','knowledge_docs', null, { disciplina:disciplinaSelecionada, topicos:lista.length });
  const n = lista.length; KB_GERADAS = []; KB_TRECHOS = []; KB_INCLUIR = {}; KB_ABERTA = -1; KB_TRECHO_ABERTO = -1;
  await loadKB(); kbSetBusy(false); kbPaint();
  kbIngMsg('Material guardado em ' + n + ' tópico(s) como rascunho. Revise em "Aulas aguardando revisão" e publique.');
};

/* Manutenção: reindexar a base e tratar conteúdos órfãos (matéria vazia ou fora do edital). */
let KB_LOG = [];
let KB_LOG_ROWS = [];
let KB_LOG_META = { titulo:'', acao:'', modo:'', quando:null, resumo:{} };
function kbRenderLog(){
  const pre = document.getElementById('kb-log');
  const csv = document.getElementById('kb-exp-csv');
  const pdf = document.getElementById('kb-exp-pdf');
  if(csv) csv.disabled = !KB_LOG.length || KB_BUSY;

  pre.style.display = KB_LOG.length ? 'block' : 'none';
  pre.textContent = KB_LOG.join('\n');
  pre.scrollTop = pre.scrollHeight;
}
function kbLogReset(titulo, acao, modo){
  KB_LOG = titulo ? ['— ' + titulo + ' —'] : [];
  KB_LOG_ROWS = [];
  KB_LOG_META = { titulo: titulo || '', acao: acao || '', modo: modo || '', quando: new Date(), resumo: {} };

}

/* Registro estruturado para auditoria (CSV/PDF). */
function kbLogRow(r){
  KB_LOG_ROWS.push({
    quando: new Date().toISOString(),
    acao: KB_LOG_META.acao || '',
    modo: KB_LOG_META.modo || '',

  });

function kbLogResumo(obj){ KB_LOG_META.resumo = Object.assign({}, KB_LOG_META.resumo, obj); }
function kbCarimbo(d){
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}
function kbBaixar(nome, conteudo, mime){
  const blob = new Blob([conteudo], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nome;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
window.kbExportLog = function(formato){
  if(!KB_LOG.length) return kbOrfMsg('Não há log para exportar. Rode a prévia ou uma operação primeiro.');
  const d = KB_LOG_META.quando || new Date();
  const base = 'provax-reindex-' + (KB_LOG_META.modo === 'previa' ? 'previa' : 'execucao') + '-' + kbCarimbo(d);
  const cols = ['quando','acao','modo','documento_id','titulo','disciplina_origem','disciplina_destino','resultado','detalhe'];
  if(formato === 'csv'){
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"';
    const linhas = [cols.map(q).join(';')].concat(KB_LOG_ROWS.map(function(r){ return cols.map(function(c){ return q(r[c]); }).join(';'); }));
    kbBaixar(base + '.csv', '\uFEFF' + linhas.join('\r\n'), 'text/csv;charset=utf-8');
    kbOrfMsg('CSV exportado com ' + KB_LOG_ROWS.length + ' registro(s).');
    return;
  }
  const resumo = KB_LOG_META.resumo || {};

function kbProg(feito, total, texto){
  const wrap = document.getElementById('kb-prog-wrap');
  const bar = document.getElementById('kb-prog-bar');
  const txt = document.getElementById('kb-prog-txt');
  if(!wrap) return;
  if(total <= 0){ wrap.style.display = 'none'; return; }
  const pct = Math.round((feito / total) * 100);
  wrap.style.display = 'block';
  if(bar) bar.style.width = pct + '%';
  if(txt) txt.textContent = (texto || 'Processando') + ' — ' + feito + '/' + total + ' (' + pct + '%)';
}
function kbProgHide(){ const w = document.getElementById('kb-prog-wrap'); if(w) w.style.display = 'none'; }
function kbOrfMsg(t){ const el = document.getElementById('kb-orf'); if(el) el.textContent = t; }
function kbPorDisciplina(docs){
  const m = {};
  (docs || []).forEach(function(d){ const k = (d.disciplina || '').trim() || '(sem matéria)'; m[k] = (m[k] || 0) + 1; });
  return Object.keys(m).sort().map(function(k){ return k + ': ' + m[k]; });
}
async function kbFetchDocs(){
  const { data, error } = await PX.sb.from('knowledge_docs').select('*').eq('course_slug','prf-2021').order('disciplina');
  if(error) throw error;
  return data || [];
}

window.kbReindexar = async function(dryRun){
  const antes = KB_DOCS.slice();
  const lista = kbDiscList();
  kbLogReset(dryRun ? 'Prévia da reindexação (nada foi alterado)' : 'Reindexação da base', 'reindexar', dryRun ? 'previa' : 'real');
  kbOrfMsg(dryRun ? 'Simulando…' : 'Reindexando…');
  kbProg(0, 1, 'Lendo banco');
  let docs;
  try{ docs = await kbFetchDocs(); }
  catch(e){ kbProgHide(); kbOrfMsg('Erro: ' + e.message); return; }
  kbLog(docs.length + ' documento(s) lidos do banco.');

  const antesMap = {}; antes.forEach(function(d){ antesMap[d.id] = d; });
  const virarOrfao = [], recuperar = [], novos = [], removidos = [];
  const orfaosAgora = [];
  docs.forEach(function(d, i){
    const eraOrfao = antesMap[d.id] ? !PXKB.validarDisciplina(antesMap[d.id].disciplina, lista) : null;
    const ehOrfao = !PXKB.validarDisciplina(d.disciplina, lista);
    if(ehOrfao) orfaosAgora.push(d);
    let resultado = 'inalterado';
    if(eraOrfao === null){ novos.push(d); resultado = 'novo'; }
    else if(!eraOrfao && ehOrfao){ virarOrfao.push(d); resultado = 'virou órfão'; }
    else if(eraOrfao && !ehOrfao){ recuperar.push(d); resultado = 'recuperou disciplina'; }
    else if(ehOrfao) resultado = 'segue órfão';
    kbLogRow({ id:d.id, titulo:d.titulo || d.topico || '', origem:(d.disciplina || '').trim() || '(sem matéria)',
      destino:'', resultado:resultado, detalhe: dryRun ? 'prévia — nada aplicado' : '' });
    if(i % 25 === 0 || i === docs.length - 1) kbProg(i + 1, docs.length, 'Analisando documentos');
  });
  const idsNovos = {}; docs.forEach(function(d){ idsNovos[d.id] = 1; });
  antes.forEach(function(d){ if(!idsNovos[d.id]) removidos.push(d); });

  kbProg(docs.length, docs.length, 'Análise concluída');
  kbLog('Resultado por disciplina:');
  kbPorDisciplina(docs).forEach(function(l){ kbLog('  • ' + l); });
  kbLog('Órfãos após reindexar: ' + orfaosAgora.length);
  kbLog('Vão virar órfãos: ' + virarOrfao.length + (virarOrfao.length ? ' → ' + virarOrfao.slice(0,10).map(function(d){ return (d.titulo || d.topico || d.id) + ' [' + (d.disciplina||'sem matéria') + ']'; }).join('; ') : ''));
  kbLog('Vão recuperar disciplina válida: ' + recuperar.length + (recuperar.length ? ' → ' + recuperar.slice(0,10).map(function(d){ return (d.titulo || d.topico || d.id) + ' [' + d.disciplina + ']'; }).join('; ') : ''));
  if(novos.length) kbLog('Novos desde a última leitura: ' + novos.length);
  if(removidos.length) kbLog('Sumiram do banco: ' + removidos.length);
  kbLogResumo({
    'Documentos lidos': docs.length,
    'Órfãos após a análise': orfaosAgora.length,
    'Viram órfãos': virarOrfao.length,
    'Recuperam disciplina': recuperar.length,
    'Novos desde a última leitura': novos.length,
    'Sumiram do banco': removidos.length,
    'Por disciplina': kbPorDisciplina(docs).join(' | '),
  });



  if(dryRun){
    kbLog('Prévia — nenhuma alteração aplicada. Use "Reindexar base" para confirmar.');
    kbOrfMsg('Prévia: ' + docs.length + ' documento(s), ' + orfaosAgora.length + ' órfão(s), ' + virarOrfao.length + ' novo(s) órfão(s), ' + recuperar.length + ' recuperado(s).');
    return;
  }
  await loadKB(); kbPaint();
  kbLog('Base reindexada com sucesso.');
  kbProgHide();
  kbOrfMsg('Base reindexada: ' + KB_DOCS.length + ' conteúdo(s), ' + PXKB.encontrarOrfaos(KB_DOCS, kbDiscList()).length + ' órfão(s).');
};

window.kbCorrigirOrfaos = async function(acao){
  const orfaos = PXKB.encontrarOrfaos(KB_DOCS, kbDiscList());
  if(!orfaos.length) return;
  const destino = kbValidDisc(kbDisc);
  if(acao === 'mover' && !destino) return alert('Selecione uma matéria válida para receber os conteúdos órfãos.');
  const txt = acao === 'mover'
    ? 'Mover ' + orfaos.length + ' conteúdo(s) órfão(s) para "' + destino + '"?'
    : 'Excluir definitivamente ' + orfaos.length + ' conteúdo(s) órfão(s)?';
  if(!confirm(txt)) return;
  kbLogReset(acao === 'mover' ? 'Movendo órfãos para ' + destino : 'Excluindo órfãos', acao === 'mover' ? 'mover_orfaos' : 'excluir_orfaos', 'real');
  kbOrfMsg('Processando…');
  let feito = 0;
  const porOrigem = {};
  for(const d of orfaos){
    const { error } = acao === 'mover'
      ? await PX.sb.from('knowledge_docs').update({ disciplina:destino, updated_by:PX.user.id }).eq('id', d.id)
      : await PX.sb.from('knowledge_docs').delete().eq('id', d.id);
    feito++;
    const origem = (d.disciplina || '').trim() || '(sem matéria)';
    if(error){
      kbLog('✗ ' + (d.titulo || d.topico || d.id) + ' — erro: ' + error.message);
      kbLogRow({ id:d.id, titulo:d.titulo || d.topico || '', origem:origem, destino: acao === 'mover' ? destino : '', resultado:'erro', detalhe:error.message });
      kbLogResumo({ 'Processados antes do erro': feito - 1, 'Erro': error.message });
      kbProgHide();
      kbOrfMsg('Erro: ' + error.message);
      return;
    }
    porOrigem[origem] = (porOrigem[origem] || 0) + 1;
    kbLogRow({ id:d.id, titulo:d.titulo || d.topico || '', origem:origem, destino: acao === 'mover' ? destino : '',
      resultado: acao === 'mover' ? 'movido' : 'excluído', detalhe:'' });
    kbLog('✓ ' + (d.titulo || d.topico || d.id) + ' [' + origem + ']' + (acao === 'mover' ? ' → ' + destino : ' excluído'));
    kbProg(feito, orfaos.length, acao === 'mover' ? 'Movendo' : 'Excluindo');
  }
  kbLog('Resultado por disciplina de origem:');
  Object.keys(porOrigem).sort().forEach(function(k){ kbLog('  • ' + k + ': ' + porOrigem[k]); });
  kbLogResumo({
    'Ação': acao === 'mover' ? 'mover órfãos' : 'excluir órfãos',
    'Documentos processados': orfaos.length,
    'Disciplina de destino': acao === 'mover' ? destino : '—',
    'Por disciplina de origem': Object.keys(porOrigem).sort().map(function(k){ return k + ': ' + porOrigem[k]; }).join(' | '),
  });
  await logAdmin(acao === 'mover' ? 'reindexar_conhecimento' : 'limpar_orfaos_conhecimento','knowledge_docs', null, { total:orfaos.length, destino:destino||null });
  await loadKB(); kbPaint();
  kbProgHide();
  kbLog('Concluído: ' + orfaos.length + ' documento(s) processados.');
  kbOrfMsg(orfaos.length + ' conteúdo(s) órfão(s) ' + (acao === 'mover' ? 'movidos para ' + destino + '.' : 'excluídos.'));
};


/* Editor de aula: cresce conforme o texto, sem limite de caracteres. */
window.kbAutoGrow = function(el){
  if(!el) return;
  if(!document.getElementById('kb-editor-wrap')?.classList.contains('is-full')){
    el.style.height = 'auto';
    el.style.height = Math.max(420, el.scrollHeight + 4) + 'px';
  }
  const c = document.getElementById('kb-chars');
  if(c) c.textContent = String(el.value.length).replace(/\B(?=(\d{3})+(?!\d))/g,'.') + ' caracteres';
};
window.kbToggleExpand = function(){
  const wrap = document.getElementById('kb-editor-wrap');
  if(!wrap) return;
  const full = wrap.classList.toggle('is-full');
  document.body.style.overflow = full ? 'hidden' : '';
  const b = document.getElementById('kb-expand');
  if(b) b.textContent = full ? 'Sair da tela cheia' : 'Tela cheia';
  const t = document.getElementById('kb-txt');
  if(t){ t.style.height = full ? '' : 'auto'; kbAutoGrow(t); t.focus(); }
};

window.kbSave = async function(){
  const msg = document.getElementById('kb-msg');
  const conteudo = document.getElementById('kb-txt').value;
  const atual = kbFind(kbDisc, kbTopic);
  let payload;
  try{
    payload = PXKB.montarDoc({ disciplina:kbDisc, discList:kbDiscList(), topico:kbTopic,
      titulo:document.getElementById('kb-tit').value, conteudo,
      status: kbStatusDoc(atual), userId:PX.user.id });
  }catch(e){ if(msg) msg.textContent = e.message; return; }
  const disciplinaSelecionada = payload.disciplina;
  msg.textContent = 'Salvando em ' + disciplinaSelecionada + (kbTopic ? ' › ' + kbTopic : ' (visão geral)') + '…';

  const doc = kbFind(disciplinaSelecionada, kbTopic);
  const { error } = doc
    ? await PX.sb.from('knowledge_docs').update(payload).eq('id', doc.id)
    : await PX.sb.from('knowledge_docs').insert(payload);
  if(error){ msg.textContent = 'Erro: ' + error.message; return; }
  await logAdmin('salvar_conhecimento','knowledge_docs', doc?doc.id:null, { disciplina:disciplinaSelecionada, topico:kbTopic });
  await loadKB(); kbPaint();
  document.getElementById('kb-msg').textContent = 'Conteúdo salvo em ' + disciplinaSelecionada + '. A Athena já usa este material.';
};
/* Muda o status da aula selecionada (rascunho ↔ publicado). */
window.kbSetStatus = async function(status){
  const doc = kbFind(kbDisc, kbTopic);
  const msg = document.getElementById('kb-msg');
  if(!doc){ if(msg) msg.textContent = 'Salve o conteúdo antes de mudar o status.'; return; }
  if(msg) msg.textContent = 'Atualizando status…';
  const { error } = await PX.sb.from('knowledge_docs')
    .update({ status: status, publicado: status === 'publicado' }).eq('id', doc.id);
  if(error){ if(msg) msg.textContent = 'Erro: ' + error.message; return; }
  await logAdmin('status_conhecimento','knowledge_docs', doc.id, { status });
  await loadKB(); kbPaint();
  const m2 = document.getElementById('kb-msg');
  if(m2) m2.textContent = status === 'publicado' ? 'Aula publicada — já aparece para os alunos.'
    : 'Aula voltou para rascunho e saiu do ar.';
};
/* Publica (ou despublica) direto da lista de revisão, sem abrir o editor. */
window.kbPublicarDoc = async function(id, publicar){
  const box = document.getElementById('kb-fila-msg');
  if(box) box.textContent = publicar ? 'Publicando…' : 'Despublicando…';
  const { error } = await PX.sb.from('knowledge_docs')
    .update({ status: publicar ? 'publicado' : 'rascunho', publicado: !!publicar }).eq('id', id);
  if(error){ if(box) box.textContent = 'Erro: ' + error.message; return; }
  await logAdmin('status_conhecimento','knowledge_docs', id, { status: publicar ? 'publicado' : 'rascunho' });
  await loadKB(); kbPaint();
  const b2 = document.getElementById('kb-fila-msg');
  if(b2) b2.textContent = publicar ? 'Aula publicada — já aparece para o aluno.' : 'Aula despublicada.';
};
/* Publica de uma vez todas as aulas pendentes de uma matéria. */
window.kbPublicarDisc = async function(d){
  const pend = KB_DOCS.filter(function(x){ return x.disciplina === d && (x.conteudo||'').trim() && kbStatusDoc(x) !== 'publicado'; });
  if(!pend.length) return;
  if(!confirm('Publicar ' + pend.length + ' aula(s) de ' + d + ' para os alunos?')) return;
  const box = document.getElementById('kb-fila-msg');
  if(box) box.textContent = 'Publicando ' + pend.length + ' aula(s)…';
  const { error } = await PX.sb.from('knowledge_docs')
    .update({ status:'publicado', publicado:true }).in('id', pend.map(function(x){ return x.id; }));
  if(error){ if(box) box.textContent = 'Erro: ' + error.message; return; }
  await logAdmin('publicar_materia','knowledge_docs', null, { disciplina:d, total:pend.length });
  await loadKB(); kbPaint();
  const b2 = document.getElementById('kb-fila-msg');
  if(b2) b2.textContent = pend.length + ' aula(s) de ' + d + ' publicadas.';
};
window.kbDelete = async function(id){
  if(!confirm('Excluir este conteúdo da base?')) return;
  const { error } = await PX.sb.from('knowledge_docs').delete().eq('id', id);
  if(error) return alert(error.message);
  await logAdmin('excluir_conhecimento','knowledge_docs', id);
  await loadKB(); kbPaint();
};

  catch(e){ view.innerHTML = '<div class="card"><p class="muted">Erro ao carregar: '+esc(e.message||e)+'</p></div>'; }

function gateForm(msg){
  document.getElementById('tabs').innerHTML = '';
  view.innerHTML = `
    <div class="card" style="max-width:420px;margin:0 auto">
      <h2 style="font-size:1rem;font-weight:700;margin-bottom:4px">Acesso administrativo</h2>
      <p class="muted" style="margin-bottom:12px">${esc(msg||'Entre com a conta de administrador. O primeiro acesso vira admin automaticamente.')}</p>
      <label class="muted">E-mail</label>
      <input id="a-email" type="email" placeholder="admin@provax.com" style="margin:4px 0 10px">
      <label class="muted">Senha</label>
      <input id="a-pass" type="password" placeholder="mínimo 6 caracteres" style="margin:4px 0 14px">
      <div style="display:flex;gap:8px">
        <button class="act primary" id="a-in" style="flex:1">Entrar</button>
        <button class="act" id="a-up" style="flex:1">Criar admin</button>
      </div>
      <p class="muted" id="a-msg" style="margin-top:10px"></p>
    </div>`;
  const m = document.getElementById('a-msg');
  const creds = () => [document.getElementById('a-email').value.trim(), document.getElementById('a-pass').value];
  document.getElementById('a-in').onclick = async () => {
    const [e,p] = creds(); m.textContent = 'Entrando…';
    const { error } = await PX.signIn(e, p);
    if (error) { m.textContent = error.message; return; }
    boot();
  };
  document.getElementById('a-up').onclick = async () => {
    const [e,p] = creds(); m.textContent = 'Criando conta…';
    const { error } = await PX.signUp(e, p, 'Administrador');
    if (error) { m.textContent = error.message; return; }
    const r = await PX.signIn(e, p);
    if (r.error) { m.textContent = r.error.message; return; }
    boot();
  };
}

async function boot(){
  try { await PX.ready; } catch(e){}
  if (PX.bootError) {
    renderTabs();
    return gateForm('Não foi possível conectar ao servidor. Recarregue a página.');
  }
  if (!PX.user) { renderTabs(); return gateForm(); }
  if (!PX.isAdmin()) {
    try {
      const { data } = await PX.sb.rpc('claim_admin');
      if (data === true) { PX.roles.push('admin'); }
    } catch (e) {}
  }
  if (!PX.isAdmin()) {
    renderTabs();
    gateForm('Esta conta (' + PX.user.email + ') está autenticada, mas ainda não possui o papel de administrador. Se a permissão acabou de ser concedida, clique em "Tentar novamente".');
    const box = document.querySelector('#view .card');
    if (box) {
      const p = document.createElement('p');
      p.style.marginTop = '10px';
      p.innerHTML = '<button class="act primary" id="a-retry" style="width:100%;margin-bottom:8px">Tentar novamente</button>'
                  + '<button class="act danger" id="a-out" style="width:100%">Sair desta conta</button>';
      box.appendChild(p);
      document.getElementById('a-retry').onclick = async () => {
        const btn = document.getElementById('a-retry');
        btn.textContent = 'Verificando…';
        try {
          const { data } = await PX.sb.from('user_roles').select('role').eq('user_id', PX.user.id);
          PX.roles = (data || []).map(r => r.role);
        } catch (e) {}
        if (PX.isAdmin()) { boot(); }
        else { btn.textContent = 'Tentar novamente'; document.getElementById('a-msg').textContent = 'Ainda sem permissão de administrador nesta conta.'; }
      };
      document.getElementById('a-out').onclick = async () => {
        await PX.sb.auth.signOut();
        location.href = 'home.html';
      };
    }
    return;
  }

  document.getElementById('who').textContent = PX.displayName();
  renderTabs();
  render();
}
boot();

  return d;
}
/** Diagnóstico de cobertura por matéria, usado tanto no contexto da IA quanto nas recomendações. */
function copDiagnostico(){
  try{
    return kbDiscList().map(function(d){
      const tops = kbTopicList(d);
      const faltam = tops.filter(function(t){ return !((kbFind(d,t)||{}).conteudo||'').trim(); });
      const docs = KB_LIB.filter(function(x){ return x.discipline_nome === d; });
      const semTopico = docs.filter(function(x){ return !x.topic_nome; }).length;
      return { disc:d, total:tops.length, faltam:faltam, docs:docs.length, semTopico:semTopico,
               nomes: docs.slice(0,8).map(function(x){ return x.nome_arquivo; }) };
    });
  }catch(e){ return []; }
}
function copContexto(){
  const linhas = copDiagnostico().map(function(c){
    return c.disc + ': ' + (c.total - c.faltam.length) + '/' + c.total + ' tópicos com material, ' + c.docs +
      ' documentos-fonte (' + c.semTopico + ' ainda sem tópico atribuído).' +
      ' Documentos: ' + (c.nomes.length ? c.nomes.join(' | ') : 'nenhum') + '.' +
      ' Tópicos sem material: ' + (c.faltam.length ? c.faltam.slice(0,25).join('; ') : 'nenhum');
  });
  return linhas.length ? 'Curso prf-2021. Matérias e cobertura:\n' + linhas.join('\n') : '';
}
/** Painel de recomendações acionáveis: lacunas concretas + o que anexar, com atalho para a matéria/tópico. */
window.copRecomendar = async function(){
  const p = document.getElementById('cop-panel');
  if(p.style.display === 'none') copToggle();
  const diag = copDiagnostico().filter(function(c){ return c.faltam.length || c.semTopico || !c.docs; });
  const box = document.getElementById('cop-msgs');
  const card = document.createElement('div');
  card.style.cssText = 'align-self:stretch;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:12px;padding:12px';
  if(!diag.length){
    card.innerHTML = '<b>Cobertura completa.</b><div class="muted">Todos os tópicos do edital já têm material vinculado.</div>';
  } else {
    const ordenado = diag.slice().sort(function(a,b){ return b.faltam.length - a.faltam.length; }).slice(0,6);
    card.innerHTML = '<b style="font-size:0.86rem">O que falta para completar o edital</b>' + ordenado.map(function(c){
      const acoes = [];
      if(!c.docs) acoes.push('anexe o primeiro material desta matéria (PDF da apostila, lei seca ou aula em texto)');
      if(c.semTopico) acoes.push(c.semTopico + ' documento(s) já enviados estão sem tópico — use "Distribuir com IA" ou ajuste manualmente');
      if(c.faltam.length) acoes.push('faltam ' + c.faltam.length + ' de ' + c.total + ' tópicos com material');
      return '<div style="margin-top:10px;border-top:1px solid #E2E8F0;padding-top:8px">' +
        '<div><b>' + esc(c.disc) + '</b></div>' +
        '<div class="muted">' + esc(acoes.join(' · ')) + '</div>' +
        (c.faltam.length ? '<div class="muted" style="margin-top:4px">Tópicos: ' + esc(c.faltam.slice(0,6).join(' · ')) +
          (c.faltam.length > 6 ? ' e mais ' + (c.faltam.length - 6) : '') + '</div>' : '') +
        '<button class="act" style="margin-top:6px" onclick="copIr(\'' + escJs(c.disc) + '\',\'' + escJs(c.faltam[0] || '') + '\')">Abrir matéria</button>' +
        '</div>';
    }).join('');
  }
  box.appendChild(card);
  box.scrollTop = box.scrollHeight;

  const pend = copBolha('assistant','Analisando quais documentos anexar…');
  try{
    const j = await kbPost('/api/public/admin-copilot', {
      pergunta: 'Com base na cobertura atual, liste recomendações acionáveis: para cada matéria com lacuna, diga exatamente quais tópicos faltam e que tipo de documento ou trecho eu devo anexar (lei, súmula, apostila, jurisprudência, aula em texto) para fechar essa lacuna. Priorize as maiores lacunas e seja concreto.',
      contexto: copContexto().slice(0, 20000),
    });
    pend.textContent = j.resposta;
    COP_HIST.push({ role:'assistant', content:j.resposta });
  }catch(e){
    pend.textContent = e.message || 'Não consegui gerar as recomendações agora.';
  }
};
window.copIr = function(disc, topico){
  try{
    if(typeof kbSetStep === 'function') kbSetStep('conteudo');
    kbSelDisc(disc);
    if(topico) kbSelTopic(topico);
    copToggle();
  }catch(e){}
};
window.copEnviar = async function(){
  const inp = document.getElementById('cop-in');
  const q = inp.value.trim();
  if(!q) return;
  inp.value = '';
  copBolha('user', q);
  COP_HIST.push({ role:'user', content:q });
  const pend = copBolha('assistant', 'Pensando…');
  try{
    const j = await kbPost('/api/public/admin-copilot', {
      pergunta: q,
      contexto: copContexto().slice(0, 20000),
      historico: COP_HIST.slice(-8),
    });
    pend.textContent = j.resposta;
    COP_HIST.push({ role:'assistant', content:j.resposta });
  }catch(e){
    pend.textContent = e.message || 'Não consegui responder agora.';
  }
};
document.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && document.activeElement && document.activeElement.id === 'cop-in'){ e.preventDefault(); copEnviar(); }
});
</script>
