<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cobertura do Edital – Prova X</title>
<link rel="stylesheet" href="shell.css">
<style>
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-top:22px; }
  .kpi { background:#fff; border:1px solid #E2E8F0; border-radius:12px; padding:14px 16px; }
  .kpi .k { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:#94A3B8; font-weight:600; }
  .kpi .v { font-size:1.5rem; font-weight:700; letter-spacing:-.02em; margin-top:6px; }
  .chap { background:#fff; border:1px solid #E2E8F0; border-radius:12px; margin-top:12px; overflow:hidden; }
  .chap-h { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; }
  .chap-h .cn { font-size:.95rem; font-weight:600; min-width:0; }
  .chap-h .cs { font-size:.76rem; color:#64748B; margin-top:3px; }
  .chap-h .right { display:flex; align-items:center; gap:10px; }
  .chap-h .track { width:130px; }
  .chap-b { display:none; border-top:1px solid #F1F5F9; }
  .chap.open .chap-b { display:block; }
  .trow { display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:10px; padding:11px 16px; border-bottom:1px solid #F8FAFC; }
  .trow .tn { font-size:.87rem; min-width:0; }
  .badge { font-size:.68rem; font-weight:700; border-radius:999px; padding:3px 9px; white-space:nowrap; }
  .badge.ok { background:#ECFDF5; color:#047857; }
  .badge.miss { background:#FEF2F2; color:#B91C1C; }
  .badge.done { background:#E8EEF9; color:#154C9B; }
  @media (max-width:640px){ .chap-h .track{width:70px} .trow{grid-template-columns:auto minmax(0,1fr)} }
</style>
  <script src="px-guard.js"></script>
</head>
<body>
<aside id="shell-sidebar"></aside>
<div class="shell-main">
  <header id="shell-topbar"></header>
  <div class="shell-body">
    <div class="page">
      <h1 class="title">Cobertura do Edital</h1>
      <p class="subtitle">Validação capítulo a capítulo do edital do Concurso PRF: o que já está disponível no app, o que falta e o que você marcou como estudado.</p>

      <div class="kpis" id="kpis"></div>
      <div id="out" style="margin-top:20px"></div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="shell.js"></script>
<script>
renderShell({ active: 'cobertura' });

const MAT = materialById('prf-2021');
const COB = coberturaEdital('prf-2021');

const totRef = COB.reduce((a, c) => a + c.ref.length, 0);
const totCob = COB.reduce((a, c) => a + c.cobertos.length, 0);
const totFalta = COB.reduce((a, c) => a + c.faltando.length, 0);
const totEst = COB.reduce((a, c) => a + c.estudados.length, 0);
const pctGeral = totRef ? Math.round((totCob / totRef) * 100) : 100;

document.getElementById('kpis').innerHTML = `
  <div class="kpi"><div class="k">Cobertura do edital</div><div class="v">${pctGeral}%</div></div>
  <div class="kpi"><div class="k">Capítulos</div><div class="v">${COB.length}</div></div>
  <div class="kpi"><div class="k">Tópicos no app</div><div class="v">${totCob}/${totRef}</div></div>
  <div class="kpi"><div class="k">Tópicos faltando</div><div class="v">${totFalta}</div></div>
  <div class="kpi"><div class="k">Marcados como estudados</div><div class="v">${totEst}</div></div>`;

function href(disc, topic) {
  const base = `id=prf-2021&title=${encodeURIComponent(MAT.title)}&type=${encodeURIComponent(MAT.type)}&disc=${encodeURIComponent(disc)}`;
  return topic ? `workspace.html?${base}&topic=${encodeURIComponent(topic)}` : `disciplina.html?${base}`;
}

document.getElementById('out').innerHTML = COB.map((c, i) => `
  <div class="chap${i === 0 ? ' open' : ''}">
    <div class="chap-h" onclick="this.parentNode.classList.toggle('open')">
      <div>
        <div class="cn">${c.disc}</div>
        <div class="cs">${c.cobertos.length} de ${c.ref.length} tópicos no app · ${c.estudados.length} estudados${c.faltando.length ? ` · ${c.faltando.length} faltando` : ''}</div>
      </div>
      <div class="right">
        <div class="track"><div class="fill ${fillClass(c.pct)}" style="width:${c.pct}%"></div></div>
        <div class="pct">${c.pct}%</div>
      </div>
    </div>
    <div class="chap-b">
      ${c.ref.map(t => {
        const noApp = c.app.includes(t);
        const est = noApp && pxStudyGet(t).done;
        return `<div class="trow">
          <span class="badge ${noApp ? 'ok' : 'miss'}">${noApp ? 'No app' : 'Faltando'}</span>
          <span class="tn">${noApp ? `<a href="${href(c.disc, t)}" style="color:inherit;text-decoration:none">${t}</a>` : t}</span>
          ${est ? '<span class="badge done">Estudado</span>' : '<span></span>'}
        </div>`;
      }).join('')}
    </div>
  </div>`).join('');
</script>
</body>
</html>
