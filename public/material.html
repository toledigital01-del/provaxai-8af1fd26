<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Redirecionando…</title>
<script src="data.js"></script>
<script>
  const p = new URLSearchParams(location.search);
  const id = p.get('id') || 'prf-2021';
  const m = materialById(id);
  const title = p.get('title') || (m ? m.title : 'Material');
  const type = p.get('type') || (m ? m.type : 'Material');
  const base = `id=${encodeURIComponent(id)}&type=${encodeURIComponent(type)}&title=${encodeURIComponent(title)}`;
  const disc = p.get('disc');
  const discs = disciplinasDe(id);
  location.replace(disc || discs.length === 1
    ? `disciplina.html?${base}&disc=${encodeURIComponent(disc || discs[0])}`
    : `disciplinas.html?${base}`);
</script>
</head>
<body></body>
</html>
