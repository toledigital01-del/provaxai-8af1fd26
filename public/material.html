<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material – Studley AI</title>
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; background:#fff; color:#111827; height:100vh; overflow:hidden; display:flex; }

  .sidebar { width:220px; min-width:220px; background:#FFE1D9; height:100vh; display:flex; flex-direction:column; padding:16px 12px; flex-shrink:0; }
  .sidebar-logo { display:flex; align-items:center; gap:8px; padding:6px 8px; margin-bottom:20px; text-decoration:none; margin-top:4px; }
  .sidebar-logo-text { font-weight:800; font-size:1.4rem; letter-spacing:-0.03em; background:linear-gradient(to right,#FF8040,#FF4D00); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .nav-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; cursor:pointer; font-size:0.9rem; font-weight:500; color:#6B2D00; text-decoration:none; transition:background .15s; margin-bottom:2px; }
  .nav-item:hover { background:rgba(255,255,255,.5); }
  .nav-item.active { background:#fff; color:#FF4D00; font-weight:600; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .upgrade-btn { display:block; width:100%; text-align:center; padding:11px 12px; border:none; border-radius:999px; background:linear-gradient(to right,#FF8040,#FF4D00); color:#fff; font-weight:700; font-size:0.85rem; cursor:pointer; margin-bottom:12px; box-shadow:0 4px 14px rgba(255,77,0,.3); }
  .user-chip { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:14px; background:#fff; border:1px solid rgba(255,77,0,.15); cursor:pointer; width:100%; }
  .avatar { width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,#FF8040,#FF4D00); color:#fff; display:flex; align-items:center; justify-content:center; font-size:0.8rem; font-weight:700; }

  .main { flex:1; overflow-y:auto; padding:0 28px 60px; min-width:0; }
  .crumb { display:flex; align-items:center; gap:8px; font-size:0.8rem; color:#9CA3AF; padding:22px 0 10px; }
  .crumb a { color:#FF4D00; text-decoration:none; }
  .head { display:flex; align-items:flex-start; gap:16px; padding-bottom:18px; border-bottom:1px solid #EFEFEF; }
  .head h1 { font-size:1.7rem; font-weight:700; letter-spacing:-0.02em; }
  .badge { display:inline-block; margin-top:8px; font-size:0.72rem; font-weight:600; padding:4px 10px; border-radius:999px; background:#FFF0E8; color:#FF4D00; }
  .meta-line { font-size:0.8rem; color:#6B7280; margin-top:8px; }
  .head-progress { min-width:190px; }
  .track { height:6px; border-radius:999px; background:#EFEFEF; overflow:hidden; }
  .fill { height:100%; background:linear-gradient(to right,#FF8040,#FF4D00); border-radius:999px; }

  .filters { display:flex; gap:10px; align-items:center; margin:20px 0 18px; flex-wrap:wrap; }
  .search { flex:1; min-width:220px; display:flex; align-items:center; gap:8px; border:1px solid #E9E9E9; border-radius:10px; padding:9px 12px; background:#FAFAFA; }
  .search input { border:none; background:transparent; outline:none; font-size:0.88rem; width:100%; font-family:inherit; }
  .chip { border:1px solid #E9E9E9; background:#fff; border-radius:999px; padding:7px 14px; font-size:0.8rem; color:#6B7280; cursor:pointer; }
  .chip.active { background:#111827; color:#fff; border-color:#111827; }

  .disc { border:1px solid #E9E9E9; border-radius:12px; margin-bottom:12px; overflow:hidden; background:#fff; }
  .disc-head { display:flex; align-items:center; gap:14px; padding:14px 16px; cursor:pointer; }
  .disc-head:hover { background:#FAFAFA; }
  .caret { color:#9CA3AF; font-size:0.8rem; transition:transform .15s; }
  .disc.open .caret { transform:rotate(90deg); }
  .disc-name { font-size:0.98rem; font-weight:600; flex:1; }
  .disc-meta { font-size:0.76rem; color:#9CA3AF; min-width:80px; text-align:right; }
  .disc-prog { width:140px; }
  .topics { display:none; border-top:1px solid #EFEFEF; padding:6px 16px 14px; }
  .disc.open .topics { display:block; }
  .topic { display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid #F5F5F5; flex-wrap:wrap; }
  .topic:last-child { border-bottom:none; }
  .topic-name { font-size:0.88rem; color:#374151; flex:1; min-width:180px; }
  .status { font-size:0.7rem; font-weight:600; padding:3px 9px; border-radius:999px; }
  .st-nao { background:#FFF1F0; color:#E11D48; }
  .st-apr { background:#FFF4E8; color:#EA7317; }
  .st-fam { background:#EFF6FF; color:#2563EB; }
  .st-dom { background:#F0FDF4; color:#16A34A; }
  .tacts { display:flex; gap:5px; flex-wrap:wrap; }
  .tact { border:1px solid #EFEFEF; background:#fff; border-radius:7px; padding:4px 9px; font-size:0.72rem; color:#6B7280; cursor:pointer; text-decoration:none; }
  .tact:hover { border-color:#FF8040; color:#FF4D00; }

  .folders { width:280px; min-width:280px; border-left:1px solid #EFEFEF; padding:20px 18px; overflow-y:auto; background:#fff; }
  .folders-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .folders-head h2 { font-size:1.05rem; font-weight:600; }
  .new-folder { width:100%; padding:11px; border:none; border-radius:10px; background:#2563EB; color:#fff; font-size:0.88rem; font-weight:600; cursor:pointer; margin-bottom:16px; }
  .folder-item { display:flex; gap:12px; align-items:flex-start; padding:14px; border-radius:10px; cursor:pointer; margin-bottom:10px; border:1px solid #EFEFEF; }
  .folder-item .fname { font-size:0.85rem; font-weight:600; }
  .folder-item .fsub { font-size:0.72rem; color:#9CA3AF; margin-top:2px; }
  ::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-thumb { background:#E5E5E5; border-radius:3px; }
</style>
</head>
<body>

<aside class="sidebar">
  <a href="study-sets.html" class="sidebar-logo">
    <svg width="28" height="28" viewBox="0 0 32 32" fill="none"><path d="M16 2C16 2 8 10 8 18C8 22.4 11.6 26 16 26C20.4 26 24 22.4 24 18C24 10 16 2 16 2Z" fill="#FF4D00"/><path d="M16 8C16 8 11 14 11 18C11 20.8 13.2 23 16 23C18.8 23 21 20.8 21 18C21 14 16 8 16 8Z" fill="#FF8040"/><circle cx="16" cy="19" r="3" fill="#FFF0E8"/></svg>
    <span class="sidebar-logo-text">Studley</span>
  </a>
  <nav style="flex:1;display:flex;flex-direction:column;gap:2px;">
    <a href="study-sets.html" class="nav-item active"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Meus Materiais</span></a>
    <a href="solve.html" class="nav-item"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><span>Resolver</span></a>
    <a href="paper-grader.html" class="nav-item"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="m9 12 2 2 4-4"/></svg><span>Corretor de Trabalhos</span></a>
    <a href="app.html" class="nav-item"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18" stroke-width="2.5" stroke-linecap="round"/></svg><span>App</span></a>
  </nav>
  <button class="upgrade-btn" onclick="location.href='pricing.html'">Atualizar para Ilimitado</button>
  <button class="user-chip" onclick="alert('Perfil em breve!')">
    <div class="avatar">F</div>
    <span style="flex:1;text-align:left;font-size:0.88rem;font-weight:500;">Fernando</span>
    <svg width="14" height="14" fill="none" stroke="#9CA3AF" stroke-width="2.2" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
  </button>
</aside>

<main class="main">
  <div class="crumb"><a href="study-sets.html">Meus Materiais</a> <span>/</span> <span id="crumb-name">Material</span></div>
  <div class="head">
    <div style="flex:1;">
      <h1 id="m-title">Material</h1>
      <span class="badge" id="m-type">Edital</span>
      <div class="meta-line" id="m-meta"></div>
    </div>
    <div class="head-progress">
      <div style="display:flex;justify-content:space-between;font-size:0.78rem;color:#6B7280;margin-bottom:6px;"><span>Índice de domínio</span><span id="m-pct">0%</span></div>
      <div class="track"><div class="fill" id="m-fill" style="width:0%"></div></div>
    </div>
  </div>

  <div class="filters">
    <div class="search">
      <svg width="15" height="15" fill="none" stroke="#9CA3AF" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="q" placeholder="Pesquisar disciplina ou tópico..." oninput="render()">
    </div>
    <button class="chip active" data-f="all" onclick="setFilter('all')">Todos</button>
    <button class="chip" data-f="nao" onclick="setFilter('nao')">Não Familiar</button>
    <button class="chip" data-f="apr" onclick="setFilter('apr')">Aprendendo</button>
    <button class="chip" data-f="fam" onclick="setFilter('fam')">Familiar</button>
    <button class="chip" data-f="dom" onclick="setFilter('dom')">Dominado</button>
  </div>

  <div id="tree"></div>
</main>

<aside class="folders">
  <div class="folders-head"><h2>Pastas</h2></div>
  <button class="new-folder" onclick="alert('Criar nova pasta em breve!')">+ Criar Nova Pasta</button>
  <div class="folder-item" style="border-left:4px solid #111827;"><div><div class="fname">Concursos</div><div class="fsub">4 materiais</div></div></div>
  <div class="folder-item" style="border-left:4px solid #7C3AED;"><div><div class="fname">Faculdade</div><div class="fsub">2 materiais</div></div></div>
  <div class="folder-item" style="border-left:4px solid #16A34A;"><div><div class="fname">Direito</div><div class="fsub">3 materiais</div></div></div>
  <div class="folder-item" style="border-left:4px solid #DC2626;"><div><div class="fname">Medicina</div><div class="fsub">0 materiais</div></div></div>
  <div class="folder-item" style="border-left:4px solid #2563EB;"><div><div class="fname">Idiomas</div><div class="fsub">1 material</div></div></div>
  <div class="folder-item" style="border-left:4px solid #F59E0B;"><div><div class="fname">Trabalho</div><div class="fsub">0 materiais</div></div></div>
  <div class="folder-item" style="border-left:4px solid #EC4899;"><div><div class="fname">Pessoais</div><div class="fsub">0 materiais</div></div></div>
</aside>

<script src="data.js"></script>
<script>
const params = new URLSearchParams(location.search);
const title = params.get('title') || 'Concurso PRF 2021';
const type = params.get('type') || 'Edital';
document.getElementById('m-title').textContent = title;
document.getElementById('crumb-name').textContent = title;
document.getElementById('m-type').textContent = type;

const STATUSES = [['nao','Não Familiar','st-nao'],['apr','Aprendendo','st-apr'],['fam','Familiar','st-fam'],['dom','Dominado','st-dom']];
const TOPIC_ACTIONS = ['Resumo IA','Flashcards','Questões','Questões Comentadas','Revisão Espaçada','Mapa Mental','Anotações'];

let filter = 'all';
function setFilter(f){ filter=f; document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active', c.dataset.f===f)); render(); }

const id = params.get('id') || 'prf-2021';
const disc = params.get('disc');
const allDiscs = disciplinasDe(id);
const DATA = (disc ? [disc] : allDiscs).map(disciplinaInfo);

// breadcrumb: quando veio de uma disciplina, mostra o caminho completo
if (disc) {
  document.getElementById('crumb-name').innerHTML =
    allDiscs.length > 1
      ? `<a href="disciplinas.html?id=${encodeURIComponent(id)}&type=${encodeURIComponent(type)}&title=${encodeURIComponent(title)}">${title}</a> <span>/</span> <span>${disc}</span>`
      : `${title} <span style="color:#9CA3AF;">/</span> ${disc}`;
  document.getElementById('m-title').textContent = disc;
  document.getElementById('m-type').textContent = 'Disciplina';
}

const totalTopics = DATA.reduce((a,d)=>a+d.topics.length,0);
const overall = DATA.length ? Math.round(DATA.reduce((a,d)=>a+d.pct,0)/DATA.length) : 0;
document.getElementById('m-pct').textContent = overall+'%';
document.getElementById('m-fill').style.width = overall+'%';
document.getElementById('m-meta').textContent = disc
  ? `${totalTopics} tópicos · Índice de domínio ${overall}% · Último acesso hoje`
  : `${DATA.length} disciplinas · ${totalTopics} tópicos · 214 páginas · Enviado em 12/03/2026 · Último acesso hoje · 14h32min estudados`;

function render(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  const tree = document.getElementById('tree');
  const html = DATA.map((d,i) => {
    const topics = d.topics.filter(t =>
      (filter==='all' || t.st===filter) &&
      (!q || t.name.toLowerCase().includes(q) || d.name.toLowerCase().includes(q)));
    if (!topics.length) return '';
    const open = (q || filter!=='all' || i===0) ? 'open' : '';
    return `<div class="disc ${open}">
      <div class="disc-head" onclick="this.parentElement.classList.toggle('open')">
        <span class="caret">▶</span>
        <span class="disc-name">${d.name}</span>
        <span class="disc-meta">${d.topics.length} tópicos</span>
        <span class="disc-prog"><span class="track" style="display:block;"><span class="fill" style="display:block;width:${d.pct}%"></span></span></span>
        <span class="disc-meta" style="min-width:36px;">${d.pct}%</span>
      </div>
      <div class="topics">
        ${topics.map(t => {
          const st = STATUSES.find(s=>s[0]===t.st);
          return `<div class="topic">
            <span class="topic-name">${t.name}</span>
            <span class="status ${st[2]}">${st[1]}</span>
            <span class="tacts">${TOPIC_ACTIONS.map(a=>`<a class="tact" href="lesson.html?set=topico&title=${encodeURIComponent(t.name+' — '+a)}">${a}</a>`).join('')}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
  tree.innerHTML = html || '<p style="color:#9CA3AF;font-size:0.9rem;">Nenhum tópico encontrado.</p>';
}
render();
</script>
</body>
</html>
