<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disciplina – Prova X</title>
<link rel="stylesheet" href="shell.css">
<style>
  .disc-layout { display:flex; align-items:stretch; min-height:100%; }
  .disc-main { flex:1; min-width:0; }
  .filters { display:flex; gap:6px; flex-wrap:wrap; margin-top:22px; }
  .chip { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line-strong); background:#fff; border-radius:999px; padding:5px 12px; font-size:0.78rem; color:var(--muted); cursor:pointer; font-family:inherit; transition:all .14s; }
  .chip:hover { background:#F6F6F7; }
  .chip.active { background:#2563EB; color:#fff; border-color:#2563EB; }

  .px-row { position:relative; flex-wrap:wrap; }
  .px-row .tlink { display:flex; align-items:center; gap:10px; min-width:0; text-decoration:none; color:inherit; }
  .px-check { width:17px; height:17px; accent-color:#2563EB; cursor:pointer; flex-shrink:0; }
  .note-btn { border:1px solid var(--line-strong); background:#fff; border-radius:8px; padding:4px 9px; font-size:.72rem; font-weight:600; color:var(--muted); cursor:pointer; font-family:inherit; white-space:nowrap; }
  .note-btn:hover { border-color:#2563EB; color:#1D4ED8; }
  .note-box { grid-column:1 / -1; width:100%; margin-top:10px; }
  .note-box textarea { width:100%; min-height:82px; border:1px solid var(--line-strong); border-radius:10px; padding:10px 12px; font-family:inherit; font-size:.85rem; resize:vertical; background:#fff; color:inherit; }
  .note-actions { display:flex; justify-content:flex-end; margin-top:8px; }
  .note-save { background:#2563EB; color:#fff; border:none; border-radius:8px; padding:7px 14px; font-size:.78rem; font-weight:600; cursor:pointer; font-family:inherit; }

  @media (max-width: 900px) {
    .disc-layout { flex-direction:column; }
  }
  @media (max-width: 640px) {
    .topic-row.px-row { grid-template-columns:1fr; gap:8px; }
    .px-row .topic-right { width:100%; }
  }


</style>
  <script src="px-guard.js"></script>
</head>
<body>
<aside id="shell-sidebar"></aside>
<div class="shell-main">
  <header id="shell-topbar"></header>
  <div class="shell-body">
    <div class="disc-layout">
      <div class="disc-main">
        <div class="page">
          <a class="page-back" id="page-back" href="#">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            <span id="page-back-label"></span>
          </a>
          <div class="crumb" id="crumb"></div>
          <h1 class="title" id="d-h1"></h1>
          <p class="subtitle" id="d-meta"></p>

          <div class="panel" id="cont-panel" style="display:none;margin-top:18px;">
            <h2>Continue de onde parou</h2>
            <div style="font-size:1.1rem;font-weight:600;letter-spacing:-0.02em;" id="cont-topic"></div>
            <div class="subtitle" style="margin-top:4px;" id="cont-sub"></div>
            <div class="progress-line"><div class="track"><div class="fill" id="cont-fill" style="width:0%"></div></div><div class="pct" id="cont-pct"></div></div>
            <a class="btn" id="cont-link" href="#">Continuar →</a>
          </div>


          <div class="filters">
            <button class="chip active" data-f="all">Todos</button>
            <button class="chip" data-f="nao"><span class="sdot" style="background:#EF4444"></span> Não Familiar</button>
            <button class="chip" data-f="apr"><span class="sdot" style="background:#F59E0B"></span> Aprendendo</button>
            <button class="chip" data-f="fam"><span class="sdot" style="background:#22C55E"></span> Familiar</button>
            <button class="chip" data-f="dom"><span class="sdot" style="background:#3B82F6"></span> Dominado</button>
          </div>

          <div class="topic-list" id="topics"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="shell.js"></script>
<script>
const params = new URLSearchParams(location.search);
const id = params.get('id') || 'prf-2021';
const mat = materialById(id);
const title = params.get('title') || (mat ? mat.title : 'Material');
const type = params.get('type') || (mat ? mat.type : 'Material');
const allDiscs = disciplinasDe(id);
const disc = params.get('disc') || allDiscs[0];
const info = disciplinaInfo(disc);

const base = `id=${encodeURIComponent(id)}&type=${encodeURIComponent(type)}&title=${encodeURIComponent(title)}`;
document.getElementById('crumb').innerHTML =
  `<a href="study-sets.html">Disciplinas</a><span class="sep">/</span><span>${disc}</span>`;

const wsBase = `workspace.html?${base}&disc=${encodeURIComponent(disc)}&scope=disc`;

renderShell({
  active: 'materiais',
  topicNav: {
    items: wsMenuHTML(t => `<a class="ws-item" href="${wsBase}&tab=${t.id}"><span class="ic">${t.ic}</span><span>${t.label}</span></a>`),
  },
});

document.getElementById('page-back').href = 'study-sets.html';
document.getElementById('page-back-label').textContent = 'Disciplinas';

document.getElementById('d-h1').textContent = disc;
document.getElementById('d-meta').textContent =
  `${info.topics.length} tópicos · Índice de domínio ${info.pct}%`;

function topicHref(name) {
  return `workspace.html?${base}&disc=${encodeURIComponent(disc)}&topic=${encodeURIComponent(name)}`;
}

/* Continue de onde parou nesta disciplina */
(function renderContinuar() {
  const last = pxLastGet(disc);
  /* só exibe quando o aluno realmente já abriu um tópico desta disciplina */
  if (!last || !info.topics.some(t => t.name === last.topic)) return;
  const nome = last.topic;
  const t = info.topics.find(x => x.name === nome);
  document.getElementById('cont-panel').style.display = '';
  document.getElementById('cont-topic').textContent = nome;
  document.getElementById('cont-sub').textContent = `Último tópico aberto · ${disc}`;

  const fill = document.getElementById('cont-fill');
  fill.className = 'fill ' + fillClass(t ? t.prog : 0);
  fill.style.width = (t ? t.prog : 0) + '%';
  document.getElementById('cont-pct').textContent = (t ? t.prog : 0) + '%';
  document.getElementById('cont-link').href = topicHref(nome);
})();


let filter = 'all';
document.querySelectorAll('.chip').forEach(c => c.onclick = () => {
  filter = c.dataset.f;
  document.querySelectorAll('.chip').forEach(x => x.classList.toggle('active', x === c));
  render();
});

function render() {
  const list = info.topics.filter(t => filter === 'all' || t.st === filter);
  document.getElementById('topics').innerHTML = list.length ? list.map(t => {
    const s = STATUS_META[t.st];
    const mk = pxStudyGet(t.name);
    return `<div class="topic-row px-row">
      <span class="topic-left">
        <input type="checkbox" class="px-check" data-t="${encodeURIComponent(t.name)}" ${mk.done ? 'checked' : ''} title="Marcar como estudado">
        <a class="tlink" href="${topicHref(t.name)}">
          <span class="dot">${dotHTML(t.st)}</span>
          <span class="tname">${t.name}</span>
        </a>
        <span class="tstatus">${mk.done ? 'Estudado' : s.label}</span>
      </span>
      <span class="topic-right">
        <button class="note-btn" data-n="${encodeURIComponent(t.name)}" title="Anotações do tópico">${mk.note ? '📝' : '＋'} Nota</button>
        <span class="track"><span class="fill ${fillClass(t.prog)}" style="display:block;width:${t.prog}%"></span></span>
        <span class="pct">${t.prog}%</span>
      </span>
      <div class="note-box" data-box="${encodeURIComponent(t.name)}" style="display:none">
        <textarea placeholder="Observações sobre ${t.name}…">${(mk.note || '').replace(/</g,'&lt;')}</textarea>
        <div class="note-actions"><button class="note-save" data-s="${encodeURIComponent(t.name)}">Salvar nota</button></div>
      </div>
    </div>`;
  }).join('') : '<div class="empty">Nenhum tópico com esse status.</div>';
}
render();

document.getElementById('topics').addEventListener('click', e => {
  const chk = e.target.closest('.px-check');
  if (chk) {
    const name = decodeURIComponent(chk.dataset.t);
    pxStudySet(name, { done: chk.checked });
    const t = info.topics.find(x => x.name === name);
    if (t) { t.st = statusOf(name); t.prog = progressOf(name); }
    render();
    return;
  }
  const nb = e.target.closest('.note-btn');
  if (nb) {
    const box = document.querySelector(`.note-box[data-box="${nb.dataset.n}"]`);
    if (box) box.style.display = box.style.display === 'none' ? 'block' : 'none';
    return;
  }
  const sv = e.target.closest('.note-save');
  if (sv) {
    const name = decodeURIComponent(sv.dataset.s);
    const box = document.querySelector(`.note-box[data-box="${sv.dataset.s}"]`);
    pxStudySet(name, { note: box.querySelector('textarea').value });
    render();
  }
});


</script>
</body>
</html>
