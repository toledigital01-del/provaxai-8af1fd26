<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus Concursos – Prova X</title>
<link rel="stylesheet" href="shell.css">
</head>
<body>
<aside id="shell-sidebar"></aside>
<div class="shell-main">
  <header id="shell-topbar"></header>
  <div class="shell-body">
    <div class="page">
      <h1 class="title">Meus Concursos</h1>
      <p class="subtitle">Escolha um concurso para continuar seus estudos</p>
      <div class="card-grid" id="mat-grid"></div>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="shell.js"></script>
<script>
  renderShell({ active: 'hoje' });

  document.getElementById('mat-grid').innerHTML = MATERIALS.map(m => `
    <a class="card" href="${materialHref(m)}">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <h3>${m.title}</h3><span class="tag">${m.soon ? 'EM BREVE' : m.type}</span>
      </div>
      <div class="cmeta">${m.disc} disciplinas · ${m.top} tópicos</div>
      <div class="progress-line"><div class="track"><div class="fill ${fillClass(m.pct)}" style="width:${m.pct}%"></div></div><div class="pct">${m.pct}%</div></div>
    </a>`).join('');
</script>
</body>
</html>
